    title: "Operating systems and version control"
    requires:
      - { track: linux, phase: p3 }
      - { track: git, phase: p2 }
  - id: s2
    title: "Containers and orchestration"
    requires:
      - { track: docker, phase: p3 }
      - { track: kubernetes, phase: p2 }
  - id: s3
    title: "Delivery and observability"
    requires:
