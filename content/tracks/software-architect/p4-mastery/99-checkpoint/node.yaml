kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-java, timeout_secs: 180 }
  hints:
    - |-
      Work in the order of a real migration, keeping everything green after each step. First the **abstraction**: `Category`, `PriceRequest` and the `Pricing` port, with `LegacyPricing` wrapping the engine, and `Checkout` taking a `Pricing`. Nothing behaves differently yet, and checkout no longer knows the engine: remove its line from the baseline. Then the **strangler** with every category on `LEGACY`, then `ModernPricing`, then the shadow run. Write the rules last and let the ratchet tell you whether the baseline is right.
    - |-
      `ModernPricing` computes `base = unit × quantity` and then one small method per category, rounding down after **each** percentage, as the engine does: `cents * percent / 100`. Groceries add the 300 cent handling fee to a base under 1000 **before** the member discount. In `StranglerPricing`, keep a `Map<Category, Mode>` and, per category, a small shadow-run record (how many comparisons, whether one differed) that you replace when a category enters `SHADOW` from another mode. Catch `RuntimeException` around the modern call only.
    - |-
      ```java
      public static SortedSet<String> violations(Map<String, Set<String>> classGraph) {
          SortedSet<String> found = new TreeSet<>();
          check(classGraph, "legacy", from -> !isRoot(from) && !from.startsWith("dojo.shop.pricing.legacy."),
                  to -> to.startsWith("dojo.legacy."), found);
          check(classGraph, "modern", from -> from.startsWith("dojo.shop.pricing.modern."),
                  to -> to.startsWith("dojo.shop.pricing.legacy.") || to.startsWith("dojo.shop.pricing.migration."), found);
          check(classGraph, "api", from -> !isRoot(from) && !from.startsWith("dojo.shop.pricing."),
                  to -> to.startsWith("dojo.shop.pricing.") && !to.startsWith("dojo.shop.pricing.api."), found);
          return found;
      }

      private static boolean isRoot(String className) {
          return className.startsWith("dojo.shop.") && className.lastIndexOf('.') == "dojo.shop".length();
      }
      ```
