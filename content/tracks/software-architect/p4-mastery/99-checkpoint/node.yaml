title: "🥋 Checkpoint 4: Final Exam"
summary: "Prove the whole track: a quiz on evolutionary architecture, fitness functions, documentation, governance and the advanced patterns, and a legacy pricing engine strangled behind a port, with a shadow run before each cut-over, fitness rules with a ratchet and a decision record."
objectives:
  - { id: o1, text: "Explain incremental migration, fitness functions and ratchets, C4 and arc42, architecture evaluation and governance, and connect them to the earlier phases", skills: [software-architect.evolutionary, software-architect.documentation-c4, software-architect.architect-role, software-architect.fitness-functions] }
  - { id: o2, text: "Migrate a legacy component incrementally with branch by abstraction, a strangler and a parallel run, guard the result with fitness functions and a ratchet, and record the decision", skills: [software-architect.evolutionary, software-architect.fitness-functions, software-architect.clean-hexagonal, software-architect.decision-records] }
