status: draft
title: "📋 Checkpoint 3: Advanced"
summary: "Prove the advanced phase: a quiz on aggregates, domain events, event-driven architecture and sagas, and a trip booking whose anemic trip becomes an aggregate and whose saga compensates refusals, ignores duplicate replies and dead-letters the rest."
objectives:
  - { id: o1, text: "Explain aggregates and domain events, the event-driven patterns, idempotent consumers, sagas and their compensations", skills: [software-architect.ddd-tactical, software-architect.event-driven, software-architect.integration-patterns] }
  - { id: o2, text: "Model a consistency boundary as an aggregate and orchestrate a saga across suppliers with compensations, an idempotent receiver and a dead letter channel, behind ports", skills: [software-architect.ddd-tactical, software-architect.integration-patterns, software-architect.clean-hexagonal] }
prerequisites: [software-architect.p3.integration-patterns]
difficulty: 4
estimated_minutes: 90
