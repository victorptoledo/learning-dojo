id: java.p1.anagram-groups
kind: kata
status: draft
title: "Anagram Groups"
summary: "Group words into anagram families with a Map of Lists and return them in a stable order."
objectives:
  - { id: o1, text: "Group values with computeIfAbsent and sort the result", skills: [java.collections] }
  - { id: o2, text: "Return unmodifiable collections from public methods", skills: [java.collections] }
prerequisites: [java.p1.collections]
difficulty: 2
estimated_minutes: 40
xp: 200
lesson: lesson.md
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-java, timeout_secs: 120 }
  hints:
    - |-
      Two words belong together when their `key` is equal, so `key` is the map's key. Which map keeps keys in insertion order? How do you remember the words you have already seen, ignoring case?
    - |-
      `toCharArray()`, `Arrays.sort(chars)` and `new String(chars)` build the key. A `LinkedHashMap` keeps the first-seen order; `computeIfAbsent(key, k -> new ArrayList<>()).add(word)` groups; a `HashSet` of lowercased words answers "seen before?" because `add` returns false for a repeat. Wrap each list with `List.copyOf` before returning.
    - |-
      ```java
      public static Map<String, List<String>> group(List<String> words) {
          Map<String, List<String>> groups = new LinkedHashMap<>();
          Set<String> seen = new HashSet<>();
          for (String raw : words) {
              String word = raw.strip();
              if (/* blank, or seen.add(...) returned false */) {
                  continue;
              }
              groups.computeIfAbsent(key(word), k -> new ArrayList<>()).add(word);
          }
          // copy every list with List.copyOf into a new LinkedHashMap,
          // then return Collections.unmodifiableMap(...)
      }
      ```
requirements:
  - kind: docker-engine
    name: Docker Desktop running
    why: Your kata is checked inside a container.
    install_hint: "install Docker Desktop (winget install Docker.DockerDesktop) and start it"
  - kind: docker-image
    name: dojo-java runner image
    image: dojo-java
    why: The container with JDK 25 and JUnit 5 that runs the grading tests.
