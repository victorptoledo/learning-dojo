title: "GraalVM Native Image: Millisecond Startup"
summary: "Compile ahead of time into a native executable, and know what it costs you."
objectives:
  - { id: o1, text: "Build a native executable and compare startup and memory with the JVM", skills: [java.graalvm-native] }
  - { id: o2, text: "Handle reflection and resources with reachability metadata", skills: [java.graalvm-native] }
  - { id: o3, text: "Decide between JIT, AOT cache and native image for a service", skills: [java.graalvm-native] }
prerequisites: [java.p5.jvm-performance]
difficulty: 5
estimated_minutes: 35
xp: 350
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Your team asks whether to compile a service to a GraalVM native image. Write a short recommendation for two cases: a serverless function and a busy long-running API.'
  criteria:
    - 'Recommends native for the serverless case with the startup and memory reasons'
    - 'Recommends the JVM (maybe with the AOT cache) for the long-running API, with reasons'
    - 'Mentions reflection metadata and build costs'
    - 'Mentions testing in native mode'
