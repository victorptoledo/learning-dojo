id: java.p5.jvm-performance
kind: lesson
status: draft
title: "The JVM Under Load: Memory, GC and Profiling"
summary: "Read the heap, pick a garbage collector and find a real bottleneck with Flight Recorder."
objectives:
  - { id: o1, text: "Explain the heap, the stack and what the garbage collector does", skills: [java.jvm] }
  - { id: o2, text: "Choose between G1 and ZGC and size the heap in containers", skills: [java.jvm] }
  - { id: o3, text: "Profile with Java Flight Recorder and measure with JMH", skills: [java.jvm] }
prerequisites: [java.p4.checkpoint]
difficulty: 5
estimated_minutes: 40
xp: 400
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'A Java service in a container with a 2 GB limit is slow and does frequent garbage collections. Describe how you would investigate, what you would measure, and which settings you might change.'
  criteria:
    - 'Measures before changing (latency percentiles, GC logs)'
    - 'Uses JFR or jcmd to find hot paths and allocations'
    - 'Checks heap sizing in containers (MaxRAMPercentage)'
    - 'Considers collector choice (G1 or ZGC) with a reason'
