id: java.p3.virtual-threads
legacy_id: java-02-virtual-threads
kind: lesson
status: draft
title: "Virtual Threads (Project Loom)"
summary: "Thousands of blocking tasks at once without callbacks: how virtual threads work and when they help."
objectives:
  - { id: o1, text: "Start virtual threads and use a virtual-thread-per-task executor", skills: [java.virtual-threads] }
  - { id: o2, text: "Explain mounting, unmounting and why blocking is cheap again", skills: [java.virtual-threads] }
  - { id: o3, text: "Avoid the pitfalls: pooling, pinning and CPU-bound work", skills: [java.virtual-threads] }
prerequisites: [java.p2.checkpoint]
difficulty: 4
estimated_minutes: 35
xp: 250
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'A service calls three slow remote APIs for each request. Explain how you would use virtual threads to answer faster, what you would still limit, and which kind of work would not benefit.'
  criteria:
    - 'Runs the calls concurrently with a virtual-thread executor and joins the results'
    - 'Explains why blocking is cheap with virtual threads (unmounting)'
    - 'Limits the scarce resource (connections, a Semaphore) instead of pooling threads'
    - 'Identifies CPU-bound work as not benefiting'
