id: java.p3.design-patterns
kind: lesson
status: draft
title: "Design Patterns in Modern Java"
summary: "Strategy, builder, factory, decorator and visitor, rewritten with lambdas, records and sealed types."
objectives:
  - { id: o1, text: "Replace strategy and command classes with lambdas", skills: [java.design-patterns] }
  - { id: o2, text: "Pick records, builders or static factories to create objects", skills: [java.design-patterns] }
  - { id: o3, text: "Replace visitors with sealed types and switch patterns", skills: [java.design-patterns, java.pattern-matching] }
prerequisites: [java.p3.virtual-threads]
difficulty: 4
estimated_minutes: 35
xp: 300
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Pick one classic design pattern (strategy, command, visitor, builder or decorator) and show how you would write it in modern Java, compared with the classic version. What did you gain and what did you lose?'
  criteria:
    - 'Describes the classic form correctly'
    - 'The modern version uses lambdas, records or sealed types appropriately'
    - 'Names a concrete gain (less code, compile-time checks)'
    - 'Names a limit or a case where the classic form is still better'
