id: java.p2.build-testing
kind: lesson
status: draft
title: "Packages, Maven and JUnit 6"
summary: "Organise code in packages, build it with Maven and test it with JUnit 6."
objectives:
  - { id: o1, text: "Lay out a Maven project and run its tests", skills: [java.build-testing] }
  - { id: o2, text: "Write JUnit 6 tests, including parameterized tests and assertThrows", skills: [java.build-testing] }
  - { id: o3, text: "Control visibility with packages and modules", skills: [java.build-testing] }
prerequisites: [java.p2.csv-report]
difficulty: 2
estimated_minutes: 35
xp: 200
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Write (in prose or code) the tests you would give a class that converts Celsius to Fahrenheit and rejects temperatures below absolute zero, using JUnit features from the lesson.'
  criteria:
    - 'Includes a parameterized test with several input and expected pairs'
    - 'Tests the rejection with assertThrows and checks the message'
    - 'Tests are independent and named after behaviour'
    - 'Mentions boundary values (absolute zero exactly)'
