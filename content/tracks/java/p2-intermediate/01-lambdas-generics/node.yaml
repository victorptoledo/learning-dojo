id: java.p2.lambdas-generics
kind: lesson
status: draft
title: "Lambdas, Generics and Functional Interfaces"
summary: "Pass behaviour as values and write type-safe code that works for many types."
objectives:
  - { id: o1, text: "Write lambdas and method references for the java.util.function interfaces", skills: [java.generics-lambdas] }
  - { id: o2, text: "Declare generic methods and classes with bounded type parameters", skills: [java.generics-lambdas] }
  - { id: o3, text: "Read and write wildcard signatures (extends and super)", skills: [java.generics-lambdas] }
prerequisites: [java.p1.checkpoint]
difficulty: 3
estimated_minutes: 35
xp: 200
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Explain the PECS rule (producer extends, consumer super) with a method signature of your own, and show two lambdas or method references that implement standard functional interfaces.'
  criteria:
    - 'States and applies PECS correctly'
    - 'The signature compiles and is genuinely more flexible'
    - 'Matches the lambdas to the right functional interfaces'
    - 'Explains why List<Integer> is not a List<Number>'
