questions:
  - id: predicate
    prompt: "Which functional interface fits a lambda s -> s.isBlank()?"
    options: ["Supplier<String>", "Predicate<String>", "Consumer<String>", "Runnable"]
    answer: 1
    explanation: "Predicate<T> takes a T and returns boolean."
  - id: method-ref
    prompt: "Write the method reference equivalent to s -> s.strip()"
    answers: ["String::strip"]
    explanation: "A reference to an instance method of the argument's type: Type::method."
  - id: effectively-final
    prompt: "Why does this not compile?"
    code: |
      int count = 0;
      words.forEach(w -> count++);
    options:
      - "forEach does not accept lambdas"
      - "Lambdas can only capture effectively final locals, and count is changed"
      - "count must be a long"
    answer: 1
    explanation: "Captured local variables must never be reassigned. Use stream().count(), an AtomicInteger or a loop."
  - id: list-variance
    prompt: "Can you pass a List<Integer> to a method that takes List<Number>?"
    options:
      - "Yes: Integer is a Number"
      - "No: generics are invariant; the parameter should be List<? extends Number>"
      - "Only with a cast to Object"
    answer: 1
    explanation: "List<Integer> is not a List<Number>. A read-only parameter should be declared List<? extends Number>."
  - id: pecs
    prompt: "A method only adds Integers into a list it receives. Which parameter type is the most flexible?"
    options: ["List<Integer>", "List<? extends Integer>", "List<? super Integer>", "List<Object>"]
    answer: 2
    explanation: "Consumer super: List<? super Integer> accepts List<Integer>, List<Number> and List<Object>."
  - id: bounded
    prompt: "Which declaration lets the method call compareTo on its items?"
    options:
      - "static <T> T max(List<T> items)"
      - "static <T extends Comparable<T>> T max(List<T> items)"
      - "static T max(List<Comparable> items)"
    answer: 1
    explanation: "The bound T extends Comparable<T> guarantees every T has compareTo(T)."
