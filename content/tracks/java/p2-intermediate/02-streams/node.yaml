id: java.p2.streams
kind: lesson
status: draft
title: "Streams and Collectors"
summary: "Filter, transform, group and summarise data with streams instead of loops."
objectives:
  - { id: o1, text: "Build stream pipelines with filter, map, flatMap and sorted", skills: [java.streams] }
  - { id: o2, text: "Group and summarise with Collectors.groupingBy and friends", skills: [java.streams] }
  - { id: o3, text: "Know when a loop is clearer than a stream", skills: [java.streams] }
prerequisites: [java.p2.lambdas-generics]
difficulty: 3
estimated_minutes: 40
xp: 300
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Given a list of sales (region, product, amount), write a stream pipeline that returns the total amount per region sorted by region, and explain when you would prefer a plain loop over a stream.'
  criteria:
    - 'The pipeline uses groupingBy with a map factory and a summing collector'
    - 'The result is sorted by region'
    - 'Explains laziness or single use of streams'
    - 'Gives a sound case for a loop (early exit, checked exceptions, several results)'
