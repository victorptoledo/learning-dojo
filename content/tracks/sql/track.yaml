schema_version: 2
id: sql
name: "SQL & Relational Databases"
archetype: language
category: "Databases"
icon: "🗄️"
description: "The language of data, in standard SQL with PostgreSQL 17 as the reference engine: the relational model, queries and joins, NULL, aggregation, subqueries, CTEs, window functions, DML, constraints, normalisation, indexes and plans, transactions, JSON and the anti-patterns to avoid, with notes on MySQL, SQL Server and SQLite."
status: draft
bridges_available: [java, python, javascript, csharp, go]
belts:
  - { name: "White Belt", required_xp: 0, title: "Select Star" }
  - { name: "Yellow Belt", required_xp: 300, title: "Join Harmonizer" }
  - { name: "Green Belt", required_xp: 800, title: "Aggregate & Group Master" }
  - { name: "Purple Belt", required_xp: 1500, title: "Window Function Magician" }
  - { name: "Brown Belt", required_xp: 2500, title: "Recursive CTE Sorcerer" }
  - { name: "Black Belt", required_xp: 4000, title: "ACID & Query Optimization Titan" }
  - { name: "Sensei", required_xp: 6000, title: "SQL Grandmaster" }
phases:
  - { id: p0, dir: p0-first-steps, title: "First Steps", goal: "Get a PostgreSQL to talk to, run your first queries and meet the dojo's SQL katas" }
  - { id: p1, dir: p1-fundamentals, title: "Fundamentals", goal: "Tables and types, SELECT, NULL, joins, aggregation and changing data" }
  - { id: p2, dir: p2-intermediate, title: "Intermediate", goal: "Subqueries, CTEs and views, window functions, constraints and schema design" }
  - { id: p3, dir: p3-advanced, title: "Advanced", goal: "Indexes and query plans, transactions and isolation, and JSON in SQL" }
  - { id: p4, dir: p4-mastery, title: "Mastery", goal: "The anti-patterns that hurt in production and SQL inside real applications" }
