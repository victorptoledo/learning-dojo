id: nodejs.p2.checkpoint
kind: checkpoint
status: draft
title: "📋 Checkpoint 2: Intermediate"
summary: "Prove the intermediate phase: a quiz over streams, HTTP, errors and testing, and an integration kata, an inventory service that imports CSV uploads line by line with readline and streams NDJSON exports back with pipeline."
objectives:
  - { id: o1, text: "Explain streams and backpressure, HTTP servers, error handling and testing in Node.js in your own words", skills: [nodejs.streams-buffers, nodejs.http, nodejs.errors-testing] }
  - { id: o2, text: "Build an HTTP service that consumes and produces streams without buffering whole bodies, with central error handling", skills: [nodejs.streams-buffers, nodejs.http, nodejs.errors-testing] }
prerequisites: [nodejs.p2.errors-testing]
difficulty: 3
estimated_minutes: 90
xp: 350
closes_phase: p2
covers_skills: [nodejs.streams-buffers, nodejs.http, nodejs.errors-testing]
lesson: lesson.md
quiz: quiz.yaml
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-node, timeout_secs: 90 }
  hints:
    - |-
      Bottom up again: `parseRow` (pure), `exportNdjson`, `importCsv`, and the server last. An `IncomingMessage` is a `Readable`, so the request itself is what you pass to `importCsv`. Which `node:readline` function turns a readable stream into lines you can `for await` over?
    - |-
      `createInterface({ input: source, crlfDelay: Infinity })` is async-iterable and yields lines without `\n` (and with `crlfDelay: Infinity`, without `\r` either). Keep a line counter and a `sawHeader` flag; compare the header with `line.trim().toLowerCase().replace(/\s*,\s*/g, ",")`. `exportNdjson`: sort the keys, write a generator that yields one line per item and return `Readable.from(generator())`. For `GET /items`, `res.writeHead(200, { "content-type": "application/x-ndjson" })` and then `await pipeline(exportNdjson(inventory), res)`.
    - |-
      ```ts
      export function createInventoryServer(inventory: Map<string, Item> = new Map()): Server {
        async function route(req: IncomingMessage, res: ServerResponse): Promise<void> {
          const { pathname } = new URL(req.url ?? "/", "http://localhost");
          if (pathname === "/import") {
            // 405 unless POST (res.setHeader("allow", "POST")), 415 unless text/csv
            sendJson(res, 200, await importCsv(req, inventory));
            return;
          }
          // /items, /^\/items\/([^/]+)$/, else 404
        }
        return createServer((req, res) => {
          route(req, res).catch((error: unknown) => {
            req.resume();
            // HttpError: its status; anything else: log it, 500
          });
        });
      }
      ```
requirements:
  - kind: docker-engine
    name: Docker Desktop running
    why: Your kata is checked inside a container.
    install_hint: "install Docker Desktop (winget install Docker.DockerDesktop) and start it"
  - kind: docker-image
    name: dojo-node runner image
    image: dojo-node
    why: The Node.js 26 container with TypeScript 7 that type-checks your code and runs the tests.
