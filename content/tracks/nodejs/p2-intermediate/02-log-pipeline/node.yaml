id: nodejs.p2.log-pipeline
kind: kata
status: draft
title: "Log Pipeline: Transform Streams and Backpressure"
summary: "Stream a huge NDJSON log through Transform streams that split lines across chunks and UTF-8 characters, parse and validate entries, filter by level and serialise them again, connected with pipeline so errors propagate and a slow writer slows the reader down."
objectives:
  - { id: o1, text: "Write Transform streams in object and byte mode, handling lines and UTF-8 characters split across chunks", skills: [nodejs.streams-buffers] }
  - { id: o2, text: "Connect streams with stream/promises pipeline so that errors destroy every stream and backpressure is respected", skills: [nodejs.streams-buffers] }
  - { id: o3, text: "Consume a stream with for await and validate untrusted JSON lines without crashing", skills: [nodejs.streams-buffers, nodejs.async-patterns] }
prerequisites: [nodejs.p2.streams-buffers]
difficulty: 3
estimated_minutes: 70
xp: 300
lesson: lesson.md
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-node, timeout_secs: 60 }
  hints:
    - |-
      Each transform is `new Transform({ ..., transform(chunk, encoding, callback) { ... } })`. Which side is in object mode for each one (`readableObjectMode`, `writableObjectMode` or `objectMode` for both)? For `splitLines`, what must you keep between two chunks, and what is left to push in `flush`?
    - |-
      `splitLines`: keep a `rest` string; decode each chunk with one `StringDecoder("utf8")` (it holds back an incomplete character), split `rest + text` on `"\n"`, `pop()` the last piece back into `rest`, push the others without a trailing `"\r"`, and in `flush` push what is left if it is not empty. In the other transforms, `callback(null, value)` pushes one value and `callback()` pushes nothing. In `filterLog`, count kept entries with a small extra transform (or in `filterLevel`) and count invalid lines in the `onInvalid` callback.
    - |-
      ```ts
      export async function filterLog(input: Readable, output: Writable, min: Level) {
        let kept = 0;
        let invalid = 0;
        const count = new Transform({
          objectMode: true,
          transform(entry: LogEntry, _encoding, callback) {
            kept += 1;
            callback(null, entry);
          },
        });
        await pipeline(input, splitLines(), parseEntries(() => { invalid += 1; }), filterLevel(min), count, toNdjson(), output);
        return { kept, invalid };
      }
      ```
