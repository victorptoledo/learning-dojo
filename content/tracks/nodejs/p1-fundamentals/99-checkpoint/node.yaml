id: nodejs.p1.checkpoint
kind: checkpoint
status: draft
title: "📋 Checkpoint 1: Fundamentals"
summary: "Prove the fundamentals: a quiz over the whole phase and an integration kata, dupes, a command-line tool that walks a folder with an async generator, hashes files, reports duplicates and turns system errors into exit codes."
objectives:
  - { id: o1, text: "Explain the event loop, async patterns, events, the file system and processes in your own words", skills: [nodejs.event-loop-libuv, nodejs.async-patterns, nodejs.events, nodejs.fs-path, nodejs.process-cli] }
  - { id: o2, text: "Build a command-line tool that walks the file system asynchronously, handles system error codes and reports its result with exit codes", skills: [nodejs.fs-path, nodejs.process-cli, nodejs.async-patterns] }
prerequisites: [nodejs.p1.process-cli]
difficulty: 3
estimated_minutes: 80
xp: 300
closes_phase: p1
covers_skills: [nodejs.event-loop-libuv, nodejs.async-patterns, nodejs.events, nodejs.fs-path, nodejs.process-cli]
