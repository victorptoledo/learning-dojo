kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-node, timeout_secs: 60 }
  hints:
    - |-
      Build it bottom up: `formatReport` (pure, no I/O), then `hashFile`, then `walk`, then `findDuplicates`, and `main` last. `walk` is an `async function*`: how does it visit a sub-folder, and which `readdir` option tells you whether an entry is a file, a folder or a symbolic link without another `stat`?
    - |-
      `readdir(dir, { withFileTypes: true })` returns `Dirent` objects with `isFile()`, `isDirectory()` and `isSymbolicLink()`; a link is neither a file nor a folder for a `Dirent`, so checking `isFile()` and `isDirectory()` skips links for free. Recurse with an inner `async function* visit(relative)` and `yield* visit(child)`, building `child` with a template string so the separator is always `/`; join it with `path.join(root, relative)` only to read from disk. `hashFile`: `createHash("sha256").update(await readFile(file)).digest("hex")`. In `main`, the error of a failed `readdir` has a `code` property: `(error as NodeJS.ErrnoException).code`.
    - |-
      ```ts
      export async function findDuplicates(root: string, options: FindOptions = {}): Promise<DuplicateGroup[]> {
        const minSize = options.minSize ?? 1;
        const bySize = new Map<number, string[]>();
        for await (const file of walk(root, options)) {
          const { size } = await stat(path.join(root, file));
          // keep files with size >= minSize, grouped by size
        }
        const groups: DuplicateGroup[] = [];
        for (const [size, files] of bySize) {
          // skip sizes with one file; group the others by hashFile(...);
          // every hash with two or more files is a group (files sorted)
        }
        return groups.sort((a, b) => b.size - a.size || (a.files[0] ?? "").localeCompare(b.files[0] ?? ""));
      }
      ```
