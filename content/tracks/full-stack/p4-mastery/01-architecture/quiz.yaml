questions:
  - id: modular
    prompt: "What makes a monolith 'modular'?"
    options: ["It is split into several repositories", "Strict internal modules with their own APIs and data, and no reaching into each other's internals", "It uses many classes"]
    answer: 1
    explanation: "One deployable, enforced boundaries inside."
  - id: force
    prompt: "Which is a concrete reason to extract a service?"
    options: ["Microservices are modern", "One part needs to scale or deploy independently, owned by a separate team", "The codebase has more than 100 files"]
    answer: 1
    explanation: "Split for forces you can name, not for fashion."
  - id: distributed-monolith
    prompt: "Services that must always be deployed together are called a..."
    answers: ["distributed monolith", "a distributed monolith"]
    explanation: "The costs of services with the coupling of a monolith."
  - id: bff
    prompt: "The mobile app needs small payloads combining three core APIs. What fits?"
    options: ["A backend-for-frontend owned by the mobile team", "More fields in every core API", "Direct database access from the app"]
    answer: 0
    explanation: "A BFF shapes data for one client without bloating the core APIs."
  - id: gateway
    prompt: "What belongs in an API gateway?"
    options: ["Business rules for discounts", "Routing, TLS, authentication and rate limiting", "Database migrations"]
    answer: 1
    explanation: "Cross-cutting edge concerns; keep domain logic in services."
  - id: monorepo
    prompt: "Which benefit of a monorepo matters most to full stack changes?"
    options: ["Smaller clones", "Changing the API, the shared contract and the UI in one reviewed commit", "No need for CI"]
    answer: 1
    explanation: "Atomic cross-stack changes; enforce boundaries to keep it healthy."
  - id: adr
    prompt: "What is an ADR?"
    answers: ["Architecture Decision Record", "an architecture decision record", "architecture decision record"]
    explanation: "Context, options, decision and consequences, kept with the code."
