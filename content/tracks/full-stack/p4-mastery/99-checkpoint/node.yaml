  runner: { image: dojo-node, timeout_secs: 120 }
  hints:
    - |-
      For every piece, ask "what is still running?". The old release inserts rows with `full_name` only, so what may the new columns not require? Old clients read `fullName`, so what must every answer keep? The flag can be turned off at 3 a.m. without a deploy, so where must it be read? Build from the bottom: `names.ts` and `flags.ts` are pure, then the migration and its runner, then the repository, then the routes and the contract.
    - |-
      SQLite runs DDL inside transactions: `db.exec("BEGIN")`, the migration's SQL (it may hold several statements), the insert into `schema_migrations`, `db.exec("COMMIT")`, and `ROLLBACK` in the `catch`. `new TextEncoder().encode(text)` gives the UTF-8 bytes. The backfill selects `WHERE first_name IS NULL ORDER BY id LIMIT ?` and keeps `AND first_name IS NULL` in its `UPDATE`, so a name a new client wrote meanwhile wins. In `parseRename`, compare `"fullName" in body` with `"firstName" in body || "lastName" in body`: when both are true or both are false, the body is ambiguous or empty.
    - |-
      ```ts
      export function migrate(db: DatabaseSync, migrations: Migration[] = MIGRATIONS): string[] {
        db.exec("CREATE TABLE IF NOT EXISTS schema_migrations (name TEXT PRIMARY KEY, applied_at TEXT NOT NULL)");
        const done = new Set((db.prepare("SELECT name FROM schema_migrations").all() as { name: string }[]).map((r) => r.name));
        const applied: string[] = [];
        for (const migration of migrations) {
          if (done.has(migration.name)) continue;
          db.exec("BEGIN");
          try {
            db.exec(migration.sql);
            db.prepare("INSERT INTO schema_migrations (name, applied_at) VALUES (?, datetime('now'))").run(migration.name);
            db.exec("COMMIT");
          } catch (error) {
            db.exec("ROLLBACK");
            throw error;
          }
          applied.push(migration.name);
        }
        return applied;
      }
      ```
