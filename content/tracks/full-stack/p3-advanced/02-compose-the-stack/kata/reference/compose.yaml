x-database: &database
  DATABASE_HOST: db
  DATABASE_NAME: shop
  DATABASE_USER: shop
  DATABASE_PASSWORD_FILE: /run/secrets/db_password

services:
  web:
    image: ghcr.io/dojo-example/shop-web:2.3.0
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_URL: http://api:3000
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: ghcr.io/dojo-example/shop-api:2.3.0
    command: ["node", "server.js"]
    environment:
      <<: *database
      CORS_ORIGIN: http://localhost:8080
      NODE_ENV: production
    secrets:
      - db_password
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 10s
      timeout: 2s
      retries: 3
    restart: unless-stopped

  migrate:
    image: ghcr.io/dojo-example/shop-api:2.3.0
    command: ["node", "migrate.js"]
    environment: *database
    secrets:
      - db_password
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    image: ghcr.io/dojo-example/shop-api:2.3.0
    command: ["node", "seed.js"]
    profiles: [dev]
    environment: *database
    secrets:
      - db_password
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    networks:
      - backend
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  db-data: {}

secrets:
  db_password:
    file: ./secrets/db_password.txt
