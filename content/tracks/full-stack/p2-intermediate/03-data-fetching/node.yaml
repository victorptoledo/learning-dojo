id: full-stack.p2.data-fetching
kind: lesson
status: reviewed
title: "Data Fetching and Caching: HTTP Caches, Client Caches and Optimistic Updates"
summary: "Every layer that can answer before your server does, and how to keep them right: Cache-Control and validators, CDN caching, client caches such as TanStack Query and SWR, invalidation after writes, optimistic updates and lost updates."
objectives:
  - { id: o1, text: "Choose Cache-Control directives and validators for each kind of response", skills: [full-stack.data-fetching, system-design.caching-strategies, api-design.caching] }
  - { id: o2, text: "Explain client-side server-state caches: stale-while-revalidate, deduplication and invalidation after mutations", skills: [full-stack.data-fetching, react.data-fetching, react.state-management] }
  - { id: o3, text: "Implement optimistic updates with rollback and prevent lost updates with conditional requests", skills: [full-stack.data-fetching, react.data-fetching] }
prerequisites: [full-stack.p2.spa-session-api]
difficulty: 3
estimated_minutes: 55
xp: 250
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'A shop has a product page (public, changes a few times a day), a cart (per user, changes often), and a "like" button on reviews. For each, choose the Cache-Control headers, whether a CDN may cache it, how the client caches and refreshes it, and what happens right after the user changes something (adding to the cart, liking). Include how you would handle a like that fails on the server.'
  criteria:
    - 'Product page: public caching with a sensible max-age or s-maxage and validators, plus a purge or short TTL story'
    - 'Cart: private or no-store, never cached by a shared cache'
    - 'Describes client caching with revalidation and invalidating or updating the cart query after a mutation'
    - 'Uses an optimistic update for the like with a rollback on failure'
    - 'Mentions ETag/If-None-Match or If-Match where they help'
