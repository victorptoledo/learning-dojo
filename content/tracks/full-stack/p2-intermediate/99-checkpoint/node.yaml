id: full-stack.p2.checkpoint
kind: checkpoint
status: reviewed
title: "📋 Checkpoint 2: Intermediate"
summary: "Prove the intermediate phase: a quiz and an integration kata, a comments feature from a JPA entity to the page's needs, with opaque cursors, field-level validation errors and a canDelete flag the server still enforces."
objectives:
  - { id: o1, text: "Explain authentication across the stack, data fetching and caching, and rendering strategies in your own words", skills: [full-stack.auth, full-stack.data-fetching, full-stack.ssr-ssg] }
  - { id: o2, text: "Build a feature from the database to what the page needs: keyset pages, errors per field and permissions shown and enforced", skills: [full-stack.auth, full-stack.data-modelling, full-stack.api-contracts, spring.data-jpa] }
prerequisites: [full-stack.p2.ssr-ssg]
difficulty: 4
estimated_minutes: 90
