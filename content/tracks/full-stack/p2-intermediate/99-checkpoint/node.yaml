closes_phase: p2
covers_skills: [full-stack.auth, full-stack.data-fetching, full-stack.ssr-ssg]
lesson: lesson.md
quiz: quiz.yaml
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-java, timeout_secs: 240 }
  hints:
    - |-
      Start with the read path, since every other test lists comments: two repository methods (first page, page after a cursor), then the controller. How do you know whether a "Show more" button is needed without counting all the comments? Then `canDelete`: it depends on the comment and on who is looking, so where does the viewer come from in a controller method, including when nobody is logged in?
    - |-
      Spring Data derives `findByArticleSlugOrderByIdDesc(String slug, Limit limit)` and `findByArticleSlugAndIdLessThanOrderByIdDesc(String slug, long id, Limit limit)`; ask for `Limit.of(limit + 1)` and the extra row tells you a next page exists. The cursor is `Base64.getUrlEncoder().withoutPadding()` of the last id; decoding errors (an `IllegalArgumentException`, which `NumberFormatException` is) become a `ResponseStatusException` 400. An `Authentication` parameter is `null` for anonymous readers. In `ApiErrors`, override `handleMethodArgumentNotValid` and put a field-to-message map in `problem.setProperty("errors", ...)`.
    - |-
      ```java
      @GetMapping("/api/articles/{slug}/comments")
      Page list(@PathVariable String slug, @RequestParam(defaultValue = "10") int limit,
                @RequestParam(required = false) String cursor, Authentication viewer) {
          // 400 when limit is outside 1..50
          List<Comment> found = cursor == null
                  ? comments.findByArticleSlugOrderByIdDesc(slug, Limit.of(limit + 1))
                  : comments.findByArticleSlugAndIdLessThanOrderByIdDesc(slug, decode(cursor), Limit.of(limit + 1));
          List<Comment> page = found.subList(0, Math.min(limit, found.size()));
          String next = found.size() > limit ? encode(page.getLast().getId()) : null;
          return new Page(page.stream().map(c -> view(c, viewer)).toList(), next);
      }
      ```
