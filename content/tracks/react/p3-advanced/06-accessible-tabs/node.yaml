id: react.p3.accessible-tabs
kind: kata
status: draft
title: "Accessible Tabs: ARIA, Keyboard and Focus"
summary: "A tabs component that follows the WAI-ARIA tabs pattern: tablist, tab and tabpanel roles, aria-selected and aria-controls, a roving tabindex, arrow, Home and End keys with focus, disabled tabs, and tests written only with roles."
objectives:
  - { id: o1, text: "Implement a WAI-ARIA widget pattern with the right roles, states and relationships", skills: [react.testing-a11y] }
  - { id: o2, text: "Support the keyboard with a roving tabindex and move focus with refs", skills: [react.testing-a11y, react.hooks-lifecycle] }
  - { id: o3, text: "Make the component testable purely through roles, names and keyboard input", skills: [react.testing-a11y] }
prerequisites: [react.p3.testing-a11y]
difficulty: 4
estimated_minutes: 75
xp: 250
lesson: lesson.md
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-react, timeout_secs: 90 }
  hints:
    - |-
      Render the structure first: a `tablist` with one `button` per tab, and one `tabpanel`. Which ids do you need so that each tab can point to the panel (`aria-controls`) and the panel to its tab (`aria-labelledby`), and how do you keep them unique if two `Tabs` are on the same page? Then the keyboard: which element listens for the keys, and how do you move focus to another button?
    - |-
      `const base = useId()`; tab ids `${base}-tab-${tab.id}`, panel id `${base}-panel-${tab.id}`. Only the selected tab has `tabIndex={0}`. Put `onKeyDown` on the tablist; compute the next enabled index (skip disabled tabs, wrap around), select it and focus its button through a ref map: `const refs = useRef(new Map<string, HTMLButtonElement>())` and `ref={(node) => { if (node) refs.current.set(tab.id, node); else refs.current.delete(tab.id); }}`. Call `event.preventDefault()` for the keys you handle.
    - |-
      ```tsx
      function nextEnabled(tabs: readonly Tab[], from: number, step: 1 | -1): number {
        for (let i = 1; i <= tabs.length; i++) {
          const index = (from + step * i + tabs.length) % tabs.length;
          if (!tabs[index]?.disabled) return index;
        }
        return from;
      }

      function handleKeyDown(event: KeyboardEvent<HTMLDivElement>) {
        const current = tabs.findIndex((tab) => tab.id === selectedId);
        let target: number | null = null;
        if (event.key === "ArrowRight") target = nextEnabled(tabs, current, 1);
        // ArrowLeft, Home (first enabled), End (last enabled)
        if (target === null) return;
        event.preventDefault();
        const tab = tabs[target];
        if (tab) { select(tab.id); refs.current.get(tab.id)?.focus(); }
      }
      ```
