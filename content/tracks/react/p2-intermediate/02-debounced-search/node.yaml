id: react.p2.debounced-search
kind: kata
status: draft
title: "Debounced Search: Custom Hooks, Cleanup and Races"
summary: "Two custom hooks (a debounced value and a search that aborts stale requests) and a search box on top of them, tested with renderHook, real timers and controlled promises."
objectives:
  - { id: o1, text: "Write a generic custom hook with a timer effect and its cleanup", skills: [react.custom-hooks, react.hooks-lifecycle] }
  - { id: o2, text: "Fetch from an effect without races: abort the previous request and ignore stale results", skills: [react.data-fetching, react.custom-hooks] }
  - { id: o3, text: "Keep the latest callback in a ref so an effect does not restart on every render", skills: [react.custom-hooks, react.hooks-lifecycle] }
prerequisites: [react.p2.custom-hooks]
difficulty: 3
estimated_minutes: 75
xp: 250
lesson: lesson.md
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-react, timeout_secs: 90 }
  hints:
    - |-
      Start with `useDebouncedValue`: it needs state for the value it returns and an effect that starts a timer whenever `value` changes. What must the effect's cleanup do so that typing fast restarts the wait? Then `useSearch`: which value should its effect depend on, the raw query or the debounced one?
    - |-
      `useDebouncedValue`: `useEffect(() => { const id = setTimeout(() => setDebounced(value), delayMs); return () => clearTimeout(id); }, [value, delayMs])`. In `useSearch`, debounce `query.trim()`; in the effect create an `AbortController`, call `search(q, controller.signal)` and only set state when `!controller.signal.aborted`; abort in the cleanup. If you list `search` as a dependency, a parent that passes a new arrow function on every render restarts the effect forever: keep the latest `search` in a ref instead.
    - |-
      ```ts
      export function useSearch(query: string, search: SearchFn, delayMs = 300): SearchState {
        const debounced = useDebouncedValue(query.trim(), delayMs);
        const [state, setState] = useState<SearchState>({ status: "idle" });
        const searchRef = useRef(search);
        useEffect(() => {
          searchRef.current = search;
        });

        useEffect(() => {
          if (debounced === "") {
            setState({ status: "idle" });
            return;
          }
          const controller = new AbortController();
          setState({ status: "loading" });
          searchRef.current(debounced, controller.signal).then(
            (results) => { /* success, unless aborted */ },
            (error: unknown) => { /* error, unless aborted */ },
          );
          return () => controller.abort();
        }, [debounced]);
        return state;
      }
      ```
