# The partner exports contract, design first: it was reviewed before the code was written.
# It is not finished yet: see "The contract" in the kata README for what is missing.
openapi: 3.1.1
info:
  title: Partner Exports API
  version: 2.0.0
  contact:
    name: Data Platform team
    email: data-platform@dojo.example
servers:
  - url: https://api.dojo.example
paths:
  /exports:
    post:
      operationId: createExport
      summary: Start an export; it runs in the background
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '202':
          description: The export was accepted and is running
          headers:
            Location:
              description: The export's status resource
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '400':
          $ref: '#/components/responses/Problem'
  /exports/{exportId}:
    parameters:
      - name: exportId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getExport
      summary: The status of an export, and its result when it has one
      responses:
        '200':
          description: The export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
        '404':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    partnerKey:
      type: http
      scheme: bearer
      description: "The partner's API key: Authorization: Bearer dk_..."
  responses:
    Problem:
      description: A problem detail (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ExportRequest:
      type: object
      required: [dataset, format]
      properties:
        dataset:
          type: string
          enum: [orders, customers, invoices]
        format:
          type: string
          enum: [csv, ndjson]
    Export:
      type: object
      required: [id, dataset, format, status]
      properties:
        id:
          type: string
          examples: [exp_31]
        dataset:
          type: string
        format:
          type: string
        status:
          type: string
          enum: [RUNNING, SUCCEEDED, FAILED]
        resultUrl:
          type: string
          format: uri
        error:
          $ref: '#/components/schemas/Problem'
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
