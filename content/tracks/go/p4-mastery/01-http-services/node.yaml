id: go.p4.http-services
kind: lesson
status: draft
title: "HTTP Services with net/http and ServeMux Patterns"
summary: "Handlers and HandlerFunc, ServeMux patterns with methods and wildcards (Go 1.22), JSON input and output with limits, middleware, server timeouts and graceful shutdown, a well-configured client, and testing handlers with httptest."
objectives:
  - { id: o1, text: "Route requests with ServeMux method and wildcard patterns and read path values", skills: [go.http] }
  - { id: o2, text: "Write JSON handlers with validation, status codes and middleware, and test them with httptest", skills: [go.http, go.testing] }
  - { id: o3, text: "Run a server with timeouts and graceful shutdown, and use the HTTP client with timeouts and contexts", skills: [go.http, go.context-lifecycle] }
prerequisites: [go.p3.parallel-fetch]
difficulty: 4
estimated_minutes: 55
xp: 400
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'A team wants to add the Gin framework to a small service "because net/http cannot route by method or read path parameters", and its `main` is `http.ListenAndServe(":8080", mux)`. Their handlers call other services with `http.Get`. Reply to the team: what net/http offers since Go 1.22 (with a few route registrations), what is risky in their main and their client calls, and what you would change.'
  criteria:
    - 'Shows ServeMux patterns with methods and wildcards such as "GET /orders/{id}" and r.PathValue("id"), plus 405 handling and {$} or {path...}'
    - 'Explains that ListenAndServe has no timeouts and replaces it with an http.Server with ReadHeaderTimeout, ReadTimeout, WriteTimeout and IdleTimeout'
    - 'Adds graceful shutdown with signal.NotifyContext and srv.Shutdown with a timeout'
    - 'Explains that http.Get uses a client with no timeout; uses a shared http.Client with Timeout and NewRequestWithContext, and closes resp.Body'
    - 'Mentions middleware as func(http.Handler) http.Handler or testing with httptest as reasons the standard library is enough'
