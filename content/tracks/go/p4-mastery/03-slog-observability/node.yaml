id: go.p4.slog-observability
kind: lesson
status: draft
title: "Structured Logging with log/slog and Observability"
summary: "Why structured logs, log/slog handlers, levels and attributes, loggers with request context, what to log and how to redact, metrics with Prometheus, OpenTelemetry and runtime/metrics, traces, and health endpoints."
objectives:
  - { id: o1, text: "Log with log/slog: handlers, levels, typed attributes, groups and loggers built with With", skills: [go.observability] }
  - { id: o2, text: "Decide what to log, log each error once, and keep secrets out of logs with LogValuer", skills: [go.observability, go.errors-idiomatic] }
  - { id: o3, text: "Explain metrics, traces, runtime metrics and health endpoints and how they fit together", skills: [go.observability] }
prerequisites: [go.p4.http-api]
difficulty: 4
estimated_minutes: 45
xp: 350
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'An on-call engineer cannot answer "which customer hit the 500s between 10:00 and 10:05, and how slow were they?" because the service logs with `log.Printf("error: %v", err)` in five layers, prints the request body including the Authorization header, and exposes no metrics. Write the observability plan for this service: the logger setup, what each request and each error produces, how secrets are protected, and which metrics and endpoints you would add.'
  criteria:
    - 'Sets up slog with a JSONHandler to stdout, a level from configuration (LevelVar), and slog.SetDefault'
    - 'Uses a request logger built with With (request id, route, customer) and one request log line with method, status and duration from a middleware'
    - 'Logs each error once where it is handled, with an err attribute, instead of in every layer'
    - 'Removes the body and Authorization header from logs and uses LogValuer or redaction for sensitive types'
    - 'Adds metrics (request count by route and status, latency histogram, runtime metrics) via Prometheus or OpenTelemetry, plus health and readiness endpoints, and mentions traces'
