id: go.p2.interfaces-duck-typing
legacy_id: go-04-interfaces-duck-typing
kind: lesson
status: draft
title: "Implicit Interfaces, Embedding and Type Switches"
summary: "Structural typing without implements, method sets, the small interfaces of the standard library (io.Reader, io.Writer, Stringer), accepting interfaces and returning structs, composition and decoration, the typed nil trap, type assertions and type switches."
objectives:
  - { id: o1, text: "Declare small interfaces, satisfy them implicitly and check it at compile time", skills: [go.interfaces-duck-typing] }
  - { id: o2, text: "Design APIs that accept io.Reader and io.Writer, define interfaces at the consumer and decorate with embedding", skills: [go.interfaces-duck-typing] }
  - { id: o3, text: "Explain interface values and the typed nil trap, and use type assertions and type switches", skills: [go.interfaces-duck-typing] }
prerequisites: [go.p1.checkpoint]
difficulty: 3
estimated_minutes: 50
xp: 250
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'A service package exports `type UserRepository interface` with 14 methods, a `NewUserRepository() UserRepository` constructor and a `MockUserRepository` with all 14 methods, used by a handler that only calls `Get`. Explain what a Go reviewer would change and why, and show the interface and constructor signatures you would end up with. Then explain why `func (h *Handler) load(id string) error` that returns a nil `*NotFoundError` variable makes `err != nil` true.'
  criteria:
    - 'Proposes a small interface defined by the consumer (the handler) with only Get, satisfied implicitly by the real repository'
    - 'Says the constructor should return the concrete type (*UserRepository or *Store): accept interfaces, return structs'
    - 'Notes that tests then need a tiny fake with one method instead of a 14-method mock'
    - 'Explains that an interface value holds a dynamic type and value; a nil *NotFoundError stored in an error has a type, so the interface is not nil'
    - 'Fixes it by returning the literal nil when there is no error'
