kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-go, timeout_secs: 120 }
  hints:
    - |-
      Give the batch to **one** goroutine and let nobody else touch it: `Start` launches a `run` loop that owns the slice, and `Add` only talks to it through a channel. How does `Add` find out that the loop is gone, without anyone ever closing the channel `Add` sends on? And which context should the very last flush use when the `Start` context is the reason for stopping?
    - |-
      Three channels: `in chan T` (unbuffered, so a nil from `Add` means the loop has the item), `quit chan struct{}` closed by `Close` inside a `sync.Once`, and `done chan struct{}` closed by the loop with `defer`. `Add` selects on `b.in <- item`, `<-b.quit`, `<-b.done` and `<-ctx.Done()`. The loop selects on `<-b.in`, `<-timeout`, `<-b.quit` and `<-ctx.Done()`; start a `time.NewTimer(cfg.Wait)` only when the batch gets its **first** item, stop it on every flush, and after a flush set `batch = nil` instead of `batch[:0]`. Keep the flush errors in a slice that only the loop writes; `Close` reads it after `<-b.done`, which orders the two.
    - |-
      ```go
      func (b *Batcher[T]) run(ctx context.Context) {
      	defer close(b.done)
      	var batch []T
      	var timer *time.Timer
      	var timeout <-chan time.Time // nil: a nil channel never fires in a select
      	flush := func(ctx context.Context) {
      		if timer != nil {
      			timer.Stop()
      			timer, timeout = nil, nil
      		}
      		if len(batch) == 0 {
      			return
      		}
      		n := b.batches.Add(1)
      		b.items.Add(int64(len(batch)))
      		if err := b.flush(ctx, batch); err != nil {
      			b.failed.Add(1)
      			b.errs = append(b.errs, fmt.Errorf("batch %d: %w", n, err))
      		}
      		batch = nil
      	}
      	for {
      		select {
      		case item := <-b.in:
      			batch = append(batch, item)
      			if len(batch) == 1 && b.cfg.Wait > 0 {
      				timer = time.NewTimer(b.cfg.Wait)
      				timeout = timer.C
      			}
      			if len(batch) >= b.cfg.Size {
      				flush(ctx)
      			}
      		case <-timeout:
      			flush(ctx)
      		case <-b.quit:
      			flush(context.WithoutCancel(ctx))
      			return
      		case <-ctx.Done():
      			flush(context.WithoutCancel(ctx))
      			return
      		}
      	}
      }
      ```
