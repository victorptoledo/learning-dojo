id: go.p3.checkpoint
kind: checkpoint
status: draft
title: "📋 Checkpoint 3: Advanced"
summary: "Prove the concurrency phase: a quiz over goroutines, channels, sync, the memory model and context, and an integration kata, a generic batcher fed from many goroutines that flushes by size or time, applies backpressure, closes once and leaks nothing."
objectives:
  - { id: o1, text: "Explain goroutines, channels and select, happens-before, the race detector and the rules of context in your own words", skills: [go.goroutines-concurrency, go.channels-select, go.sync-memory-model, go.context-lifecycle] }
  - { id: o2, text: "Build a concurrent component with one owner goroutine, a close channel, timers, atomics and context, and prove it race-free and leak-free with -race and testing/synctest", skills: [go.channels-select, go.sync-memory-model, go.context-lifecycle] }
prerequisites: [go.p3.parallel-fetch]
difficulty: 4
estimated_minutes: 90
xp: 400
closes_phase: p3
covers_skills: [go.goroutines-concurrency, go.channels-select, go.sync-memory-model, go.context-lifecycle]
