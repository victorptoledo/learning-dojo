  hints:
    - |-
      Draw the tasks as a graph with an edge from each dependency to the task that needs it. "In which order can they run" is a topological sort; "is there a cycle" is the case where the sort gets stuck; "when can it finish" is the longest path to the task, which is easy once you visit tasks in topological order. What do you have to keep so that the next ready task is always the alphabetically smallest?
    - |-
      Compute one cached analysis per change: a `Map<String, List<String>>` of dependents, a count of unfinished dependencies per task, and Kahn's algorithm with a `PriorityQueue<String>` of ready names. While you pop a task, its finish time is its duration plus the maximum finish of its dependencies, which are all done already. If the order has fewer tasks than the planner, there is a cycle. For `findCycle`, run a DFS with an explicit stack and a map from each task on the current path to its position in it.
    - |-
      ```java
      PriorityQueue<String> ready = new PriorityQueue<>();
      waiting.forEach((name, count) -> { if (count == 0) ready.add(name); });
      while (!ready.isEmpty()) {
          String name = ready.poll();
          long start = 0;
          for (String dep : tasks.get(name).dependsOn()) start = Math.max(start, finish.get(dep));
          finish.put(name, start + tasks.get(name).duration());
          order.add(name);
          for (String next : dependents.getOrDefault(name, List.of())) {
              if (waiting.merge(next, -1, Integer::sum) == 0) ready.add(next);
          }
      }
      ```
