kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-java, timeout_secs: 240 }
  hints:
    - |-
      Separate the two halves of the problem. Turning a line into a number (how many times does the pattern occur in it?) is string matching, done once per line and pattern when the line arrives or changes. After that, every question is about an array of numbers indexed by line: which range structures answer a sum, "the first position where the running total grows" and "the position of the maximum" while single positions change?
    - |-
      Keep one `Watch` per pattern with its prefix function, a `long[] count`, a 1-based `long[] fenwick` and an `int[] best` segment tree of positions (leaves at `capacity + i`). `append` and `replace` run KMP on the line, then `set(line, value)` updates both trees with the difference. `count` is `prefix(to) - prefix(from)`; `firstLineWith` searches for the first position whose running total reaches `prefix(from) + 1`; `busiestLine` is the iterative range query over `best`. When the number of lines reaches the capacity, double it and rebuild both trees from `count` in O(n).
    - |-
      ```java
      long occurrences(String text) {           // KMP: overlapping matches, no restart
          long found = 0;
          for (int i = 0, k = 0; i < text.length(); i++) {
              char c = text.charAt(i);
              while (k > 0 && c != pattern.charAt(k)) k = pi[k - 1];
              if (c == pattern.charAt(k)) k++;
              if (k == pattern.length()) { found++; k = pi[k - 1]; }
          }
          return found;
      }

      void set(int line, long value) {
          long delta = value - count[line];
          count[line] = value;
          for (int i = line + 1; i <= capacity; i += i & -i) fenwick[i] += delta;
          for (int i = (line + capacity) / 2; i >= 1; i /= 2) best[i] = better(best[2 * i], best[2 * i + 1]);
      }
      ```
