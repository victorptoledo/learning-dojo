  - { id: o2, text: "Combine KMP counting with a growable Fenwick tree (sums, search by prefix) and a segment tree (first argmax) under appends and edits", skills: [datastructures-and-algorithms.range-queries, datastructures-and-algorithms.string-matching, datastructures-and-algorithms.complexity] }
