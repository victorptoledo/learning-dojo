title: "📋 Checkpoint 4: Range Queries and Strings"
summary: "Prove the range queries and strings phase: a quiz on prefix sums, sparse tables, Fenwick and segment trees, KMP, rolling hashes and Aho-Corasick, and an editable log index that counts watched patterns per line and answers range sums, the next match and the busiest line."
