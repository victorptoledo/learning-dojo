questions:
  - id: greedy-exchange
    skills: [datastructures-and-algorithms.greedy]
    prompt: "Huffman's algorithm always merges the two lightest trees. Which argument shows that this choice is safe?"
    options: ["It is the fastest choice", "An exchange argument: in some optimal tree the two least frequent symbols are siblings at the deepest level, so merging them first loses nothing", "Dynamic programming over all trees", "It only works for powers of two"]
    answer: 1
    explanation: "Swapping a deeper symbol with a less frequent one can only lower the total cost, so an optimal tree with the two lightest as deepest siblings exists."
  - id: greedy-fails
    skills: [datastructures-and-algorithms.greedy, datastructures-and-algorithms.dynamic-programming]
    prompt: "Coins are 1, 3 and 4 and the amount is 6. What does 'largest coin first' give, and what is optimal?"
    options: ["4 + 1 + 1 (three coins); optimal is 3 + 3 (two coins)", "3 + 3 both times", "4 + 1 + 1 both times", "6 is impossible"]
    answer: 0
    explanation: "Greedy coin change is only optimal for some coin systems; minimum coins in general is a DP over amounts."
  - id: interval-key
    skills: [datastructures-and-algorithms.greedy, datastructures-and-algorithms.sorting-searching]
    prompt: "To schedule the largest number of non-overlapping talks on one stage, by which key do you sort before taking talks greedily?"
    answers: ["end time", "end", "finish time", "the end time", "ending time", "earliest end", "earliest finish", "end times"]
    explanation: "Taking the talk that ends first leaves the most room for the rest; shortest-first and earliest-start both have counterexamples."
  - id: signed-byte
    skills: [datastructures-and-algorithms.bit-manipulation]
    prompt: "A Java byte holds 0xE9. Which expression gives the index 233 into a 256-entry table?"
    options: ["b", "b >> 1", "b & 0xFF", "(int) b"]
    answer: 2
    explanation: "Bytes are signed, so 0xE9 is -23; masking with 0xFF keeps the low 8 bits as a non-negative int."
  - id: top-bit
    skills: [datastructures-and-algorithms.bit-manipulation]
    prompt: "Bits are packed most significant first. Which mask selects bit i of the stream inside bits[i >>> 3]?"
    options: ["1 << (i & 7)", "0x80 >>> (i & 7)", "1 << i", "0xFF >> i"]
    answer: 1
    explanation: "Bit 0 of each byte is its top bit, 0x80; i & 7 is the position within the byte, so shift right from the top."
  - id: shift-unsigned
    skills: [datastructures-and-algorithms.bit-manipulation]
    prompt: "Why use >>> rather than >> to take the high bits of a long buffer?"
    options: ["It is faster", ">> copies the sign bit, so a buffer with its top bit set would fill with 1s; >>> fills with 0s", "They are the same for long", ">>> rounds"]
    answer: 1
    explanation: "Arithmetic shift preserves the sign; logical shift treats the value as unsigned bits, which is what bit packing needs."
  - id: canonical-why
    skills: [datastructures-and-algorithms.greedy, datastructures-and-algorithms.sorting-searching]
    prompt: "Why do DEFLATE archives store canonical code lengths instead of the Huffman tree?"
    options: ["Canonical codes are shorter", "The codes follow from the lengths alone (sorted by length, then symbol), so 256 small numbers describe the whole code", "Trees cannot be stored", "It makes compression lossless"]
    answer: 1
    explanation: "Any code with the same lengths compresses equally well; fixing the order of assignment makes the lengths enough to rebuild it."
  - id: complexity-budget
    skills: [datastructures-and-algorithms.problem-solving, datastructures-and-algorithms.complexity]
    prompt: "An interviewer says the input has up to 10⁶ elements and the time limit is about a second. Which target do you state before coding?"
    options: ["O(n²) is fine", "O(n log n) or O(n): about 2 · 10⁷ steps at most", "O(2ⁿ) with pruning", "Complexity does not matter for a second"]
    answer: 1
    explanation: "n² would be 10¹² steps; stating the budget early tells you which techniques are even candidates."
