  hints:
    - |-
      Four steps, each with one idea. Lengths: the greedy merge needs the two lightest trees again and again, so which structure hands you the minimum cheaply, and what must its comparator include so that ties always go the same way? Codes: once the symbols are sorted by length and value, each code is the previous one plus one, shifted when the length grows. Encoding and decoding: a code is a number and a length, never a string.
    - |-
      `codeLengths`: give every tree an `int` id with arrays `weight`, `smallest` and `parent`, keep ids in a `PriorityQueue` ordered by weight then smallest, merge until one is left, then walk `parent` from each leaf to count its depth (no recursion needed). `canonicalCodes`: sort the used values by `(length, value)` and check that the code never reaches `1L << length`. `encode`: a `long` buffer of pending bits; append each code, then flush bytes from its top while 8 or more bits are pending. `decode`: for each length, the first code and the number of codes; read bits into `current` until `current - first[length]` lands in `[0, count[length])`.
    - |-
      ```java
      // canonical decoding tables
      long code = 0;
      int index = 0;
      for (int length = 1; length <= maxLength; length++) {
          code <<= 1;
          first[length] = code;       // the first code of this length
          offset[length] = index;     // where its symbols start in the sorted list
          code += count[length];
          index += count[length];
      }
      // ... then, for each bit:
      current = (current << 1) | bit;
      length++;
      long delta = current - first[length];
      if (delta >= 0 && delta < count[length]) { emit(symbols[offset[length] + (int) delta]); current = 0; length = 0; }
      ```
