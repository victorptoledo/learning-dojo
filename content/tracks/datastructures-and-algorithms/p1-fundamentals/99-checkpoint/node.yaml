  hints:
    - |-
      Every event arrives once and leaves once, in the same order. If each structure is updated in O(1) when an event arrives and when it leaves, every question can be read off in O(1). Which structure gives you "the oldest event" cheaply, which one "how many of this user", and what is left over for the maximum?
    - |-
      Keep an `ArrayDeque<Event>` of all live events, a `HashMap<String, Integer>` of counts per user (remove the key at 0, so `size()` is the number of distinct users), a `long` sum of latencies, and a second `ArrayDeque<Event>` for the maximum. Put the eviction loop in `advanceTo` and call it from `record` before adding the new event.
    - |-
      ```java
      // on arrival: smaller latencies at the back can never be the maximum again
      while (!maxima.isEmpty() && maxima.peekLast().latency() < latencyMs) {
          maxima.pollLast();
      }
      maxima.addLast(event);

      // on departure (oldest first): drop it from the front if it is there
      Event gone = events.pollFirst();
      if (maxima.peekFirst() == gone) maxima.pollFirst();   // identity, not equals
      ```
