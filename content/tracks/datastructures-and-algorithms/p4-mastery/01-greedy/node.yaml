id: datastructures-and-algorithms.p4.greedy
kind: lesson
status: draft
title: "Greedy Algorithms"
summary: "When taking the locally best option is globally optimal: the greedy choice property, exchange arguments, the interval family (scheduling, merging, meeting rooms), Huffman coding, and how to recognise a problem where greedy is wrong."
objectives:
  - { id: o1, text: "Explain the greedy choice property and justify a greedy algorithm with an exchange argument or a counterexample", skills: [datastructures-and-algorithms.greedy] }
  - { id: o2, text: "Solve interval problems by sorting on the right key: activity selection, merging, minimum rooms, minimum arrows", skills: [datastructures-and-algorithms.greedy, datastructures-and-algorithms.sorting-searching] }
  - { id: o3, text: "Recognise the classic greedy algorithms in real systems (Huffman, Dijkstra, Kruskal, caching policies) and when to fall back to DP", skills: [datastructures-and-algorithms.greedy] }
prerequisites: [datastructures-and-algorithms.p3.dp-toolkit]
difficulty: 3
estimated_minutes: 45
xp: 200
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'A conference platform receives 20,000 talk proposals for a single stage, each with a start and an end time. The organisers want (1) the largest number of non-overlapping talks on that one stage, (2) the minimum number of stages needed to run every talk, and (3) a merged list of the busy periods of the venue. A colleague suggests picking the shortest talks first for (1). Give an algorithm for each with its cost, prove (or argue convincingly with an exchange argument) why your rule for (1) is optimal, give a counterexample to "shortest first", and explain what changes in (1) if every talk also has a different value and the goal is the largest total value.'
  criteria:
    - '(1) Sort by end time and take each talk that starts after the last chosen one ends; O(n log n)'
    - 'Exchange argument: any optimal schedule can swap its first talk for the earliest-ending one without losing a talk, so the greedy choice is safe'
    - 'Gives a valid counterexample to shortest-first (a short talk overlapping two longer, compatible talks)'
    - '(2) Sort by start and keep a min-heap of end times (or sweep sorted starts and ends); the answer is the maximum overlap; O(n log n)'
    - '(3) Sort by start and merge overlapping intervals; with values per talk, (1) becomes weighted interval scheduling, solved by DP with binary search, not greedy'
