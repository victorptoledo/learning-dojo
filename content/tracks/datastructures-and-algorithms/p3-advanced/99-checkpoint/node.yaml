title: "📋 Checkpoint 3: Advanced"
summary: "Prove the advanced phase: a quiz on shortest paths, union-find, spanning trees, tries and dynamic programming, and the search core of a fare site with regions, the cheapest fare, a flight limit, code suggestions and the cheapest network."
