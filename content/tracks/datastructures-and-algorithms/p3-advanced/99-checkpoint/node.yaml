  - { id: o1, text: "Explain Dijkstra and its limits, union-find and its optimisations, the cut property, tries and the cost of a dynamic programme", skills: [datastructures-and-algorithms.shortest-paths, datastructures-and-algorithms.tries, datastructures-and-algorithms.dynamic-programming] }
  - { id: o2, text: "Combine union-find, Dijkstra, a DP over the number of flights, a trie with a bounded heap and Kruskal in one service", skills: [datastructures-and-algorithms.shortest-paths, datastructures-and-algorithms.tries, datastructures-and-algorithms.dynamic-programming, datastructures-and-algorithms.trees-heaps] }
