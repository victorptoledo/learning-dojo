id: datastructures-and-algorithms.sidequest.memory-db
level: 4
title: "In-memory database"
summary: "The core of a small database: a skip list written by hand and held to a comparison budget, ranges and rank in O(log n), a table whose secondary indexes keep reads down, bitmap indexes counted with word operations, and a planner that picks the most selective index without reading a row."
statement: README.md
requires: ["datastructures-and-algorithms:P4"]
skills: [datastructures-and-algorithms.complexity, datastructures-and-algorithms.trees-heaps, datastructures-and-algorithms.bit-manipulation, datastructures-and-algorithms.greedy, datastructures-and-algorithms.sorting-searching]
runner: { image: dojo-java, timeout_secs: 240 }
stages:
  - { id: skip-list, title: "A skip list on a comparison budget" }
  - { id: ranges-and-rank, title: "Ranges, rank and select" }
  - { id: table-and-indexes, title: "A table with secondary indexes" }
  - { id: bitmap-indexes, title: "Bitmap indexes" }
  - { id: query-planner, title: "A planner and top-k" }
