schema_version: 2
id: kubernetes
name: "Kubernetes"
archetype: platform
category: "Infrastructure & Tools"
icon: "☸️"
description: "Containers at scale, declared and reconciled: the control plane, Pods, Deployments, Services, configuration, probes and resources, scheduling, storage and StatefulSets, Ingress and the Gateway API, Jobs, Kustomize and Helm, RBAC, Pod security, NetworkPolicy, autoscaling, debugging, operators and production operation."
status: draft
bridges_available: [java, python, javascript, csharp, go]
belts:
  - { name: "White Belt", required_xp: 0, title: "kubectl Applier" }
  - { name: "Yellow Belt", required_xp: 300, title: "Pod Navigator" }
  - { name: "Green Belt", required_xp: 800, title: "Helm Packager" }
  - { name: "Purple Belt", required_xp: 1500, title: "Traffic & Ingress Controller" }
  - { name: "Brown Belt", required_xp: 2500, title: "Auto-scaling Architect" }
  - { name: "Black Belt", required_xp: 5000, title: "Cluster Operator" }
  - { name: "Sensei", required_xp: 7000, title: "Kubernetes Grandmaster" }
phases:
  - { id: p0, dir: p0-first-steps, title: "First Steps", goal: "Why Kubernetes exists, a local cluster with kubectl and a first Pod manifest" }
  - { id: p1, dir: p1-fundamentals, title: "Fundamentals", goal: "The control plane, Pods, Deployments and rollouts, Services and DNS, configuration, probes and resources" }
  - { id: p2, dir: p2-intermediate, title: "Intermediate", goal: "Scheduling, storage and StatefulSets, Ingress and the Gateway API, Jobs and CronJobs, Kustomize and Helm" }
  - { id: p3, dir: p3-advanced, title: "Advanced", goal: "RBAC, Pod security, NetworkPolicy, autoscaling and safe releases with Helm" }
  - { id: p4, dir: p4-mastery, title: "Mastery", goal: "Debugging, operators and CRDs, and running clusters in production" }
