apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter
  labels:
    app.kubernetes.io/name: greeter
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: greeter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: greeter
    spec:
      containers:
        - name: greeter
          image: ghcr.io/acme/greeter:1.2.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: greeter-config
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
