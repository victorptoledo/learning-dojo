apiVersion: apps/v1
kind: Deployment
metadata:
  name: board-web
  namespace: board
  labels: &labels
    app.kubernetes.io/name: board-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: noticeboard
    app.kubernetes.io/version: "1.9.0"
spec:
  replicas: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: board-web
      app.kubernetes.io/part-of: noticeboard
  template:
    metadata:
      labels: *labels
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: web
          image: ghcr.io/acme/board-web:1.9.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_URL
              value: http://board-api
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: board-web
  namespace: board
  labels:
    app.kubernetes.io/name: board-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: noticeboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: board-web
    app.kubernetes.io/part-of: noticeboard
  ports:
    - name: http
      port: 80
      targetPort: http
