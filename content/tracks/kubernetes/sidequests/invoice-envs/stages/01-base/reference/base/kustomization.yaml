apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
labels:
  - pairs:
      app.kubernetes.io/name: invoices
      app.kubernetes.io/part-of: billing
    includeSelectors: true
configMapGenerator:
  - name: invoices-config
    envs:
      - config.env
  - name: invoices-rates
    files:
      - rates.yaml
