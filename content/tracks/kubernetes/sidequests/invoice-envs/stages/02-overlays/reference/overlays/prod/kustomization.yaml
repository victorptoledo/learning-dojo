apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: invoices-prod
labels:
  - pairs:
      environment: prod
    includeSelectors: false
    includeTemplates: true
images:
  - name: ghcr.io/acme/invoices
    newTag: 3.0.4
replicas:
  - name: invoices
    count: 3
configMapGenerator:
  - name: invoices-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
patches:
  - path: resources.yaml
