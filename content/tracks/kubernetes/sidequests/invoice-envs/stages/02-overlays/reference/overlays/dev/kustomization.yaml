apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
namespace: invoices-dev
labels:
  - pairs:
      environment: dev
    includeSelectors: false
    includeTemplates: true
images:
  - name: ghcr.io/acme/invoices
    newTag: 3.1.0-rc.2
replicas:
  - name: invoices
    count: 1
configMapGenerator:
  - name: invoices-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
secretGenerator:
  - name: invoices-db
    literals:
      - password=dev-only-password
