replicaCount: 2

image:
  repository: ghcr.io/acme/statuspage
  # Empty: the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: ""
  tls:
    enabled: false
    secretName: ""

serviceAccount:
  create: true
  # Empty: the fullname when created, "default" when not.
  name: ""

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

config:
  STATUS_TITLE: Acme status
  REFRESH_SECONDS: 30

# More variables for the container, as Kubernetes env entries.
extraEnv: []

podAnnotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

nameOverride: ""
fullnameOverride: ""
