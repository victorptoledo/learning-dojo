# Peak: web 12 + 3 surge, api 10 + 3 surge, db 1 = 29 Pods, 5.25 CPU and 6.1Gi requested,
# 12.3Gi of memory limits.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: shop-quota
  namespace: shop
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 12Gi
    limits.memory: 20Gi
    pods: "32"
    persistentvolumeclaims: "2"
    requests.storage: 50Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: shop-defaults
  namespace: shop
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 128Mi }
      default: { memory: 256Mi }
      max: { memory: 4Gi }
