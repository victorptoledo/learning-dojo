apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
  labels: &labels
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: storefront
spec:
  replicas: 3
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/shop-api:7.1.3
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_HOST
              value: db
            # The payment provider, on the internet.
            - name: PAYMENTS_URL
              value: https://payments.example.com
          readinessProbe:
            httpGet: { path: /ready, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shop
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: storefront
spec:
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: storefront
  ports:
    - name: http
      port: 80
      targetPort: http
