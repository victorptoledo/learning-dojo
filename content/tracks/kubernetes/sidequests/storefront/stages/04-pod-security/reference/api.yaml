apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shop
  labels: &labels
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: storefront
spec:
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: shop-critical
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: *labels
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: *labels
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: api
          image: ghcr.io/acme/shop-api:7.1.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_HOST
              value: db
            # The payment provider, on the internet.
            - name: PAYMENTS_URL
              value: https://payments.example.com
          readinessProbe:
            httpGet: { path: /ready, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shop
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: storefront
spec:
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: storefront
  ports:
    - name: http
      port: 80
      targetPort: http
