apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  labels:
    app.kubernetes.io/name: postgres
type: Opaque
stringData:
  password: change-me-in-a-real-cluster
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  # todo: make this Service headless
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1 # todo: see README.md
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18.1
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              value: change-me # todo: read it from the Secret
          # todo: PGDATA, the volume mount, probes and resources
  # todo: the volume claim template "data"
# todo: the PodDisruptionBudget
