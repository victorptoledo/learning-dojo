{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "thumbnailer.fullname" . }}
  labels:
    {{- include "thumbnailer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "thumbnailer.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Prometheus Pods of the monitoring namespace: one peer, so both selectors must match.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.metrics.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.metrics.podLabels | nindent 14 }}
      ports:
        - { protocol: TCP, port: metrics }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.queue.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.queue.podLabels | nindent 14 }}
      ports:
        - { protocol: TCP, port: {{ $np.queue.port }} }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # The API server, for the Jobs and Pods the Role allows.
    - to:
        - ipBlock:
            cidr: {{ $np.apiServer.cidr }}
      ports:
        - { protocol: TCP, port: {{ $np.apiServer.port }} }
{{- end }}
