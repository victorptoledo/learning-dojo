# The production values. They are complete: change the templates, not this file.
image:
  tag: "3.2.0"

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  messagesPerReplica: 20

networkPolicy:
  enabled: true
  apiServer:
    cidr: 172.20.0.10/32
    port: 6443
