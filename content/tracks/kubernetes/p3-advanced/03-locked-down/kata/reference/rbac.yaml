apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory
  namespace: inventory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inventory
  namespace: inventory
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [inventory-flags]
    verbs: [get, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inventory
  namespace: inventory
subjects:
  - kind: ServiceAccount
    name: inventory
    namespace: inventory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: inventory
