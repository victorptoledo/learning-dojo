apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory
  namespace: inventory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inventory
  namespace: inventory
rules:
  # todo: far too much; see README.md
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inventory
  namespace: inventory
subjects:
  - kind: ServiceAccount
    name: inventory
    namespace: inventory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: inventory
