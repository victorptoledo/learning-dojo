# How shop.example.com reaches checkout, through the shared Gateway public in namespace infra.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: checkout
spec:
  parentRefs:
    - { name: public, namespace: infra }
  hostnames: [shop.example.com]
  rules:
    # Testers and synthetic checks opt in to the canary with a header.
    - matches:
        - headers:
            - { type: Exact, name: x-canary, value: always }
      backendRefs:
        - { name: checkout-canary, port: 80 }
    # Everyone else: 90% stable, 10% canary.
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: checkout-stable, port: 80, weight: 90 }
        - { name: checkout-canary, port: 80, weight: 10 }
