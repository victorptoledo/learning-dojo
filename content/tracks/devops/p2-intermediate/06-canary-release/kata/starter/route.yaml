# How shop.example.com reaches checkout, through the shared Gateway public in namespace infra.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: checkout
spec:
  parentRefs:
    - { name: public, namespace: infra }
  hostnames: [shop.example.com]
  rules:
    # todo: first, requests with the header x-canary: always go to the canary only
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: checkout-stable, port: 80 } # todo: 90% here, 10% to checkout-canary
