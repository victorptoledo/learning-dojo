# CI for the orders service: lint and test every change, and publish the image from main.
# A first draft by a colleague: it works, but read README.md for what it must become.
name: ci

on: [push, pull_request] # todo: pushes to main only, and every pull request

permissions: write-all # todo: read-only by default

# todo: cancel a run that a newer push to the same ref makes obsolete

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
  # todo: split into lint, test (a Go matrix) and image jobs
