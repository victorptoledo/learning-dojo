id: devops.p1.checkpoint
kind: checkpoint
status: draft
title: "📋 Checkpoint 1: Fundamentals"
summary: "Prove the fundamentals: a quiz on Linux operations, containers, CI pipelines and configuration management, and an integration kata that turns a draft workflow into a production CI pipeline."
objectives:
  - { id: o1, text: "Explain Linux triage, container images, CI pipelines and configuration management in your own words", skills: [devops.linux-internals, devops.docker-containers, devops.cicd-pipelines, devops.config-management] }
  - { id: o2, text: "Write a CI pipeline with parallel jobs, a matrix, least-privilege tokens, pinned actions and an image published only from main", skills: [devops.cicd-pipelines, devops.docker-containers] }
prerequisites: [devops.p1.converge-host]
difficulty: 3
estimated_minutes: 75
xp: 350
closes_phase: p1
covers_skills: [devops.linux-internals, devops.docker-containers, devops.cicd-pipelines, devops.config-management]
lesson: lesson.md
quiz: quiz.yaml
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-devops, timeout_secs: 90 }
  hints:
    - |-
      Start from the shape: three jobs (`lint`, `test`, `image`), `image` with `needs`. Then go through the table line by line; most rules are one key each. Run `actionlint` locally if you have it: it catches typos in keys and expressions.
    - |-
      Top level: `on`, `permissions: { contents: read }`, `concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }`. Per job: `timeout-minutes`. In `test`: `strategy: { fail-fast: false, matrix: { go: ["1.26", "1.27"] } }` and `go-version: ${{ matrix.go }}`. In `image`: `permissions: { contents: read, packages: write }`, `if: github.event_name == 'push'` on the login step, and `push: ${{ github.event_name == 'push' }}` on the build.
    - |-
      ```yaml
      image:
        needs: [lint, test]
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions: { contents: read, packages: write }
        steps:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with: { persist-credentials: false }
          - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
          - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
            if: github.event_name == 'push'
            with: { registry: ghcr.io, username: ..., password: ... }
          - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
            with:
              push: ${{ github.event_name == 'push' }}
              tags: ...
              cache-from: type=gha
              cache-to: type=gha,mode=max
      ```
requirements:
  - kind: docker-engine
    name: Docker Desktop running
    why: Your workflow is checked inside a container.
    install_hint: "install Docker Desktop (winget install Docker.DockerDesktop) and start it"
  - kind: docker-image
    name: dojo-devops runner image
    image: dojo-devops
    why: The container with actionlint, Terraform, promtool and bats that checks DevOps katas offline.
