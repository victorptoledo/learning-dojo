name: ci

on:
  push:
    branches: [main]
  pull_request:

# The token can only read the repository; no job needs more.
permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/toolbox
          key: toolbox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.lock') }}
          restore-keys: toolbox-${{ runner.os }}-${{ runner.arch }}-
      - name: Install the tools
        run: scripts/install-tools.sh >> "$GITHUB_PATH"
      - name: Lint
        run: scripts/ci.sh lint

  test:
    needs: lint
    strategy:
      # One failing runner must not cancel the others: we want every result.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        include:
          - os: ubuntu-24.04-arm
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/toolbox
          key: toolbox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.lock') }}
          restore-keys: toolbox-${{ runner.os }}-${{ runner.arch }}-
      - name: Install the tools
        run: scripts/install-tools.sh >> "$GITHUB_PATH"
      - name: Test
        run: scripts/ci.sh test
      - name: Keep the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.os }}
          path: reports/
          retention-days: 14

  # The only check the branch protection rule requires: it fails unless every job it
  # needs succeeded, so adding a job never means editing the repository settings.
  ci-ok:
    needs: [lint, test]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "a required job ended with: $result"
              exit 1
            fi
          done
