# The route the controller drives (for reference; `kubectl apply -f k8s/`). Testers reach
# the canary on purpose with the header; everyone else is split by weight.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: checkout
  namespace: shop
spec:
  parentRefs:
    - name: public
      namespace: infra
  hostnames: ["shop.example.com"]
  rules:
    - matches:
        - headers:
            - { type: Exact, name: x-canary, value: always }
      backendRefs:
        - { name: checkout-canary, port: 80 }
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: checkout-stable, port: 80, weight: 100 }
        - { name: checkout-canary, port: 80, weight: 0 }
