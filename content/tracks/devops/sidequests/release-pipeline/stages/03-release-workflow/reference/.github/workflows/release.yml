name: release

# A release is a tag: `git tag v1.2.0 && git push origin v1.2.0`.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Two pushes of the same tag never publish at the same time, and a release in progress
# is never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        target: [linux-amd64, linux-arm64, darwin-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          # The commit time, so a rebuild of this tag gives the same bytes.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          scripts/build.sh "$VERSION" "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The only job that can write: it publishes what build produced, after checking it.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'dist-*' --dir downloads
          mkdir -p dist
          mv downloads/*/*.tar.gz dist/
      - name: Describe the release
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: scripts/manifest.sh dist
      - name: Verify the release
        run: scripts/verify.sh dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--verify-tag --title "$TAG" --generate-notes)
          if [[ $TAG == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS dist/manifest.json "${flags[@]}"
