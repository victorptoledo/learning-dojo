name: promote

# Started by hand (or by another workflow): which release, to which environment.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The release to promote, without the v (1.2.0)"
        required: true
        type: string
      environment:
        description: "Where it goes"
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

# One promotion per environment at a time, never cancelled halfway.
concurrency:
  group: promote-${{ inputs.environment }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Production can require a reviewer: the job waits for the approval here.
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release download "v$VERSION" --dir "deploy/releases/$VERSION"
      - name: Promote
        env:
          VERSION: ${{ inputs.version }}
          TARGET_ENV: ${{ inputs.environment }}
        run: scripts/promote.sh deploy "$VERSION" "$TARGET_ENV"
      - name: Record the promotion
        env:
          VERSION: ${{ inputs.version }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/channels
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "promote: $TARGET_ENV runs $VERSION"
          git push
