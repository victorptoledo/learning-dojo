# 1% of checkout requests fail; another job's errors must not count. round() hides float noise.
rule_files: [../slo.rules.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="checkout", code="200"}'
        values: '0+990x420'
      - series: 'http_requests_total{job="checkout", code="503"}'
        values: '0+10x420'
      - series: 'http_requests_total{job="search", code="500"}'
        values: '0+500x420'
    promql_expr_test:
      - expr: round(job:slo_errors_per_request:ratio_rate5m, 0.0001)
        eval_time: 30m
        exp_samples:
          - labels: '{job="checkout"}'
            value: 0.01
      - expr: round(job:slo_errors_per_request:ratio_rate30m, 0.0001)
        eval_time: 1h
        exp_samples:
          - labels: '{job="checkout"}'
            value: 0.01
      - expr: round(job:slo_errors_per_request:ratio_rate1h, 0.0001)
        eval_time: 2h
        exp_samples:
          - labels: '{job="checkout"}'
            value: 0.01
      - expr: round(job:slo_errors_per_request:ratio_rate6h, 0.0001)
        eval_time: 6h30m
        exp_samples:
          - labels: '{job="checkout"}'
            value: 0.01
