# 2% of requests fail: 20 times the budget. Page within minutes; the ticket waits its 15m.
rule_files: [../slo.rules.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="checkout", code="200"}'
        values: '0+980x120'
      - series: 'http_requests_total{job="checkout", code="500"}'
        values: '0+20x120'
    alert_rule_test:
      - eval_time: 10m
        alertname: CheckoutErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              job: checkout
              severity: page
              slo: checkout-availability
            exp_annotations:
              summary: checkout is burning its error budget fast
              runbook_url: https://runbooks.example.com/checkout-slo
      - eval_time: 10m
        alertname: CheckoutErrorBudgetBurnSlow
        exp_alerts: []
