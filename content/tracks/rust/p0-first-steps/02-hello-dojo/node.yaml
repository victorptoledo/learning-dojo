id: rust.p0.hello-dojo
kind: kata
status: draft
title: "Hello, Dojo: Your First Kata"
summary: "Write your first Rust function, run its tests and see how katas are checked."
objectives:
  - { id: o1, text: "Write a function that takes a string slice and returns an owned String", skills: [rust.setup] }
prerequisites: [rust.p0.setup]
difficulty: 1
estimated_minutes: 15
xp: 100
lesson: lesson.md
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-rust, timeout_secs: 120 }
  hints:
    - |-
      Which two cases does the greeting have? What is left of `"   "` once you remove the spaces around it?
    - |-
      Trim first, then decide. `name.trim()` gives a `&str` without the spaces at both ends, and `.is_empty()` tells whether anything is left. Because `if` is an expression, it can pick the word to greet.
    - |-
      ```rust
      let trimmed = name.trim();
      let who = if trimmed.is_empty() { /* ? */ } else { /* ? */ };
      format!(/* the welcome message with {who} */)
      ```
requirements:
  - kind: docker-engine
    name: Docker Desktop running
    why: Your kata is checked inside a container.
    install_hint: "install Docker Desktop (winget install Docker.DockerDesktop) and start it"
  - kind: docker-image
    name: dojo-rust runner image
    image: dojo-rust
    why: The container with Rust, clippy and rustfmt that runs the grading tests.
  - kind: vscode-extension
    name: CodeLLDB
    id: vadimcn.vscode-lldb
    required: false
    why: Breakpoints and step-by-step debugging of your tests.
remedial:
  - id: greeting-drill
    title: "Greeting Drill: &str In, String Out"
    summary: "Three small functions that read string slices and build owned Strings."
    skills: [rust.setup]
    kata:
      statement: remedial/greeting-drill/README.md
      starter: remedial/greeting-drill/starter
      tests: remedial/greeting-drill/tests
      reference: remedial/greeting-drill/reference
      runner: { image: dojo-rust, timeout_secs: 120 }
