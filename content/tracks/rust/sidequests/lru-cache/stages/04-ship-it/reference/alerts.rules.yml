groups:
  - name: cache
    rules:
      - alert: CacheHitRatioLow
        expr: |
          sum by (job) (rate(cache_hits_total[5m]))
            / (sum by (job) (rate(cache_hits_total[5m])) + sum by (job) (rate(cache_misses_total[5m])))
            < 0.8
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.job }} cache hit ratio below 80%"
