id: rust.p2.checkpoint
kind: checkpoint
status: draft
title: "📋 Checkpoint 2: Intermediate"
summary: "Prove the intermediate phase: a quiz and an integration kata that parses, validates and ranks a grade book."
objectives:
  - { id: o1, text: "Report every failure as a typed error through Result and ?", skills: [rust.option-result] }
  - { id: o2, text: "Process data with iterator chains and implement a trait for your own type", skills: [rust.iterators-closures, rust.traits-generics] }
prerequisites: [rust.p2.modules-testing]
difficulty: 3
estimated_minutes: 70
xp: 350
closes_phase: p2
covers_skills: [rust.option-result, rust.traits-generics, rust.iterators-closures, rust.modules-testing]
lesson: lesson.md
quiz: quiz.yaml
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-rust, timeout_secs: 120 }
  hints:
    - |-
      Split the problem: one function that parses a single line into a `Student` or a `GradeError`, and a loop that skips blank and `#` lines and stops at the first error. What does `"abc"` give when parsed as a number, and what about `"120"`?
    - |-
      `line.split_once(':')` with `.ok_or(GradeError::MissingColon { line })?` handles the colon. Scores: `split(',')`, `trim()`, then `value.parse::<u32>()`, rejecting results above 100 with the same `BadScore`. `collect::<Result<Vec<_>, _>>()` stops at the first error. For the ranking, sort with `partial_cmp` on the averages, then by name.
    - |-
      ```rust
      fn parse_line(line: usize, text: &str) -> Result<Student, GradeError> {
          let (name, scores) = text.split_once(':').ok_or(GradeError::MissingColon { line })?;
          let name = name.trim();
          // MissingName and NoScores checks
          let scores = scores
              .split(',')
              .map(|value| {
                  let value = value.trim();
                  match value.parse::<u32>() {
                      Ok(score) if score <= 100 => Ok(score),
                      _ => Err(GradeError::BadScore { line, value: value.to_string() }),
                  }
              })
              .collect::<Result<Vec<u32>, GradeError>>()?;
          Ok(Student { name: name.to_string(), scores })
      }
      ```
requirements:
  - kind: docker-engine
    name: Docker Desktop running
    why: Your kata is checked inside a container.
    install_hint: "install Docker Desktop (winget install Docker.DockerDesktop) and start it"
  - kind: docker-image
    name: dojo-rust runner image
    image: dojo-rust
    why: The container with Rust, clippy and rustfmt that runs the grading tests.
  - kind: vscode-extension
    name: CodeLLDB
    id: vadimcn.vscode-lldb
    required: false
    why: Breakpoints and step-by-step debugging of your tests.
