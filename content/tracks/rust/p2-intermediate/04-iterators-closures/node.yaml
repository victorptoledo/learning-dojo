id: rust.p2.iterators-closures
kind: lesson
status: draft
title: "Iterators and Closures"
summary: "Replace index loops with lazy iterator chains and small closures."
objectives:
  - { id: o1, text: "Write closures and pick between Fn, FnMut, FnOnce and move", skills: [rust.iterators-closures] }
  - { id: o2, text: "Transform data with map, filter and friends, and collect the result", skills: [rust.iterators-closures] }
  - { id: o3, text: "Implement the Iterator trait for your own type", skills: [rust.iterators-closures, rust.traits-generics] }
prerequisites: [rust.p2.config-parser]
difficulty: 3
estimated_minutes: 40
xp: 200
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Rewrite a loop that filters, transforms and sums a list into an iterator chain, and explain laziness and the difference between `iter`, `iter_mut` and `into_iter`.'
  criteria:
    - 'The chain is correct and equivalent to the loop'
    - 'Explains that adapters are lazy until a consumer runs'
    - 'Explains the three iteration modes and ownership'
    - 'Mentions that closures capture their environment'
