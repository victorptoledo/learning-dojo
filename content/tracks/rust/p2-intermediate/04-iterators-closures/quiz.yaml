questions:
  - id: lazy
    prompt: What does this code print?
    code: |
      let v = vec![1, 2, 3];
      v.iter().map(|n| { println!("{n}"); n * 2 });
    options: ["1 2 3", "2 4 6", "Nothing: map is lazy and nothing consumes it"]
    answer: 2
    explanation: "Adapters only describe work; a consumer such as collect or for must pull the items."
  - id: fnmut
    prompt: "let mut count = 0; let mut inc = || count += 1; Which trait does inc implement (at most)?"
    options: ["Fn", "FnMut", "FnOnce only"]
    answer: 1
    explanation: "It changes a captured variable, so it needs &mut access: FnMut (and therefore also FnOnce)."
  - id: into-iter
    prompt: After for name in names (no &), can you still use names?
    options: ["Yes", "No, the loop called into_iter and moved it"]
    answer: 1
    explanation: "for x in v consumes v. Use for x in &v to only borrow it."
  - id: sum-output
    prompt: What is the result?
    code: |
      (1..=5).filter(|n| n % 2 == 1).map(|n| n * n).sum::<i32>()
    answers: ["35"]
    explanation: "Odd numbers 1, 3, 5 squared are 1, 9, 25; their sum is 35."
  - id: collect-type
    prompt: Why does let v = (1..4).collect(); not compile?
    options:
      - "Ranges cannot be collected"
      - "collect can build many collections, so it needs the target type"
      - "collect needs a closure"
    answer: 1
    explanation: "Write let v: Vec<_> = ... or collect::<Vec<_>>()."
  - id: move-closure
    prompt: Which keyword makes a closure take ownership of the variables it captures?
    answers: ["move"]
    explanation: "move is needed when the closure outlives the current scope, as in threads or returned closures."
