id: rust.p2.config-parser
kind: kata
status: draft
title: "Config Parser: Errors as Values"
summary: "Parse a key=value file into a map and report every problem with a typed error."
objectives:
  - { id: o1, text: "Model failures with an error enum and return them through Result", skills: [rust.option-result] }
  - { id: o2, text: "Implement Display and std::error::Error for your own error type", skills: [rust.option-result] }
prerequisites: [rust.p2.option-result]
difficulty: 3
estimated_minutes: 50
xp: 250
lesson: lesson.md
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-rust, timeout_secs: 120 }
requirements:
  - kind: docker-engine
    name: Docker Desktop running
    why: Your kata is checked inside a container.
    install_hint: "install Docker Desktop (winget install Docker.DockerDesktop) and start it"
  - kind: docker-image
    name: dojo-rust runner image
    image: dojo-rust
    why: The container with Rust, clippy and rustfmt that runs the grading tests.
  - kind: vscode-extension
    name: CodeLLDB
    id: vadimcn.vscode-lldb
    required: false
    why: Breakpoints and step-by-step debugging of your tests.
