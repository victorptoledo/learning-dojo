id: rust.p4.production-rust
kind: lesson
status: draft
title: "Production Rust: Errors, Logging and Configuration"
summary: "What a real service needs: application errors with context, structured logs, configuration and release builds."
objectives:
  - { id: o1, text: "Choose between thiserror for libraries and anyhow for applications", skills: [rust.production] }
  - { id: o2, text: "Add structured logging with tracing and configure it from the environment", skills: [rust.production] }
  - { id: o3, text: "Load configuration from arguments and environment, and ship an optimised release build", skills: [rust.production] }
prerequisites: [rust.p4.async-tokio]
difficulty: 4
estimated_minutes: 45
xp: 300
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'List what you would put in place before running a Rust service in production: error handling, logging, configuration and packaging. Justify each choice briefly.'
  criteria:
    - 'Error handling strategy (thiserror for libraries, anyhow for applications, or equivalent)'
    - 'Structured logging or tracing'
    - 'Configuration from the environment with validation'
    - 'A small, reproducible build or container image'
