id: rust.p3.parallel-word-count
kind: kata
status: draft
title: "Parallel Word Count: Scoped Threads"
summary: "Split the work into chunks, count each chunk on its own thread and merge the results."
objectives:
  - { id: o1, text: "Borrow local data from threads with std::thread::scope", skills: [rust.concurrency, rust.lifetimes] }
  - { id: o2, text: "Split work into balanced chunks and merge partial results", skills: [rust.concurrency, rust.collections] }
prerequisites: [rust.p3.concurrency]
difficulty: 4
estimated_minutes: 60
xp: 300
lesson: lesson.md
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-rust, timeout_secs: 120 }
  hints:
    - |-
      Start with `chunk_ranges` on paper: with 10 items and 3 workers, how many go in each range, and which ranges get the extra item? What is the size of one range when there are more workers than items?
    - |-
      Size: `len / workers` each, and the first `len % workers` ranges get one more. Use `workers.max(1).min(len)` as the real number of ranges. In `parallel_count`, `thread::scope` lets each spawned closure borrow `&texts[range]` without `Arc`; collect the handles in a Vec, then `join()` each one and `merge` its map.
    - |-
      ```rust
      pub fn chunk_ranges(len: usize, workers: usize) -> Vec<Range<usize>> {
          let parts = workers.max(1).min(len);
          let mut ranges = Vec::with_capacity(parts);
          let mut start = 0;
          for index in 0..parts {
              let size = /* len / parts, plus one for the first len % parts ranges */;
              ranges.push(start..start + size);
              start += size;
          }
          ranges
      }

      pub fn parallel_count(texts: &[&str], workers: usize) -> HashMap<String, usize> {
          std::thread::scope(|scope| {
              let handles: Vec<_> = chunk_ranges(texts.len(), workers)
                  .into_iter()
                  .map(|range| scope.spawn(move || /* count the texts of this range */))
                  .collect();
              let mut total = HashMap::new();
              for handle in handles {
                  // join and merge
              }
              total
          })
      }
      ```
