schema_version: 2
id: rust
name: "Rust"
archetype: language
category: "Programming Languages"
icon: "🦀"
description: "Master the systems language without fearing the borrow checker and without a garbage collector."
status: draft
bridges_available: [java]
belts:
  - { name: "White Belt", required_xp: 0, title: "Java Refugee" }
  - { name: "Yellow Belt", required_xp: 300, title: "Borrow Apprentice" }
  - { name: "Green Belt", required_xp: 800, title: "Pattern Matcher" }
  - { name: "Purple Belt", required_xp: 1500, title: "Trait Master" }
  - { name: "Brown Belt", required_xp: 2500, title: "Pointer Alchemist" }
  - { name: "Black Belt", required_xp: 4000, title: "Fearless Concurrency Master" }
  - { name: "Sensei", required_xp: 6000, title: "Ferris Ascended" }
phases:
  - { id: p0, dir: p0-first-steps, title: "First Steps", goal: "Install the toolchain, run a first program and see why the language exists" }
  - { id: p1, dir: p1-fundamentals, title: "Fundamentals", goal: "Types, syntax, control flow, functions and basic data structures" }
  - { id: p2, dir: p2-intermediate, title: "Intermediate", goal: "Abstractions, error handling, data manipulation and good practices" }
  - { id: p3, dir: p3-advanced, title: "Advanced", goal: "Performance, concurrency, design patterns and architecture" }
  - { id: p4, dir: p4-mastery, title: "Mastery", goal: "Production scenarios, specialised topics and resilience" }
requirements:
  - kind: tool
    name: Rust toolchain (cargo)
    command: cargo
    min_version: "1.85"
    required: false
    why: Runs and debugs the visible tests in VS Code. The grading checks run in Docker and do not need it.
    install_hint: "install rustup: winget install Rustlang.Rustup, then reopen the terminal"
    update: [rustup, update, stable]
  - kind: vscode-extension
    name: rust-analyzer
    id: rust-lang.rust-analyzer
    required: false
    why: Shows errors as you type and adds the Run Test and Debug buttons.
  - kind: vscode-extension
    name: Even Better TOML
    id: tamasfe.even-better-toml
    required: false
    why: Highlights and checks Cargo.toml.
