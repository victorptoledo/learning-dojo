id: rust.p1.collections
kind: lesson
status: draft
title: "Collections: Vec, String and HashMap"
summary: "Lists, owned text and key-value maps, and how the borrow checker keeps them safe."
objectives:
  - { id: o1, text: "Create, read and loop over a Vec without consuming it", skills: [rust.collections] }
  - { id: o2, text: "Choose between String and &str and process UTF-8 text", skills: [rust.collections] }
  - { id: o3, text: "Count and group values with HashMap and its entry API", skills: [rust.collections] }
prerequisites: [rust.p1.control-flow-workout]
difficulty: 2
estimated_minutes: 35
xp: 200
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Describe when you would choose a `Vec`, a `HashMap` and a `BTreeMap`, and explain the difference between `String` and `&str` with an example of a function signature that accepts both.'
  criteria:
    - 'Gives a correct use case for each collection'
    - 'Mentions ordering and lookup costs'
    - 'Explains owned String versus borrowed &str'
    - 'Shows a function taking &str and why it accepts String too'
