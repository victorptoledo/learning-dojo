id: rust.p1.checkpoint
kind: checkpoint
status: draft
title: "📋 Checkpoint 1: Fundamentals"
summary: "Prove the fundamentals: a quiz over the whole phase and an integration kata that models a small inventory."
objectives:
  - { id: o1, text: "Explain ownership, borrowing and mutability rules in your own words", skills: [rust.ownership-basics, rust.borrowing-references, rust.variables-mutability] }
  - { id: o2, text: "Model a domain with structs, enums and match, stored in Vec and HashMap", skills: [rust.structs-enums, rust.collections] }
prerequisites: [rust.p1.word-counter]
difficulty: 3
estimated_minutes: 60
xp: 300
closes_phase: p1
covers_skills: [rust.variables-mutability, rust.ownership-basics, rust.borrowing-references, rust.structs-enums, rust.collections]
lesson: lesson.md
quiz: quiz.yaml
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-rust, timeout_secs: 120 }
  hints:
    - |-
      `remove` has three outcomes: which one do you check first? When the quantity reaches 0, what must happen to the entry?
    - |-
      `self.items.get(name)` answers `Unknown`. `get_mut` lets you subtract in place, and `self.items.remove(name)` drops an item at 0. For `report` and `low_stock`, collect into a Vec, then `sort()`. Returning `&str` works because the names live in `self.items`: `key.as_str()`.
    - |-
      ```rust
      pub fn remove(&mut self, name: &str, quantity: u32) -> Removal {
          let Some(stock) = self.items.get_mut(name) else {
              return Removal::Unknown;
          };
          if *stock < quantity {
              return Removal::NotEnough { available: *stock };
          }
          *stock -= quantity;
          let left = *stock;
          // remove the entry when left == 0
          Removal::Done { left }
      }

      pub fn low_stock(&self, threshold: u32) -> Vec<&str> {
          let mut names: Vec<&str> = self.items.iter()
              .filter(|(_, quantity)| /* below the threshold */)
              .map(|(name, _)| name.as_str())
              .collect();
          names.sort();
          names
      }
      ```
requirements:
  - kind: docker-engine
    name: Docker Desktop running
    why: Your kata is checked inside a container.
    install_hint: "install Docker Desktop (winget install Docker.DockerDesktop) and start it"
  - kind: docker-image
    name: dojo-rust runner image
    image: dojo-rust
    why: The container with Rust, clippy and rustfmt that runs the grading tests.
  - kind: vscode-extension
    name: CodeLLDB
    id: vadimcn.vscode-lldb
    required: false
    why: Breakpoints and step-by-step debugging of your tests.
remedial:
