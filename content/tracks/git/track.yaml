schema_version: 2
id: git
name: "Git & GitHub"
archetype: platform
category: "Infrastructure & Tools"
icon: "🐙"
description: "Distributed version control from the inside out: the object model and the DAG, staging and commits, branches, merge and rebase, remotes, conflicts, history rewriting and the reflog, bisect, tags, hooks, worktrees, large repositories, signing and team workflows."
status: draft
bridges_available: [java, python, javascript, csharp, go]
belts:
  - { name: "White Belt", required_xp: 0, title: "Git Commit 'update'" }
  - { name: "Yellow Belt", required_xp: 300, title: "Branch Creator" }
  - { name: "Green Belt", required_xp: 800, title: "Conflict Resolver" }
  - { name: "Purple Belt", required_xp: 1500, title: "Interactive Rebaser" }
  - { name: "Brown Belt", required_xp: 2500, title: "Git Archeologist (Bisect)" }
  - { name: "Black Belt", required_xp: 5000, title: "Reflog Rescuer" }
  - { name: "Sensei", required_xp: 6500, title: "Git Mastermind" }
phases:
  - { id: p0, dir: p0-first-steps, title: "First Steps", goal: "Install and configure Git, see why version control exists and meet the dojo's git katas" }
  - { id: p1, dir: p1-fundamentals, title: "Fundamentals", goal: "Objects and the DAG, the staging area and commits, branches and merging, and undoing local changes" }
  - { id: p2, dir: p2-intermediate, title: "Intermediate", goal: "Merge or rebase, work with remotes, resolve conflicts and rewrite history safely" }
  - { id: p3, dir: p3-advanced, title: "Advanced", goal: "Hunt bugs with bisect, cut releases with tags, automate with hooks and juggle worktrees and submodules" }
  - { id: p4, dir: p4-mastery, title: "Mastery", goal: "Large repositories, signed and secret-free history, team workflows and recovering from any mistake" }
