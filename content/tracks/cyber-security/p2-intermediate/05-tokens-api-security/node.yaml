id: cyber-security.p2.tokens-api-security
kind: lesson
status: draft
title: "Tokens and API Security: JWT, OAuth 2.0 and Key Rotation"
summary: "Opaque and self-contained tokens, the JWT pitfalls that keep causing breaches, OAuth 2.0 and OpenID Connect flows for apps and APIs, key rotation with key ids, and the OWASP API Security Top 10."
objectives:
  - { id: o1, text: "Choose between opaque session tokens and signed self-contained tokens and validate a JWT completely", skills: [cyber-security.tokens-api-security] }
  - { id: o2, text: "Pick the right OAuth 2.0 flow (authorization code with PKCE, client credentials) and explain what OIDC adds", skills: [cyber-security.tokens-api-security] }
  - { id: o3, text: "Rotate signing keys with key ids and protect APIs against the OWASP API Security Top 10", skills: [cyber-security.tokens-api-security] }
prerequisites: [cyber-security.p2.verify-signatures]
difficulty: 3
estimated_minutes: 55
xp: 250
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'A mobile app logs users in by sending their password to your API, which returns a JWT signed with HS256 using the secret "changeme", valid for 30 days, with the claim {"sub": "42", "admin": false}. The API decodes the token, trusts its "alg" header and checks only the signature. Rewrite the design: the login flow, the token format and lifetime, how the API validates tokens, and how signing keys are rotated.'
  criteria:
    - 'Moves the app to OAuth 2.0 authorization code with PKCE through the system browser (or explains why the password must not be handled by many clients)'
    - 'Short-lived access tokens (minutes) with refresh tokens that rotate and can be revoked'
    - 'Pins the expected algorithm, and validates iss, aud, exp, nbf and the key id, rejecting alg none'
    - 'Uses a strong random key or an asymmetric key pair (RS256, ES256, EdDSA) published as a JWKS with kid, and rotates by adding the new key before signing with it and removing the old one after the longest token lifetime'
    - 'Does not put authorisation decisions that must be revocable into a long-lived token, and keeps tokens out of URLs and logs'
