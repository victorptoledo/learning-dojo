id: cyber-security.p3.sshd-audit
kind: kata
status: draft
title: "SSH Config Audit: Find the Risky Settings"
summary: "A bash and awk auditor for sshd_config that computes the effective global settings the way sshd does (first value wins, case-insensitive keywords, key=value, defaults, Match blocks) and reports risky ones with severities and an exit status for CI."
objectives:
  - { id: o1, text: "Audit an SSH server configuration against a hardening baseline", skills: [cyber-security.hardening] }
  - { id: o2, text: "Parse a configuration with the same rules as the program that reads it, including defaults", skills: [cyber-security.hardening] }
  - { id: o3, text: "Report findings with severities and an exit status a pipeline can fail on", skills: [cyber-security.hardening] }
prerequisites: [cyber-security.p3.hardening]
difficulty: 3
estimated_minutes: 60
xp: 250
lesson: lesson.md
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-linux, timeout_secs: 60 }
  hints:
    - |-
      Split the job in two: first compute the effective value of each keyword, then run the checks on those values. In awk, for each line: skip blanks and comments, stop at `Match`, take the keyword with `tolower`, and store the value only `if (!(key in value))`, which is "first value wins".
    - |-
      To accept both `Key value` and `Key=value`: `sub(/^[ \t]+/, "")`, then `match($0, /^[A-Za-z]+/)` for the keyword, then remove it and strip `^[ \t]*=?[ \t]*` from the rest to get the value. For the defaults, write a small function `get(key, default)` that also tells you whether the value was set, so you can add ` (default)`. For algorithm lists, `split(list, parts, ",")` and test each part with a regular expression.
    - |-
      ```awk
      {
          sub(/^[ \t]+/, ""); sub(/[ \t\r]+$/, "")
          if ($0 == "" || substr($0, 1, 1) == "#") next
          if (!match($0, /^[A-Za-z0-9]+/)) next
          key = tolower(substr($0, 1, RLENGTH))
          rest = substr($0, RLENGTH + 1)
          sub(/^[ \t]*=?[ \t]*/, "", rest)
          if (key == "match") exit
          if (!(key in value)) value[key] = rest
      }
      END { ... checks, in the README's order, then the summary line ... }
      ```
requirements:
  - kind: docker-engine
    name: Docker Desktop running
    why: Your kata is checked inside a container.
    install_hint: "install Docker Desktop (winget install Docker.DockerDesktop) and start it"
  - kind: docker-image
    name: dojo-linux runner image
    image: dojo-linux
    why: The Debian 13 container with bash, bats and shellcheck that runs the grading tests.
