id: ai-engineer.p1.checkpoint
kind: checkpoint
status: draft
title: "📋 Checkpoint 1: Fundamentals"
summary: "Prove the fundamentals: a quiz over tokens, model APIs, streaming, structured output and embeddings, and an integration kata, a semantic FAQ search that parses, chunks, embeds, indexes, deduplicates, budgets context and returns a JSON-ready answer."
objectives:
  - { id: o1, text: "Explain tokens, context windows, sampling, stop reasons, retryable errors, structured output and vector search in your own words", skills: [ai-engineer.llm-foundations, ai-engineer.model-apis, ai-engineer.structured-output, ai-engineer.embeddings-vector] }
  - { id: o2, text: "Build a small semantic search over a parsed FAQ with embeddings, metadata filters, a score threshold and a token budget", skills: [ai-engineer.embeddings-vector, ai-engineer.rag-architecture, ai-engineer.llm-foundations] }
  - { id: o3, text: "Parse a small text format with useful line-numbered errors", skills: [python.errors, python.collections] }
prerequisites: [ai-engineer.p1.chunk-index]
difficulty: 3
estimated_minutes: 90
xp: 300
closes_phase: p1
covers_skills: [ai-engineer.llm-foundations, ai-engineer.model-apis, ai-engineer.structured-output, ai-engineer.embeddings-vector]
lesson: lesson.md
quiz: quiz.yaml
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-python, timeout_secs: 60 }
  hints:
    - |-
      Build it in the order of the statement: `slugify`, then `parse_faq` (a loop over numbered lines with a "current entry" that you close when the next `## ` or the end arrives), then the index, then `search`, then the two answers. What does the index need to remember about each chunk so that `search` can return entries instead of chunks?
    - |-
      `enumerate(markdown.splitlines(), start=1)` gives line numbers. Keep the lines of the current entry and turn them into paragraphs at the end of the entry (blank lines separate them; `" ".join(line.split())` collapses spaces). In `FaqSearch`, index the question and each answer paragraph with metadata `{"entry": entry.id, "section": entry.section}` and skip texts whose vector is all zeros. In `search`, ask the index for every hit (`k=len(index)`), then keep the best score per entry in a dict.
    - |-
      ```python
      def search(self, query, k=3, min_score=0.5, section=None):
          vector = self._embed(query)
          if not any(vector) or len(self._index) == 0:
              return []
          where = {"section": section} if section is not None else None
          best: dict[str, float] = {}
          for hit in self._index.search(vector, k=len(self._index), where=where, min_score=min_score):
              entry_id = hit.metadata["entry"]
              best[entry_id] = max(best.get(entry_id, hit.score), hit.score)
          ranked = sorted(best.items(), key=lambda pair: (-pair[1], pair[0]))[:k]
          return [Match(entry_id, self._entries[entry_id].question, score) for entry_id, score in ranked]
      ```
requirements:
  - kind: docker-engine
    name: Docker Desktop running
    why: Your kata is checked inside a container.
    install_hint: "install Docker Desktop (winget install Docker.DockerDesktop) and start it"
  - kind: docker-image
    name: dojo-python runner image
    image: dojo-python
    why: The Python 3.15 container with pytest and ruff that runs the grading tests.
