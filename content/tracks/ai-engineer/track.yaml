schema_version: 2
id: ai-engineer
name: "AI Engineer"
archetype: role
category: "Careers & Roles"
icon: "🤖"
description: "Build products on top of language models: how LLMs work, calling model APIs, structured output, tool calling and agents, embeddings, RAG, evaluation, guardrails, cost, latency, observability and fine-tuning trade-offs. Katas in Python against a fake, offline model. Take Modern Python through Intermediate first; prompt-writing technique lives in the Prompt Engineering track."
status: reviewed
bridges_available: [java, python, javascript, csharp, go]
belts:
  - { name: "White Belt", required_xp: 0, title: "Token Counter" }
  - { name: "Yellow Belt", required_xp: 300, title: "API Integrator" }
  - { name: "Green Belt", required_xp: 800, title: "Retrieval Builder" }
  - { name: "Purple Belt", required_xp: 1500, title: "Agent Wrangler" }
  - { name: "Brown Belt", required_xp: 2500, title: "Evaluation Engineer" }
  - { name: "Black Belt", required_xp: 4000, title: "Production AI Engineer" }
  - { name: "Sensei", required_xp: 6000, title: "AI Systems Architect" }
phases:
  - { id: p0, dir: p0-first-steps, title: "First Steps", goal: "What the role does, how a model turns tokens into text, and a first context-budget kata" }
  - { id: p1, dir: p1-fundamentals, title: "Fundamentals", goal: "Model APIs, streaming, structured output, embeddings and vector search" }
  - { id: p2, dir: p2-intermediate, title: "Intermediate", goal: "RAG, tool calling and agents, and evaluation that catches regressions" }
  - { id: p3, dir: p3-advanced, title: "Advanced", goal: "Guardrails and safety, cost and latency, observability" }
  - { id: p4, dir: p4-mastery, title: "Mastery", goal: "Fine-tuning trade-offs, serving open models and owning AI features in production" }
requirements:
  - kind: tool
    name: uv
    command: uv
    version_args: ["--version"]
    min_version: "0.9"
    required: false
    why: Installs Python 3.15 and pytest to run the visible tests locally. The grading checks run in Docker and do not need it.
    install_hint: "install uv: winget install astral-sh.uv, then reopen the terminal"
  - kind: vscode-extension
    name: Python extension for VS Code
    id: ms-python.python
    required: false
    why: Shows errors as you type and runs and debugs the pytest tests from the Testing panel.
