id: ai-engineer.p2.rag-architecture
legacy_id: ai-03-rag-architecture
kind: lesson
status: draft
title: "RAG: Chunking, Retrieval, Reranking and Grounded Answers"
summary: "Retrieval-augmented generation end to end: ingestion and chunking strategies, query rewriting, hybrid retrieval and reranking, assembling a grounded prompt with citations, saying 'I don't know', and the failure modes to measure."
objectives:
  - { id: o1, text: "Describe the ingestion and query pipelines of a RAG system and the choices at each step", skills: [ai-engineer.rag-architecture] }
  - { id: o2, text: "Choose chunking, retrieval, reranking and context-assembly strategies for a corpus", skills: [ai-engineer.rag-architecture, ai-engineer.embeddings-vector] }
  - { id: o3, text: "Make answers grounded and verifiable with citations and an explicit 'not found' path", skills: [ai-engineer.rag-architecture, ai-engineer.structured-output] }
  - { id: o4, text: "Diagnose RAG failures as retrieval or generation problems and measure each", skills: [ai-engineer.rag-architecture, ai-engineer.evaluation] }
prerequisites: [ai-engineer.p1.checkpoint]
difficulty: 3
estimated_minutes: 55
xp: 250
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'An internal assistant answers employees'' HR questions from 400 policy documents (PDFs, some with tables, updated monthly, some visible only to managers). Users complain it sometimes cites an outdated policy and sometimes says "I could not find it" for things that are clearly documented. Describe your RAG pipeline end to end, and for each complaint name the likely causes and how you would measure and fix them.'
  criteria:
    - 'Describes ingestion (parsing PDFs and tables, chunking with metadata such as document, section, version date, audience) and re-indexing on updates, removing old versions'
    - 'Filters by permission (manager-only documents) at retrieval time, not in the prompt'
    - 'For outdated citations: stale chunks still indexed, missing date metadata or ranking that ignores recency'
    - 'For false "not found": chunking that splits answers, vocabulary mismatch (needs hybrid search or query rewriting), too small k or a threshold that is too strict'
    - 'Separates retrieval metrics (recall@k on labelled questions) from answer metrics (faithfulness, correctness)'
