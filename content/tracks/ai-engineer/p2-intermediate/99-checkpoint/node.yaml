id: ai-engineer.p2.checkpoint
kind: checkpoint
status: draft
title: "📋 Checkpoint 2: Intermediate"
summary: "Prove the intermediate phase: a quiz over RAG, tool calling, agents and evaluation, and an integration kata, an HR policy assistant with permission-filtered retrieval, a token-budgeted prompt, verified citations with one repair, a 'not found' path and recall@k."
objectives:
  - { id: o1, text: "Explain RAG design, tool calling and agent limits, and evaluation with golden sets and judges in your own words", skills: [ai-engineer.rag-architecture, ai-engineer.agents-tools, ai-engineer.evaluation] }
  - { id: o2, text: "Build a RAG answer path with access-controlled retrieval, a context budget, numbered sources and citations checked in code", skills: [ai-engineer.rag-architecture, ai-engineer.structured-output, ai-engineer.guardrails] }
  - { id: o3, text: "Measure retrieval with recall@k over a small golden set", skills: [ai-engineer.evaluation, ai-engineer.embeddings-vector] }
prerequisites: [ai-engineer.p2.eval-harness]
difficulty: 4
estimated_minutes: 100
xp: 400
closes_phase: p2
covers_skills: [ai-engineer.rag-architecture, ai-engineer.agents-tools, ai-engineer.evaluation]
lesson: lesson.md
quiz: quiz.yaml
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-python, timeout_secs: 60 }
  hints:
    - |-
      Work through the statement in order and test each step on its own: index, `retrieve`, `build_prompt`, `citations`, then `answer`. In `answer`, which outcomes must never reach the model at all, and which ones get exactly one more try?
    - |-
      For roles, search with `where={"audience": "all"}` unless the role is `"manager"`. In `build_prompt`, keep a list of source lines and add one passage at a time while `count_tokens` of the **whole** prompt stays within the budget. For citations, `re.findall(r"\[\s*(\d+(?:\s*,\s*\d+)*)\s*\]", text)` finds `[2]` and `[1, 3]`; split on commas and keep the first occurrence of each number. A citation is valid when `1 <= n <= len(used)`.
    - |-
      ```python
      def answer(self, question, role="employee", budget_tokens=200):
          prompt, used = self.build_prompt(question, self.retrieve(question, role), budget_tokens)
          if not used:
              return Answer("not_found", NOT_FOUND, (), ())
          messages = [Message("user", prompt)]
          for attempt in range(2):
              text = self._model.complete(Request(tuple(messages), system=SYSTEM)).text
              if NOT_FOUND in text:
                  return Answer("not_found", text, (), ())
              cited = citations(text)
              valid = [n for n in cited if 1 <= n <= len(used)]
              if cited and len(valid) == len(cited):
                  return Answer("answered", text, tuple(valid), self._sources(valid, used))
              if attempt == 0:
                  messages += [Message("assistant", text), Message("user", self._repair(cited, valid, used))]
          return Answer("unverified", text, tuple(valid), self._sources(valid, used))
      ```
requirements:
  - kind: docker-engine
    name: Docker Desktop running
    why: Your kata is checked inside a container.
    install_hint: "install Docker Desktop (winget install Docker.DockerDesktop) and start it"
  - kind: docker-image
    name: dojo-python runner image
    image: dojo-python
    why: The Python 3.15 container with pytest and ruff that runs the grading tests.
