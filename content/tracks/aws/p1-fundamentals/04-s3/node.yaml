id: aws.p1.s3
kind: lesson
status: draft
title: "S3: Buckets, Storage Classes, Encryption and Access"
summary: "Object storage: buckets and keys, consistency, versioning, storage classes and lifecycle rules, encryption (SSE-S3, SSE-KMS), Block Public Access, bucket policies, presigned URLs and event notifications."
objectives:
  - { id: o1, text: "Explain buckets, keys, prefixes, object size limits and S3's strong read-after-write consistency", skills: [aws.s3] }
  - { id: o2, text: "Choose storage classes and write lifecycle rules for a data set", skills: [aws.s3] }
  - { id: o3, text: "Protect data: Block Public Access, bucket policies, encryption, versioning and Object Lock", skills: [aws.s3] }
  - { id: o4, text: "Give temporary access with presigned URLs and react to uploads with event notifications", skills: [aws.s3] }
prerequisites: [aws.p1.ec2]
difficulty: 2
estimated_minutes: 40
xp: 150
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: "A photo-sharing app stores user uploads (read often for 30 days, rarely after), generated thumbnails (can be regenerated) and monthly audit exports that must be kept unchanged for 7 years. Users upload directly from the browser. Design the S3 side: buckets, storage classes and lifecycle rules, how uploads reach S3 without passing through your servers, who can read what, encryption, and how a thumbnail gets created after each upload."
  criteria:
    - "Uses presigned URLs (or presigned POST) generated by the backend so browsers upload straight to S3, with a short expiry and a fixed key and content type"
    - "Lifecycle: uploads in S3 Standard moving to Standard-IA or Intelligent-Tiering after 30 days; thumbnails in a cheaper class or with expiration; audit exports to Glacier Flexible Retrieval or Deep Archive"
    - "Keeps buckets private with Block Public Access on, serving images through CloudFront with origin access control or presigned GET URLs"
    - "Encrypts by default (SSE-S3 or SSE-KMS with a customer managed key and S3 Bucket Keys) and turns on versioning; uses Object Lock in compliance mode for the 7-year exports"
    - "Triggers thumbnail generation with an S3 event notification (to Lambda, SQS or EventBridge) on ObjectCreated, and avoids recursion by writing thumbnails to another bucket or prefix"
