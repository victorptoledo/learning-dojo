AWSTemplateFormatVersion: "2010-09-09"
Description: Three-tier network of the payments service, in three Availability Zones.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/16$'
    Description: The VPC's block, a /16 that no other network of the company uses.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
