AWSTemplateFormatVersion: "2010-09-09"
Description: Three-tier network of the payments service, in three Availability Zones.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/16$'
    Description: The VPC's block, a /16 that no other network of the company uses.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!GetAtt Vpc.CidrBlock, 9, 12]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: tier
          Value: public

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!GetAtt Vpc.CidrBlock, 9, 12]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: tier
          Value: public

  PublicSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!GetAtt Vpc.CidrBlock, 9, 12]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: tier
          Value: public

  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!GetAtt Vpc.CidrBlock, 9, 12]]
      Tags:
        - Key: tier
          Value: app

  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [4, !Cidr [!GetAtt Vpc.CidrBlock, 9, 12]]
      Tags:
        - Key: tier
          Value: app

  AppSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [5, !Cidr [!GetAtt Vpc.CidrBlock, 9, 12]]
      Tags:
        - Key: tier
          Value: app

  DataSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [6, !Cidr [!GetAtt Vpc.CidrBlock, 9, 12]]
      Tags:
        - Key: tier
          Value: data

  DataSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [7, !Cidr [!GetAtt Vpc.CidrBlock, 9, 12]]
      Tags:
        - Key: tier
          Value: data

  DataSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [8, !Cidr [!GetAtt Vpc.CidrBlock, 9, 12]]
      Tags:
        - Key: tier
          Value: data

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB, !Ref PublicSubnetC]]
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetIds"
  AppSubnetIds:
    Value: !Join [",", [!Ref AppSubnetA, !Ref AppSubnetB, !Ref AppSubnetC]]
    Export:
      Name: !Sub "${AWS::StackName}-AppSubnetIds"
  DataSubnetIds:
    Value: !Join [",", [!Ref DataSubnetA, !Ref DataSubnetB, !Ref DataSubnetC]]
    Export:
      Name: !Sub "${AWS::StackName}-DataSubnetIds"
