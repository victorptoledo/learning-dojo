schema_version: 2
id: aws
name: "AWS Cloud Architecture"
archetype: platform
category: "Infrastructure & Tools"
icon: "☁️"
description: "Amazon Web Services without an AWS bill: the shared responsibility model, IAM and least privilege, EC2, S3, VPC networking, CloudFormation and CDK, RDS and DynamoDB, Lambda and serverless, ECS and EKS, CloudWatch, multi-account guardrails, security services, high availability, cost and the Well-Architected Framework. Every kata is checked offline, with no account and no credentials."
status: reviewed
bridges_available: [java, python, javascript, csharp, go]
belts:
  - { name: "White Belt", required_xp: 0, title: "Console Clicker" }
  - { name: "Yellow Belt", required_xp: 300, title: "S3 & EC2 Deployer" }
  - { name: "Green Belt", required_xp: 800, title: "IAM Security Guardian" }
  - { name: "Purple Belt", required_xp: 1500, title: "VPC & Networking Builder" }
  - { name: "Brown Belt", required_xp: 2500, title: "Serverless & EventBridge Pro" }
  - { name: "Black Belt", required_xp: 4000, title: "AWS Solutions Architect" }
  - { name: "Sensei", required_xp: 6000, title: "Cloud Mastermind" }
phases:
  - { id: p0, dir: p0-first-steps, title: "First Steps", goal: "What the cloud is, the shared responsibility model, regions and accounts, and a first CloudFormation template" }
  - { id: p1, dir: p1-fundamentals, title: "Fundamentals", goal: "IAM and least privilege, EC2, S3, VPC networking and infrastructure as code with CloudFormation and CDK" }
  - { id: p2, dir: p2-intermediate, title: "Intermediate", goal: "RDS and DynamoDB, Lambda and serverless messaging, ECS and EKS, and CloudWatch observability" }
  - { id: p3, dir: p3-advanced, title: "Advanced", goal: "Multi-account IAM and guardrails, security services, high availability and disaster recovery, and cost" }
  - { id: p4, dir: p4-mastery, title: "Mastery", goal: "The Well-Architected Framework, observable stacks and running AWS in production" }
