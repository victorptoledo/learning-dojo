AWSTemplateFormatVersion: "2010-09-09"
Description: Orders worker with its alarms, error-log metric, on-call topic, budget and cost tags

Parameters:
  OnCallEmail:
    Type: String
    Description: Where alarms and budget alerts go
  MonthlyBudgetUsd:
    Type: Number
    Default: 200

Resources:
  # ---- the service, as it already runs ------------------------------------------------
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole"
      Tags:
        - { Key: service, Value: orders }
        - { Key: cost-center, Value: cc-1042 }

  OrdersDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - { Key: service, Value: orders }
        - { Key: cost-center, Value: cc-1042 }
  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrdersDeadLetterQueue.Arn
        maxReceiveCount: 5
      Tags:
        - { Key: service, Value: orders }
        - { Key: cost-center, Value: cc-1042 }

  WorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.14
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 10
      MemorySize: 256
      Role: !GetAtt WorkerRole.Arn
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref WorkerLogGroup
      Code:
        ZipFile: |
          import json
          def handler(event, context):
              for record in event["Records"]:
                  print(json.dumps({"level": "INFO", "message": "order", "body": record["body"]}))
              return {"batchItemFailures": []}
      Tags:
        - { Key: service, Value: orders }
        - { Key: cost-center, Value: cc-1042 }
  WorkerEvents:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref WorkerFunction
      EventSourceArn: !GetAtt OrdersQueue.Arn
      BatchSize: 10
      FunctionResponseTypes: [ReportBatchItemFailures]

  # ---- logs ---------------------------------------------------------------------------
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/orders-worker
      RetentionInDays: 30
      Tags:
        - { Key: service, Value: orders }
        - { Key: cost-center, Value: cc-1042 }
  ErrorLogsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogGroup
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
        - MetricNamespace: Acme/Orders
          MetricName: ErrorLogs
          MetricValue: "1"
          DefaultValue: 0

  # ---- on call ------------------------------------------------------------------------
  OnCallTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns
      Subscription:
        - { Protocol: email, Endpoint: !Ref OnCallEmail }
      Tags:
        - { Key: service, Value: orders }
        - { Key: cost-center, Value: cc-1042 }
  OnCallTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref OnCallTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: BudgetsPublishForThisAccount
            Effect: Allow
            Principal: { Service: budgets.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref OnCallTopic
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }

  # ---- alarms -------------------------------------------------------------------------
  ErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: More than 1 % of worker invocations fail
      ComparisonOperator: GreaterThanThreshold
      Threshold: 1
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OnCallTopic]
      OKActions: [!Ref OnCallTopic]
      Metrics:
        - Id: rate
          Expression: "100 * errors / MAX([errors, invocations])"
          Label: Error rate (%)
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions: [{ Name: FunctionName, Value: !Ref WorkerFunction }]
            Period: 60
            Stat: Sum
        - Id: invocations
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions: [{ Name: FunctionName, Value: !Ref WorkerFunction }]
            Period: 60
            Stat: Sum

  SlowWorkerAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: p99 duration above 5 seconds (half the timeout)
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{ Name: FunctionName, Value: !Ref WorkerFunction }]
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OnCallTopic]

  QueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The oldest order has waited more than 5 minutes
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{ Name: QueueName, Value: !GetAtt OrdersQueue.QueueName }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OnCallTopic]

  DeadLettersAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Orders reached the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt OrdersDeadLetterQueue.QueueName }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OnCallTopic]

  ErrorLogsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The worker logs errors
      Namespace: Acme/Orders
      MetricName: ErrorLogs
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OnCallTopic]

  # ---- cost ---------------------------------------------------------------------------
  OrdersBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: orders-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
        CostFilters:
          TagKeyValue: ["user:service$orders"]
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: SNS, Address: !Ref OnCallTopic }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: SNS, Address: !Ref OnCallTopic }

Outputs:
  WorkerFunctionName:
    Value: !Ref WorkerFunction
  OnCallTopicArn:
    Value: !Ref OnCallTopic
