id: data-engineer.p1.dimensional-modelling
kind: lesson
status: draft
title: "Dimensional Modelling: Star Schemas, Grain, Facts and Dimensions"
summary: "Kimball's method for analytical models: declare the grain, choose facts and dimensions, use surrogate keys and a date dimension, and know when a snowflake, a wide table or a factless fact fits."
objectives:
  - { id: o1, text: "Design a star schema by declaring the grain, then the dimensions and the facts", skills: [data-engineer.dimensional-modelling] }
  - { id: o2, text: "Use surrogate keys, a date dimension and degenerate dimensions correctly", skills: [data-engineer.dimensional-modelling, sql.constraints-keys] }
  - { id: o3, text: "Tell additive, semi-additive and non-additive measures apart and aggregate them correctly", skills: [data-engineer.dimensional-modelling, sql.aggregation] }
prerequisites: [data-engineer.p1.etl-vs-elt]
difficulty: 2
estimated_minutes: 45
xp: 200
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'A gym chain wants to analyse member check-ins (member, club, time of day) and monthly membership payments (member, plan, amount, discount). Design the star schema or schemas: state the grain of each fact table, list its dimensions and measures, and say which measures can be summed across which dimensions.'
  criteria:
    - 'States one grain per fact table in a sentence (for example one row per check-in)'
    - 'Separates check-ins and payments into two fact tables with different grains'
    - 'Lists dimensions with surrogate keys and a date (and time) dimension'
    - 'Classifies measures: counts and amounts additive, a balance or a rate not'
    - 'Shows a shared (conformed) member dimension used by both facts'
