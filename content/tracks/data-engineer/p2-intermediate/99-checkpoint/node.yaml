  runner: { image: dojo-python, timeout_secs: 90 }
  hints:
    - |-
      Start with `DAG`: keep the tasks in a dict, check names and upstreams, then compute the order once. Which classic algorithm repeatedly takes a task whose upstream tasks are all done, and how do you know a cycle is left when it stops early? Which data structure always gives you the alphabetically first ready task?
    - |-
      Kahn's algorithm: count the unfinished upstream tasks of each task, put the tasks with zero in a `heapq`, pop one, decrement its children, push those that reach zero. If fewer tasks came out than went in, there is a cycle. In `run`, check upstream statuses first, then `state.is_done`, then try `retries + 1` times, catching `QualityGateFailed` separately before `Exception`. In `pipeline.py`, each task writes one key of the warehouse (`warehouse.fact_orders[ctx.ds] = ...`), which makes it idempotent.
    - |-
      ```python
      def run(dag, ds, state):
          statuses = {}
          for name in dag.order():
              task = dag.tasks[name]
              if any(statuses[up] not in ("success", "already_done") for up in task.upstream):
                  statuses[name] = "upstream_failed"
              elif state.is_done(name, ds):
                  statuses[name] = "already_done"
              else:
                  statuses[name] = attempt(task, ds)  # loop over attempts 1 .. retries + 1
                  if statuses[name] == "success":
                      state.mark_done(name, ds)
          return statuses
      ```
