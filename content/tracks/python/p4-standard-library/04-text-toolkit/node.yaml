id: python.p4.text-toolkit
kind: kata
status: draft
title: "Text Toolkit: Keys, Slugs, Highlights and Durations"
summary: "Four everyday text helpers: a search key with NFKC and casefold, an ASCII slug that never splits a word, a literal, whole-word, longest-first highlighter in one regex pass, and a duration parser with a verbose pattern that fails fast."
objectives:
  - { id: o1, text: "Normalise text with NFKC and NFKD, casefold it and strip combining marks", skills: [python.text-regex] }
  - { id: o2, text: "Build one safe pattern from user terms with re.escape, lookarounds and longest-first alternation, and parse a format with a verbose fullmatch", skills: [python.text-regex] }
  - { id: o3, text: "Keep regexes linear on hostile input and choose ASCII or Unicode classes on purpose", skills: [python.text-regex, python.performance] }
prerequisites: [python.p4.dates-times]
difficulty: 3
estimated_minutes: 60
xp: 300
lesson: lesson.md
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-python, timeout_secs: 60 }
  hints:
    - |-
      Start with `search_key`: which normalisation form folds full-width letters and ligatures, and which method (not `lower`) turns `ß` into `ss`? For `slugify`, decompose first so the accents become separate characters you can drop. For `highlight`, build **one** pattern out of all the terms; what must happen to each term before it goes into the pattern, and in which order should the alternatives come?
    - |-
      `search_key`: `" ".join(unicodedata.normalize("NFKC", text).casefold().split())`. `slugify`: NFKD, drop characters whose `unicodedata.category` is `"Mn"`, `casefold()`, then `re.sub(r"[^a-z0-9]+", "-", ...)` and `strip("-")`. `highlight`: sort the unique terms by length, longest first, `re.escape` each one, join with `|`, and wrap in `(?<!\w)(?:...)(?!\w)` with `re.IGNORECASE`; replace with a function. `parse_duration`: four optional groups `(?:(?P<days>\d+)\s*d\s*)?` and so on, under `re.VERBOSE | re.IGNORECASE | re.ASCII`, checked with `fullmatch`.
    - |-
      ```python
      def slugify(title, *, max_length=60):
          if max_length < 1:
              raise ValueError("max_length must be at least 1")
          decomposed = unicodedata.normalize("NFKD", title)
          plain = "".join(c for c in decomposed if unicodedata.category(c) != "Mn")
          slug = re.sub(r"[^a-z0-9]+", "-", plain.casefold()).strip("-")
          if not slug:
              raise ValueError(f"nothing to slugify in {title!r}")
          if len(slug) > max_length:
              cut = slug[:max_length]
              if slug[max_length] != "-" and "-" in cut:
                  cut = cut[: cut.rindex("-")]   # do not split the last word
              slug = cut.rstrip("-")
          return slug


      def parse_duration(text):
          match = DURATION.fullmatch(text)
          if match is None or not any(match.groupdict().values()):
              raise ValueError(f"not a duration: {text!r}")
          return timedelta(**{unit: int(v) for unit, v in match.groupdict().items() if v})
      ```
