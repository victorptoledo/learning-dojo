questions:
  - id: default-encoding
    prompt: "On Python 3.14, `open('names.txt').read()` works on a Linux server but raises UnicodeDecodeError on a Windows laptop. Why?"
    options:
      - "Windows files are always UTF-16"
      - "Without encoding=, Python 3.14 uses the locale's encoding, which is often cp1252 on Windows"
      - "Windows cannot open text files in Python"
    answer: 1
    explanation: "Before UTF-8 mode became the default in 3.15, the default came from the locale; naming the encoding makes the program behave the same everywhere and on every version."
  - id: bom
    prompt: "A CSV saved by Excel gives DictReader a first column called '\\ufeffid'. Which encoding removes that character?"
    answers: ["utf-8-sig", "utf_8_sig"]
    explanation: "utf-8-sig skips a leading byte order mark and otherwise reads plain UTF-8."
  - id: csv-newline
    prompt: "Which open() argument does the csv module ask for, so that newlines inside quoted fields and \\r\\n endings are handled correctly?"
    answers: ["newline=\"\"", "newline=''", "newline"]
    explanation: "newline=\"\" turns off newline translation and lets the csv module handle line endings itself."
  - id: stream
    prompt: "Which code processes a 10 GB log file without loading it into memory?"
    options:
      - "for line in path.read_text(encoding=\"utf-8\").splitlines(): ..."
      - "with path.open(encoding=\"utf-8\") as f:\n    for line in f: ..."
      - "lines = path.open(encoding=\"utf-8\").readlines()"
    answer: 1
    explanation: "A file object yields one line at a time; read_text and readlines build the whole content first."
  - id: atomic
    prompt: "Why write a report to a temp file in the same folder and then call os.replace?"
    options:
      - "It is faster than writing the file directly"
      - "Readers see either the old file or the complete new one, never half a file, because the rename is atomic on one file system"
      - "os.replace compresses the file"
    answer: 1
    explanation: "A rename within one file system is atomic; a temp file in another folder (another file system) would turn the rename into a copy."
  - id: json-decimal
    prompt: "What does `json.dumps({\"total\": Decimal(\"9.90\")})` do?"
    options:
      - "Returns '{\"total\": 9.90}'"
      - "Raises TypeError: Decimal is not JSON serializable"
      - "Returns '{\"total\": \"9.90\"}'"
    answer: 1
    explanation: "json only knows dict, list, str, int, float, bool and None; convert (str(amount)) or pass default=."
