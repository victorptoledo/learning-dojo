questions:
  - id: bom-header
    skills: [python.files-io]
    prompt: "A CSV exported from Excel makes `row[\"id\"]` raise KeyError, although the file clearly has an id column first. What is the likely cause and fix?"
    options:
      - "The file is UTF-16: open it with encoding=\"utf-16\""
      - "A BOM is glued to the first header, \"\\ufeffid\": open it with encoding=\"utf-8-sig\""
      - "DictReader lower-cases headers: use row[\"ID\"]"
    answer: 1
    explanation: "utf-8-sig drops a leading byte order mark, so the first column is called id again."
  - id: atomic-same-dir
    skills: [python.files-io]
    prompt: "Why must the temporary file for an atomic write be created in the target's folder, not in /tmp?"
    options:
      - "/tmp is cleared at every boot"
      - "os.replace is only atomic within one file system; across file systems it fails or becomes a copy that readers can see half done"
      - "Python cannot write to /tmp"
    answer: 1
    explanation: "A rename is atomic on one file system; /tmp is often a different one (tmpfs), so the move would not be a rename."
  - id: oserror
    skills: [python.files-io, python.errors]
    prompt: "Which exception is the common base class of FileNotFoundError, PermissionError and IsADirectoryError?"
    answers: ["OSError", "IOError"]
    explanation: "They are OSError subclasses (IOError is an alias); catch the specific one you can act on."
  - id: fullmatch-time
    skills: [python.text-regex]
    prompt: "Which check accepts \"09:30\" but rejects \"9:30\", \"09:30pm\" and \"24:00\"?"
    options:
      - "re.match(r\"\\d\\d:\\d\\d\", s)"
      - "re.fullmatch(r\"([01]\\d|2[0-3]):[0-5]\\d\", s, re.ASCII)"
      - "re.search(r\"([01]\\d|2[0-3]):[0-5]\\d\", s)"
    answer: 1
    explanation: "fullmatch anchors both ends, the alternation limits hours to 00-23, and re.ASCII keeps \\d to 0-9."
  - id: nfkc-key
    skills: [python.text-regex]
    prompt: "Which expression makes \"ﬁnance\" (with the ﬁ ligature) and \"FINANCE\" give the same key?"
    options:
      - "s.lower()"
      - "unicodedata.normalize(\"NFC\", s).casefold()"
      - "unicodedata.normalize(\"NFKC\", s).casefold()"
    answer: 2
    explanation: "NFC keeps the ligature; NFKC folds compatibility characters such as ligatures and full-width letters, and casefold handles case."
  - id: gap
    skills: [python.datetime]
    prompt: "In Lisbon the clocks jump from 01:00 to 02:00 on 2026-03-29. What does `datetime(2026, 3, 29, 1, 30, tzinfo=ZoneInfo(\"Europe/Lisbon\"))` do?"
    options:
      - "Raises ValueError: the time does not exist"
      - "Creates a datetime for a wall time that never happened; converting it to UTC and back gives 02:30"
      - "Silently becomes 02:30"
    answer: 1
    explanation: "Python never raises for gaps or folds; the value is created, and you detect the problem with fold and a round trip through UTC."
  - id: elapsed
    skills: [python.datetime]
    prompt: "A shift starts at 00:30 Lisbon time on the night the clocks go forward and lasts 2 hours. How do you compute its end instant?"
    options:
      - "local_start + timedelta(hours=2), then convert to UTC"
      - "local_start.astimezone(UTC) + timedelta(hours=2)"
      - "Either; they give the same result"
    answer: 1
    explanation: "Adding to an aware local datetime adds wall time (giving 02:30 local, only 1 real hour later); adding in UTC adds real elapsed time."
  - id: iso-year
    skills: [python.datetime]
    prompt: "A weekly report groups by `(d.year, d.isocalendar().week)`. What goes wrong on 2027-01-01?"
    options:
      - "Nothing"
      - "It lands in (2027, 53), a week that does not exist, instead of (2026, 53)"
      - "isocalendar raises for January dates"
    answer: 1
    explanation: "Week 53 belongs to ISO year 2026; always pair the week with isocalendar().year."
