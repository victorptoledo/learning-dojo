  runner: { image: dojo-python, timeout_secs: 60 }
  hints:
    - |-
      Build it bottom up: `Grade` and its validation, then `parse_line`, then the `Gradebook` storage, and only then the reports. How should the book store grades so that a second grade for the same student and course replaces the first one?
    - |-
      A dict keyed by the tuple `(student, course)` gives replacement for free and keeps insertion order. `parse_line` splits on `,`, strips each part, and converts the score with `int(...)` inside `try`, re-raising `ValueError` with the line. Averages: group the scores per student with `defaultdict(list)`. Rankings sort by `(-average, name)`. `letter` is a chain of comparisons from the top.
    - |-
      ```python
      class Gradebook:
          def __init__(self, grades: Iterable[Grade] = ()) -> None:
              self._grades: dict[tuple[str, str], Grade] = {}
              self.rejected: list[int] = []
              for grade in grades:
                  self.add(grade)

          def add(self, grade: Grade) -> None:
              self._grades[(grade.student, grade.course)] = grade

          @classmethod
          def from_lines(cls, lines: Iterable[str]) -> "Gradebook":
              book = cls()
              for number, line in enumerate(lines, start=1):
                  text = line.strip()
                  if not text or text.startswith("#"):
                      continue
                  # parse_line, add, or record the number in book.rejected
              return book

          def _scores_by_student(self) -> dict[str, list[int]]:
              ...
      ```
