id: python.p4.typed-services
kind: lesson
status: draft
title: "Typed Web Services with FastAPI and Pydantic"
summary: "WSGI and ASGI, FastAPI path operations driven by type hints, request and response models, dependency injection, async and sync endpoints, errors, settings, database sessions, lifespan, and testing with TestClient."
objectives:
  - { id: o1, text: "Explain WSGI versus ASGI and how FastAPI uses type hints and Pydantic to validate input, serialise output and generate OpenAPI", skills: [python.services, python.modern-typing-pydantic] }
  - { id: o2, text: "Structure an API with routers, Depends for sessions and authentication, response models, error handlers and pydantic-settings", skills: [python.services] }
  - { id: o3, text: "Choose async or sync endpoints correctly, manage resources with lifespan, and test the API with TestClient and dependency overrides", skills: [python.services, python.asyncio-gil, python.testing] }
prerequisites: [python.p4.cpython-internals]
difficulty: 4
estimated_minutes: 60
xp: 300
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Design the FastAPI endpoints for `POST /orders` (create an order for the authenticated customer) and `GET /orders/{order_id}`. Show the Pydantic models for input and output (the output must never contain the internal cost price), the dependencies (database session, current user), how a missing order and a validation error are reported, whether the endpoints are async or sync and why, and one test that uses a dependency override.'
  criteria:
    - 'Separate input and output models (OrderIn, OrderOut) with response_model or a return annotation, so internal fields are not exposed'
    - 'Depends for the session (a yield dependency that closes it) and for the current user (from a token), reused by both endpoints'
    - 'Returns 201 on creation, raises HTTPException(404) for a missing order, and relies on FastAPI''s automatic 422 for invalid bodies'
    - 'Uses async def with async database and HTTP clients, or def (run in a thread pool) with blocking libraries, and explains the risk of blocking calls in async def'
    - 'A test with TestClient and app.dependency_overrides replacing the user or the session'
