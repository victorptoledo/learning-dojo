id: python.p2.decorators-context
legacy_id: py-04-decorators-context
kind: lesson
status: draft
title: "Decorators and Context Managers"
summary: "Decorators as functions that wrap functions, functools.wraps, decorators with arguments, typing them with ParamSpec, caching, and context managers with __enter__ and __exit__, contextmanager and ExitStack."
objectives:
  - { id: o1, text: "Write decorators with functools.wraps, with and without arguments, and explain the order of stacked decorators", skills: [python.decorators-context] }
  - { id: o2, text: "Type decorators with ParamSpec and use functools.cache and lru_cache correctly", skills: [python.decorators-context, python.modern-typing-pydantic] }
  - { id: o3, text: "Write context managers as classes and with contextlib.contextmanager, and manage several resources with ExitStack", skills: [python.decorators-context] }
prerequisites: [python.p2.log-pipeline]
difficulty: 3
estimated_minutes: 55
xp: 200
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Write a decorator `@log_calls(level=logging.INFO)` that logs each call of a function with its arguments and how long it took, and logs (then re-raises) any exception. Then write a context manager `transaction(conn)` that commits when the block succeeds and rolls back when it raises. Explain every layer of the decorator, why functools.wraps matters, and what __exit__ (or the generator version) does with an exception.'
  criteria:
    - 'The decorator factory has three levels (arguments, function, wrapper), the wrapper takes *args and **kwargs and returns the result'
    - 'Uses functools.wraps and explains that it keeps __name__, __doc__ and __wrapped__ for logs, debuggers and tests'
    - 'Times with time.perf_counter and re-raises exceptions after logging them (bare raise)'
    - 'The context manager commits on success and rolls back on exception, with try/except/else or __exit__, and does not suppress the exception'
    - 'Mentions typing the decorator with ParamSpec or that order matters when stacking'
