id: python.p3.checkpoint
kind: checkpoint
status: draft
title: "📋 Checkpoint 3: Advanced"
summary: "Prove the advanced phase: a quiz on asyncio and the GIL, protocols and special methods, and performance, and a basket quote that asks several price sources in bounded, timed batches and sums a Money type built from special methods."
objectives:
  - { id: o1, text: "Explain the GIL, asyncio tasks and cancellation, Protocols versus ABCs, special methods and profiling in your own words", skills: [python.asyncio-gil, python.protocols, python.performance] }
  - { id: o2, text: "Build a value type with operators and formatting, and an async fan-out with batches, a concurrency limit, timeouts and partial failure that stays fast on large inputs", skills: [python.asyncio-gil, python.protocols, python.performance, python.classes] }
prerequisites: [python.p3.performance-profiling]
difficulty: 4
estimated_minutes: 90
xp: 400
closes_phase: p3
covers_skills: [python.asyncio-gil, python.protocols, python.performance]
lesson: lesson.md
quiz: quiz.yaml
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-python, timeout_secs: 90 }
  hints:
    - |-
      Do `Money` first; the tests for it need no asyncio. Which method does Python call for `0 + money`, the first step of `sum()`? What should `__add__` return for an `int`, so that Python goes on to try the other operand? Then `quote()`: write one inner coroutine that asks **one** source for **one** batch and never raises an `Exception`, and decide where the `Semaphore` goes so that the timeout only measures the call.
    - |-
      `__radd__` returns `self` for the int `0` and `NotImplemented` otherwise; `__rmul__ = __mul__`. `__format__` turns the cents into `Decimal(cents).scaleb(-2)`, formats it with `spec or ".2f"` and adds the currency. In `quote()`: `skus = sorted(basket)`, batches by slicing, then `async with semaphore:` around `try: async with asyncio.timeout(timeout): ...` with `except Exception` (a `TimeoutError` is one; a `CancelledError` is not). Start one task per (source, batch) in a `TaskGroup`, and keep the source's index so a tie goes to the first source.
    - |-
      ```python
      async def ask(source, chunk):
          async with semaphore:
              try:
                  async with asyncio.timeout(timeout):
                      answer = await source.prices(chunk)
              except Exception:
                  failed.add(source.name)
                  return {}
          wanted = set(chunk)
          return {sku: price for sku, price in answer.items()
                  if sku in wanted and price.currency == currency}

      async with asyncio.TaskGroup() as group:
          tasks = [(index, group.create_task(ask(source, chunk)))
                   for index, source in enumerate(sources) for chunk in chunks]

      best = {}  # sku -> (price, index); a tuple compares the price first, then the index
      for index, task in tasks:
          for sku, price in task.result().items():
              ...
      ```
