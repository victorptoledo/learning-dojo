questions:
  - id: threads-cpu
    skills: [python.asyncio-gil]
    prompt: "On the standard (GIL) build, four threads each run a pure-Python loop that hashes numbers. Compared with one thread, the total time is about:"
    options:
      - "A quarter: the threads run on four cores"
      - "The same or a little worse: only one thread runs Python bytecode at a time"
      - "Four times longer: each thread waits for the others to finish"
    answer: 1
    explanation: "The GIL lets one thread run bytecode at a time, so CPU-bound Python code needs processes, native code that releases the GIL, or the free-threaded build."
  - id: taskgroup-failure
    skills: [python.asyncio-gil, python.errors]
    prompt: "Inside `async with asyncio.TaskGroup() as tg:`, one of five tasks raises ValueError while the others are still running. What happens?"
    options:
      - "The other four keep running and the ValueError is returned as a result"
      - "The other four are cancelled, and the block raises an ExceptionGroup containing the ValueError"
      - "The ValueError is printed and ignored"
    answer: 1
    explanation: "A TaskGroup is all or nothing: the first failure cancels the rest, and the failures come out together as an ExceptionGroup (catch it with except*)."
  - id: cancelled-error
    skills: [python.asyncio-gil]
    prompt: "Why is `except BaseException: return None` around an awaited call a bug in asyncio code?"
    options:
      - "It also catches CancelledError, so the task ignores being cancelled"
      - "BaseException cannot be caught in a coroutine"
      - "It makes the call run twice"
    answer: 0
    explanation: "CancelledError derives from BaseException so that `except Exception` does not catch it; swallowing it breaks timeouts, TaskGroups and shutdown."
  - id: semaphore-timeout
    skills: [python.asyncio-gil]
    prompt: "Each call should get 2 seconds, but at most 10 may run at once. Which nesting is right?"
    options:
      - "`async with asyncio.timeout(2):` outside, `async with semaphore:` inside"
      - "`async with semaphore:` outside, `async with asyncio.timeout(2):` inside"
      - "Either order behaves the same"
    answer: 1
    explanation: "With the timeout outside, the time spent waiting for a free slot counts too, and calls far back in the queue time out before they start."
  - id: radd-sum
    skills: [python.protocols]
    prompt: "`sum([Money(1), Money(2)])` raises TypeError although `Money(1) + Money(2)` works. Which method is missing?"
    answers: ["__radd__", "radd", "Money.__radd__"]
    explanation: "sum starts from 0, so the first step is `0 + Money(1)`: int.__add__ returns NotImplemented and Python calls Money.__radd__(0)."
  - id: notimplemented
    skills: [python.protocols]
    prompt: "In `__eq__` or `__add__`, what should you do when the other operand has a type you do not support?"
    options:
      - "Raise TypeError at once"
      - "Return NotImplemented, so Python can try the reflected method of the other operand"
      - "Return False"
    answer: 1
    explanation: "NotImplemented lets the other type answer; only when both refuse does Python raise TypeError (or, for ==, fall back to identity)."
  - id: protocol-vs-abc
    skills: [python.protocols]
    prompt: "Your function needs \"anything with an async `prices(skus)` method\", including classes from a library you cannot change. What fits best?"
    options:
      - "An ABC with an abstract `prices`, which every source must inherit"
      - "A `typing.Protocol` with `prices`: classes match by their shape, without inheriting"
      - "A check with hasattr inside the function"
    answer: 1
    explanation: "A Protocol is structural: the type checker accepts any class with the right methods. An ABC is nominal and needs inheritance or register()."
  - id: profile-quadratic
    skills: [python.performance, python.collections]
    prompt: "A profile shows most of the time in `if sku in seen:` inside a loop over 50,000 rows, where `seen` is a list. What is the fix?"
    options:
      - "Make `seen` a set, so each check is O(1) on average"
      - "Sort `seen` before the loop"
      - "Run the loop in four threads"
    answer: 0
    explanation: "Membership in a list scans it, so the loop is O(n²); a set (or dict) turns it into O(n). Threads do not help pure-Python CPU work on the GIL build."
