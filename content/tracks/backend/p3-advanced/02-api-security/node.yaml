id: backend.p3.api-security
kind: lesson
status: draft
title: "API Security: The OWASP API Top 10"
summary: "Broken object-level authorization, injection, mass assignment, resource abuse, SSRF and how to stop them."
objectives:
  - { id: o1, text: "Recognise and prevent the OWASP API Security Top 10 risks", skills: [backend.api-security] }
  - { id: o2, text: "Validate input, parameterise queries and limit resource use", skills: [backend.api-security] }
  - { id: o3, text: "Handle secrets, CORS and TLS correctly", skills: [backend.api-security] }
prerequisites: [backend.p3.scalability]
difficulty: 4
estimated_minutes: 45
xp: 350
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Review this endpoint in your head: PUT /users/{id} binds the JSON body onto the User entity and saves it. List the security problems you see and how you would fix each.'
  criteria:
    - 'Identifies BOLA (no check that the caller owns the user)'
    - 'Identifies mass assignment (role, id, password fields)'
    - 'Proposes input records and an ownership check'
    - 'Mentions validation, rate limits or not returning the entity'
