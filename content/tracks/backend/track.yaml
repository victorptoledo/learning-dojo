schema_version: 2
id: backend
name: "Backend Developer"
archetype: role
category: "Careers & Roles"
icon: "⚙️"
description: "The backend role from the ground up: HTTP, API design, SQL, authentication, caching, messaging, reliability, security, scale and architecture, practised in Java and Spring Boot. Take the Modern Java and Spring Boot tracks first."
status: draft
bridges_available: [java, python, javascript, csharp, go]
belts:
  - { name: "White Belt", required_xp: 0, title: "CRUD Developer" }
  - { name: "Yellow Belt", required_xp: 300, title: "API Craftsman" }
  - { name: "Green Belt", required_xp: 800, title: "Database Tuner" }
  - { name: "Purple Belt", required_xp: 1500, title: "Reliability Guardian" }
  - { name: "Brown Belt", required_xp: 2500, title: "High Concurrency Specialist" }
  - { name: "Black Belt", required_xp: 4000, title: "Principal Backend Engineer" }
  - { name: "Sensei", required_xp: 6600, title: "Backend Grandmaster" }
phases:
  - { id: p0, dir: p0-first-steps, title: "First Steps", goal: "What the role does, the life of a request and a first HTTP kata" }
  - { id: p1, dir: p1-fundamentals, title: "Fundamentals", goal: "HTTP, API design, SQL modelling and authentication" }
  - { id: p2, dir: p2-intermediate, title: "Intermediate", goal: "Transactions, caching, messaging and reliable APIs" }
  - { id: p3, dir: p3-advanced, title: "Advanced", goal: "Scalability, API security, resilience and SRE" }
  - { id: p4, dir: p4-mastery, title: "Mastery", goal: "System architecture, delivery and engineering leadership" }
requirements:
  - kind: tool
    name: JDK 25 (java)
    command: java
    version_args: ["--version"]
    min_version: "25"
    required: false
    why: Runs the katas and their visible tests in VS Code. The grading checks run in Docker and do not need it.
    install_hint: "install Temurin 25: winget install EclipseAdoptium.Temurin.25.JDK, then reopen the terminal"
  - kind: vscode-extension
    name: Extension Pack for Java
    id: vscjava.vscode-java-pack
    required: false
    why: Shows errors as you type and adds the Run Test and Debug buttons to JUnit tests.
