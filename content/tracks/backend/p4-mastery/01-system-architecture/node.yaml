id: backend.p4.system-architecture
kind: lesson
status: draft
title: "System Architecture"
summary: "Monoliths, modular monoliths and microservices, bounded contexts, events, sagas and their trade-offs."
objectives:
  - { id: o1, text: "Choose a deployment architecture for a team and a domain", skills: [backend.architecture] }
  - { id: o2, text: "Draw bounded contexts and integrate them with events", skills: [backend.architecture] }
  - { id: o3, text: "Coordinate a distributed workflow with a saga", skills: [backend.architecture] }
prerequisites: [backend.p3.checkpoint]
difficulty: 5
estimated_minutes: 45
xp: 400
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Your company is splitting a monolith. Describe how you would choose the first service to extract, how it would communicate with the rest, and how you would handle a business transaction that spans both.'
  criteria:
    - 'Uses bounded contexts and ownership of data to pick the boundary'
    - 'Justifies the extraction with deployment, scaling or isolation needs'
    - 'Chooses synchronous or asynchronous communication with reasons'
    - 'Handles the cross-service transaction with a saga and compensations'
