  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-java, timeout_secs: 180 }
  hints:
    - |-
      Three parts, three guarantees: the order and its event commit together (atomicity), events leave in the order they were written and a failure never lets a later one overtake (ordering), and processing an event twice has no extra effect (idempotency). For each part, which database feature gives that guarantee?
    - |-
      `place`: `@Transactional`, save the order, save the outbox event with the formatted payload, then check for `blocked`: the exception rolls back both. Relay: load pending events ordered by id, and on the first `RuntimeException` call `event.failed()` and return (the change to the managed event is saved at commit). Consumer: inside `transaction.execute(...)` do `processed.saveAndFlush(new ProcessedEvent(eventId))` then save the shipment; catch `DataIntegrityViolationException` outside it and return false.
    - |-
      ```java
      @Transactional
      public RelayResult publishPending(int batchSize) {
          int published = 0;
          for (OutboxEvent event : outbox.pending(PageRequest.of(0, batchSize))) {
              try {
                  broker.publish(event.getEventId(), event.getType(), event.getPayload());
              } catch (RuntimeException e) {
                  event.failed();
                  return new RelayResult(published, true);
              }
              event.published(clock.instant());
              published++;
          }
          return new RelayResult(published, false);
      }

      public boolean on(String eventId, String type, String payload) {
          long orderId = /* read "orderId" from the payload */;
          try {
              return Boolean.TRUE.equals(transaction.execute(status -> {
                  processed.saveAndFlush(new ProcessedEvent(eventId));
                  shipments.save(new Shipment(orderId));
                  return true;
              }));
          } catch (DataIntegrityViolationException duplicate) {
              return false;
          }
      }
      ```
