title: "Caching and Queues"
summary: "Cache-aside, expiry and invalidation, stampedes, and moving slow work to a queue."
objectives:
  - { id: o1, text: "Apply cache-aside, write-through and expiry, and plan invalidation", skills: [backend.caching-queues] }
  - { id: o2, text: "Protect a cache from stampedes and stale data", skills: [backend.caching-queues] }
  - { id: o3, text: "Move slow work to a queue and answer 202 Accepted", skills: [backend.caching-queues] }
