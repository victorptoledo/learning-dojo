id: backend.p2.messaging-reliability
kind: lesson
status: draft
title: "Messaging You Can Trust"
summary: "Delivery guarantees, idempotent consumers, the transactional outbox, retries, dead letters and ordering."
objectives:
  - { id: o1, text: "Explain at-most-once, at-least-once and effectively-once delivery", skills: [backend.messaging] }
  - { id: o2, text: "Publish reliably with a transactional outbox", skills: [backend.messaging] }
  - { id: o3, text: "Consume idempotently, retry and dead-letter safely", skills: [backend.messaging, backend.reliability] }
prerequisites: [backend.p2.rate-limiter]
difficulty: 3
estimated_minutes: 40
xp: 300
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'An order service must notify shipping when an order is placed, and no order may ever be shipped twice or forgotten. Describe the end-to-end design: how the event is published and how it is consumed.'
  criteria:
    - 'Uses a transactional outbox (or CDC) to avoid the dual write'
    - 'Assumes at-least-once delivery'
    - 'Makes the consumer idempotent with processed event ids'
    - 'Covers retries and a dead-letter queue'
