id: backend.p1.sql-modeling
kind: lesson
status: draft
title: "Relational Modelling, SQL and Indexes"
summary: "Tables, keys and constraints, joins and aggregates, and the indexes that make queries fast."
objectives:
  - { id: o1, text: "Model entities and relationships with keys and constraints", skills: [backend.sql] }
  - { id: o2, text: "Write joins, aggregates and subqueries", skills: [backend.sql] }
  - { id: o3, text: "Choose indexes and read a query plan", skills: [backend.sql] }
prerequisites: [backend.p1.api-design]
difficulty: 2
estimated_minutes: 45
xp: 250
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Model a library (books, authors, members, loans) as tables with keys and constraints, and name the indexes you would add for the two queries you expect to be most frequent.'
  criteria:
    - 'Tables with primary and foreign keys and sensible constraints'
    - 'Handles the many-to-many between books and authors'
    - 'Indexes match the stated queries, including column order'
    - 'Explains one constraint that protects against a race or bad data'
