id: backend.p1.auth-security
legacy_id: be-02-auth-security
kind: lesson
status: draft
title: "Authentication: Sessions, JWT, OAuth2 and OIDC"
summary: "Who is calling and what may they do: passwords, sessions, signed tokens, OAuth2 flows and roles."
objectives:
  - { id: o1, text: "Store passwords safely and choose between sessions and tokens", skills: [backend.auth-security] }
  - { id: o2, text: "Explain how a JWT is built, signed and verified, and what it must not contain", skills: [backend.auth-security] }
  - { id: o3, text: "Describe the OAuth2 authorization code flow with PKCE and OIDC", skills: [backend.auth-security] }
prerequisites: [backend.p1.url-shortener]
difficulty: 3
estimated_minutes: 45
xp: 250
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'A mobile app and a web app share one backend. Explain how users log in and how each request is authenticated, choosing between sessions, JWTs and OAuth2 flows, and justify the choice.'
  criteria:
    - 'Chooses an appropriate OAuth2 flow (authorization code with PKCE) or justified alternative'
    - 'Explains token lifetimes and refresh'
    - 'Explains how the API verifies tokens (signature, expiry, issuer, audience)'
    - 'Addresses revocation and password storage'
