questions:
  - id: amdahl
    prompt: "90% of a job can be parallelised perfectly. What is the maximum speed-up with unlimited cores?"
    answers: ["10", "10x", "10×"]
    explanation: "1 / (1 − 0.9) = 10: the serial 10% remains."
  - id: little
    prompt: "A service receives 400 requests per second and each takes 50 ms on average. How many requests are in flight on average?"
    answers: ["20"]
    explanation: "Little's law: L = λW = 400 × 0.05 = 20."
  - id: utilisation
    prompt: "Why do engineers avoid running a latency-sensitive server near 100% CPU?"
    options: ["CPUs overheat", "Queueing delay grows without bound as utilisation approaches 100%", "The OS refuses new processes", "Caches stop working"]
    answer: 1
    explanation: "For a simple queue the wait grows like ρ / (1 − ρ)."
  - id: fan-out
    prompt: "A page calls 100 back ends in parallel, each with a 1% chance of being slow. Roughly what share of page loads hits at least one slow call?"
    options: ["1%", "About 10%", "About 63%", "100%"]
    answer: 2
    explanation: "1 − 0.99¹⁰⁰ ≈ 0.63: tail latency amplifies with fan-out."
  - id: layer-tool
    prompt: "You suspect a request spends its time waiting in fsync. Which tool shows the duration of each system call?"
    options: ["dig", "strace -T", "EXPLAIN ANALYZE", "ping"]
    answer: 1
    explanation: "strace -T prints the time spent in each system call."
  - id: use-method
    prompt: "What does the USE method check for every resource?"
    options: ["Users, Sessions, Events", "Utilisation, Saturation, Errors", "Uptime, Speed, Energy", "Updates, Scans, Evictions"]
    answer: 1
    explanation: "A quick, systematic pass over CPUs, memory, disks and network."
  - id: recurring
    prompt: "The TLB, the page cache, the buffer pool and a CDN are all instances of which idea?"
    options: ["Indirection", "Caching based on locality", "Logging before acting", "Undecidability"]
    answer: 1
    explanation: "Keep a small, fast copy of what is likely to be used again."
