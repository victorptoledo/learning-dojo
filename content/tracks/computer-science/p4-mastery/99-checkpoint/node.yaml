  - { id: o2, text: "Build a paged B+tree over a write-back LRU buffer pool with pinning: a fixed page format, splits that grow the root, a linked leaf chain for range scans, and I/O you can predict", skills: [computer-science.database-internals, computer-science.memory-hierarchy, computer-science.data-representation, computer-science.file-systems] }
