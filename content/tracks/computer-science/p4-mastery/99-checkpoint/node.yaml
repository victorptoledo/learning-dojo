  hints:
    - |-
      Do the pool first and test it alone: it is the cache simulator of P1 with real pages. A `LinkedHashMap<Integer, Frame>` keeps the frames in order; on a hit, remove the frame and put it back so the first entry is always the least recently fetched. A `Frame` holds the `Page`, a pin count and a dirty flag. Eviction walks from the oldest frame to the first with no pins, writes it if dirty and drops it. Keep `nextPageId`, starting at `file.pageCount()`, for `allocate`.
    - |-
      In the tree, write `read(Page)` into a small record `Node(long[] keys, long[] values, int[] children, int next)` and `write(Page, Node)` back; then every operation is array work. `put` is a recursive insert that returns what happened below: whether the key was new, and, if the child split, the separator and the new page id. The parent inserts that pair at the child's index plus one and may split in turn; `put` grows a new root when the old root split. Unpin each page as soon as you are done with it, dirty only if you wrote it.
    - |-
      ```java
      private Outcome insertIntoLeaf(Page page, Node node, long key, long value) {
          int index = Arrays.binarySearch(node.keys(), key);
          if (index >= 0) { /* replace the value, write, return REPLACED */ }
          int at = -index - 1;
          long[] keys = with(node.keys(), at, key);
          long[] values = with(node.values(), at, value);
          if (keys.length <= LEAF_CAPACITY) { /* write, return ADDED */ }
          int half = (keys.length + 1) / 2;                    // 128 of 256
          Page right = pool.allocate();
          write(right, new Node(copyOfRange(keys, half, keys.length),
                  copyOfRange(values, half, values.length), null, node.next()));
          write(page, new Node(copyOf(keys, half), copyOf(values, half), null, right.id()));
          pool.unpin(right, true);
          return new Outcome(true, keys[half], right.id());   // the separator goes up
      }
      ```
