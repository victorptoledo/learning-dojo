id: computer-science.p1.cpu-scheduler
kind: kata
status: draft
title: "CPU Scheduler"
summary: "Simulate FCFS, shortest job first, shortest remaining time first and round robin with a context-switch cost, then compute turnaround, waiting and response times."
objectives:
  - { id: o1, text: "Implement preemptive and non-preemptive scheduling policies as an event simulation", skills: [computer-science.processes-scheduling] }
  - { id: o2, text: "Measure turnaround, waiting and response time, and see the trade-offs between policies", skills: [computer-science.processes-scheduling] }
prerequisites: [computer-science.p1.processes-scheduling]
difficulty: 3
estimated_minutes: 60
xp: 200
lesson: lesson.md
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-python, timeout_secs: 60 }
  hints:
    - |-
      Every policy is the same loop: keep a clock `t`, find the jobs that have arrived and still need time, pick one, run it for a while, advance `t`. If nothing is ready, jump `t` to the next arrival. What differs is only *which* job you pick and *for how long* it runs. For `srtf`, until when can a job run before the decision might change?
    - |-
      Write one helper that appends a slice and merges it with the previous one when the same job continues without a gap. For `round_robin`, sort the job indexes by arrival (sorted is stable), keep a `deque` of ready indexes and a pointer to the next job to admit, and admit every job with `arrival <= t` right after each slice and before you re-queue the preempted job. Remember which job ran last to decide whether to pay `switch_cost`.
    - |-
      ```python
      def srtf(jobs):
          _check(jobs)   # your validation helper: raise ValueError for bad input
          remaining = [job.burst for job in jobs]
          timeline, t = [], 0
          while any(remaining):
              ready = [i for i, left in enumerate(remaining) if left and jobs[i].arrival <= t]
              future = [jobs[i].arrival for i, left in enumerate(remaining) if left and jobs[i].arrival > t]
              if not ready:
                  t = min(future)
                  continue
              i = min(ready, key=lambda i: (remaining[i], jobs[i].arrival, i))
              until = min([t + remaining[i], *future])   # the next moment anything can change
              _add(timeline, jobs[i].name, t, until)   # your append-and-merge helper
              remaining[i] -= until - t
              t = until
          return timeline
      ```
