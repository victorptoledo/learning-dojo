bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'A CPU has a 32 KiB, 8-way set-associative L1 data cache with 64-byte lines. (1) How many sets does it have, and how is a 48-bit physical address split into tag, index and offset bits? (2) A program walks a 4096 × 4096 matrix of 4-byte ints, once row by row and once column by column. Estimate the miss rate of each walk on this cache and explain the difference. (3) Two threads each increment their own counter, stored next to each other in one array of longs, and the program gets slower with two threads than with one. Name the effect and give two fixes.'
  criteria:
    - '32 KiB / 64 B = 512 lines; 512 / 8 ways = 64 sets; offset 6 bits, index 6 bits, tag 48 − 12 = 36 bits'
    - 'Row by row reads consecutive ints: one miss per 64-byte line of 16 ints, a miss rate of about 1/16 (6.25%)'
    - 'Column by column jumps 16 KiB per access; every access touches a new line and lines are evicted before they are reused (the stride also maps many rows to the same sets), so almost every access misses'
    - 'Names false sharing: the two counters share one cache line, so coherence moves the line between cores on every write'
    - 'Fixes: pad or align each counter to its own 64-byte line (for example @Contended in Java, padding fields, or separate objects), or let each thread count locally and combine at the end'
