title: "Memory Hierarchy: Registers, L1/L2/L3 Caches and RAM"
summary: "Why memory is slow and caches make it fast: locality, cache lines, how an address splits into tag, index and offset, direct-mapped and set-associative caches, replacement and write policies, the three kinds of miss, coherence and false sharing, and how to write cache-friendly code."
objectives:
  - { id: o1, text: "Explain temporal and spatial locality and why a hierarchy of small fast and large slow memories works", skills: [computer-science.memory-hierarchy] }
  - { id: o2, text: "Split an address into tag, set index and offset, and trace hits, misses and evictions in a set-associative cache with LRU", skills: [computer-science.memory-hierarchy] }
  - { id: o3, text: "Recognise cache-unfriendly code (strided access, pointer chasing, false sharing) and rewrite it", skills: [computer-science.memory-hierarchy] }
prerequisites: [computer-science.p1.cpu-architecture]
