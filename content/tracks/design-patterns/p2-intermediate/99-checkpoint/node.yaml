kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-java, timeout_secs: 180 }
  hints:
    - |-
      Three problems hide in `QuoteService.quote`: how the request is passed in, how the rules are applied, and who hears about the result. Which pattern fixes seven positional parameters? If each rule took the request and the quote so far and returned the next quote, what would the engine's loop look like? And who should decide that the audit log is interested?
    - |-
      `QuoteRequest` is a record that validates in its compact constructor, with a nested `Builder` whose `build()` calls the canonical constructor. Each rule in `PricingSteps` is a lambda that returns `quote` unchanged or `quote.adjusted(newCents, "label")`. `QuoteEngine` folds the steps, then loops over a `CopyOnWriteArrayList<QuoteListener>`, catching `RuntimeException` per listener. `QuoteService` subscribes two lambdas in its constructor.
    - |-
      ```java
      public Quote quote(QuoteRequest request) {
          Quote quote = new Quote(request.customer(), request.quantity() * request.unitCents(), List.of());
          for (PricingStep step : steps) {
              quote = step.apply(request, quote);
          }
          for (QuoteListener listener : listeners) {
              try {
                  listener.quoted(request, quote);
              } catch (RuntimeException e) {
                  failedNotifications++;
              }
          }
          return quote;
      }

      public Subscription subscribe(QuoteListener listener) {
          listeners.add(listener);
          return () -> listeners.remove(listener);
      }
      ```
