title: "📋 Checkpoint 2: Intermediate"
summary: "Prove the intermediate patterns: a quiz on creational patterns, observer, command, chains, state and visitor, and a quote service refactored into a builder, a pipeline of pricing steps and observers."
objectives:
  - { id: o1, text: "Explain the creational patterns, observer, command, chain of responsibility, state, visitor and composite in your own words", skills: [design-patterns.creational, design-patterns.observer-command, design-patterns.state-visitor] }
  - { id: o2, text: "Refactor a seven-parameter service into a validated builder, a pipeline of steps and isolated observers", skills: [design-patterns.creational, design-patterns.observer-command] }
