  - { id: o1, text: "Explain builds, package boundaries, project references, soundness, variance and type-checking performance, and connect them to the rest of the track", skills: [typescript.production-builds, typescript.monorepos, typescript.soundness-performance] }
  - { id: o2, text: "Finish a small library whose public types are derived from constants, whose input is validated at runtime, whose async updates are atomic and race-free, and whose API is closed by package exports", skills: [typescript.utility-conditional, typescript.generics, typescript.runtime-validation, typescript.async-errors, typescript.soundness-performance, typescript.monorepos] }
