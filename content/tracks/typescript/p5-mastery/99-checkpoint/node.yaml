kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-node, timeout_secs: 90 }
  hints:
    - |-
      Start with the types in `definitions.ts`: what does `FlagValue` return for each kind, and how do you keep `["classic", "one-page", "wizard"]` as literals instead of `string[]`? Then `parseOverrides`, then the client. For `refresh`, list what can go wrong (load fails, times out, payload invalid, a newer refresh started, a listener throws) and decide, for each, whether the state may already have changed.
    - |-
      `defineFlags<const D extends Definitions>(definitions: D & CheckDefaults<D>)`, where `CheckDefaults` maps each variant flag to `{ readonly default: V }` with `V` inferred from its variants. In `parseOverrides`, build a `Record<string, z.ZodType>` with `z.boolean()`, `z.number().min().max()` and `z.enum(variants)`, each `.optional()`, and parse with `z.strictObject(shape)`; an `"unrecognized_keys"` issue has a `keys` array. In `refresh`, take a number from a counter before loading and compare it with the latest after; race `load(signal)` against the signal itself so a `load` that ignores it still times out; validate before touching the state, swap the overrides in one assignment, then notify.
    - |-
      ```ts
      export type Listener<V> = (value: V, previous: V) => void;

      async refresh(load: (signal: AbortSignal) => Promise<unknown>, options: RefreshOptions = {}) {
        const id = ++this.#latest;
        const signal = AbortSignal.timeout(options.timeoutMs ?? 1_000);
        let payload: unknown;
        try {
          payload = await untilAborted(load(signal), signal); // rejects with signal.reason on abort
        } catch (error) {
          throw new FlagsError("refresh failed: the overrides could not be loaded", { cause: error });
        }
        if (id !== this.#latest) return { changed: [], stale: true };
        const parsed = parseOverrides(this.#definitions, payload);
        if (!parsed.ok) throw new FlagsError("refresh failed: invalid overrides", { issues: parsed.issues });
        const before = this.snapshot();
        this.#overrides = parsed.overrides;
        const after = this.snapshot();
        const changed = this.#keys.filter((key) => before[key] !== after[key]);
        // call each changed flag's listeners in try/catch, then throw an AggregateError if any failed
        return { changed, stale: false };
      }
      ```
