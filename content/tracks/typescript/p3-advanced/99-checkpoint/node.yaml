id: typescript.p3.checkpoint
kind: checkpoint
status: draft
title: "📋 Checkpoint 3: Advanced"
summary: "Prove the advanced phase: a quiz and an integration kata, a webhook inbox that types an untyped vendor module, validates events with a zod discriminated union, dispatches them to typed handlers and drops duplicates."
objectives:
  - { id: o1, text: "Explain runtime validation, declaration files, type-level tests and typed APIs in your own words", skills: [typescript.runtime-validation, typescript.declaration-files, typescript.testing-linting] }
  - { id: o2, text: "Build a boundary module that types a JavaScript dependency, validates untrusted input and dispatches it to handlers typed by event", skills: [typescript.runtime-validation, typescript.declaration-files, typescript.generics, typescript.async-errors] }
prerequisites: [typescript.p3.typed-events]
difficulty: 4
estimated_minutes: 90
xp: 400
closes_phase: p3
covers_skills: [typescript.runtime-validation, typescript.declaration-files, typescript.testing-linting]
lesson: lesson.md
quiz: quiz.yaml
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-node, timeout_secs: 60 }
  hints:
    - |-
      Go file by file: the declaration file first (read `signature.js`: what goes in, what comes out?), then the schema, then the inbox. In `receive`, which steps can fail before you know the event id? And at what moment must an id be "taken", so that a second delivery arriving during an `await` sees it?
    - |-
      The `.d.ts` needs only `export declare function` lines with real parameter and return types. The schema is `z.discriminatedUnion("type", [z.object({ ...base, type: z.literal("payment.succeeded"), data: ... }), ...])`, where `base` holds `id` and `createdAt: z.iso.datetime().transform((text) => new Date(text))`; use `z.int().positive()`, `z.email()` and `.brand<"PaymentId">()`. In the inbox keep two sets, ids done and ids in flight: check both and add to "in flight" **before** the first `await`, remove it in `finally`, and add to "done" only after every handler succeeded.
    - |-
      ```ts
      type AnyHandler = (event: EventOf<EventType>) => void | Promise<void>;

      on<T extends EventType>(type: T, handler: Handler<T>): () => void {
        const stored = handler as unknown as AnyHandler; // the one cast, kept here
        this.#handlers.set(type, [...(this.#handlers.get(type) ?? []), stored]);
        return () => this.#handlers.set(type, (this.#handlers.get(type) ?? []).filter((h) => h !== stored));
      }

      // in receive(), after the signature, JSON.parse in try/catch and parseEvent:
      if (this.#done.has(event.id) || this.#inFlight.has(event.id)) {
        return { status: "duplicate", eventId: event.id };
      }
      this.#inFlight.add(event.id);
      try {
        for (const handler of handlers) await handler(event);
      } catch (error) {
        return { status: "failed", eventId: event.id, error: error instanceof Error ? error : new Error(String(error)) };
      } finally {
        this.#inFlight.delete(event.id);
      }
      this.#done.add(event.id);
      ```
requirements:
  - kind: docker-engine
    name: Docker Desktop running
    why: Your kata is checked inside a container.
    install_hint: "install Docker Desktop (winget install Docker.DockerDesktop) and start it"
  - kind: docker-image
    name: dojo-node runner image
    image: dojo-node
    why: The Node.js 26 container with TypeScript 7 and zod that type-checks your code and runs the tests.
