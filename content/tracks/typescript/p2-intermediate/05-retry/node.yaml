id: typescript.p2.retry
kind: kata
status: draft
title: "Retry: Async Helpers with Typed Errors"
summary: "Write sleep with AbortSignal, withTimeout, retry with exponential backoff and shouldRetry, and mapLimit with ordered results, handling unknown errors with custom error classes."
objectives:
  - { id: o1, text: "Build promises by hand, cancel them with AbortSignal and leave no timer behind", skills: [typescript.async-errors] }
  - { id: o2, text: "Retry with backoff, narrow unknown errors and report failures with custom error classes and cause", skills: [typescript.async-errors] }
  - { id: o3, text: "Limit concurrency while keeping results in order", skills: [typescript.async-errors, typescript.generics] }
prerequisites: [typescript.p2.async-errors]
difficulty: 3
estimated_minutes: 70
xp: 300
lesson: lesson.md
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-node, timeout_secs: 90 }
  hints:
    - |-
      Start with `toError` and `sleep`; the rest builds on them. For `sleep`, you need `new Promise((resolve, reject) => ...)`: which three things can happen (the signal is already aborted, the time passes, the signal is aborted during the wait), and what must you clean up in each case? `retry` is a `for` loop with `try`/`catch` around `await task(attempt)`.
    - |-
      In `sleep`, keep the timer id so the abort listener can `clearTimeout` it, and add the listener with `{ once: true }`. `withTimeout` creates an `AbortController`, starts a timer that aborts it with a `TimeoutError` and rejects, and calls `task(controller.signal).then(resolve, reject).finally(() => clearTimeout(timer))`. In `retry`, collect every error in an array; call `shouldRetry(error)` first and rethrow when it says no; wait `delayMs * factor ** (attempt - 1)` between attempts. For `mapLimit`, start `limit` workers that each take the next index until none are left.
    - |-
      ```ts
      export async function mapLimit<T, R>(
        items: readonly T[],
        limit: number,
        fn: (item: T, index: number) => Promise<R>,
      ): Promise<R[]> {
        const results = new Array<R>(items.length);
        let next = 0;
        let failed = false;
        const worker = async () => {
          while (!failed && next < items.length) {
            const index = next;
            next += 1;
            // await fn(...) into results[index]; on an error set failed = true and rethrow
          }
        };
        await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
        return results;
      }
      ```
