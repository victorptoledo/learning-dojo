# It runs, but a security review found a dozen problems.
# todo: harden it (see README.md)
services:
  api:
    image: ghcr.io/dojo-example/orders-api:latest
    privileged: true
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: db
      DATABASE_PASSWORD: orders-pass-123
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db

  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orders
      POSTGRES_DB: orders
      POSTGRES_PASSWORD: orders-pass-123
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  db-data: {}
