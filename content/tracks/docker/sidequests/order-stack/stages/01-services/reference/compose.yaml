services:
  api:
    build: .
    image: orders:2.1.0
    environment:
      DATABASE_HOST: db
      REDIS_ADDR: cache:6379

  worker:
    image: orders:2.1.0
    command: ["worker"]
    environment:
      DATABASE_HOST: db
      REDIS_ADDR: cache:6379

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_DB: orders
      POSTGRES_PASSWORD: orders-dev
    volumes:
      - db-data:/var/lib/postgresql

  cache:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cache-data:/data

  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data: {}
  cache-data: {}
