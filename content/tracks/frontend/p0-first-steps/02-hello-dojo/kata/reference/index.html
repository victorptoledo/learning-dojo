<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ada Lovelace · Business card</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <article class="card">
        <h1>Ada Lovelace</h1>
        <p class="role">Frontend developer in training</p>
        <ul class="links">
          <li><a href="https://developer.mozilla.org/">MDN, where I read the docs</a></li>
          <li><a href="mailto:ada@example.com">ada@example.com</a></li>
        </ul>
        <button type="button" id="say-hello">Say hello</button>
        <output id="greeting" for="say-hello"></output>
      </article>
    </main>
  </body>
</html>
