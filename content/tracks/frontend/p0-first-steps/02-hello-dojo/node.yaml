id: frontend.p0.hello-dojo
kind: kata
status: draft
title: "Hello, Dojo: a Business Card Page"
summary: "Build a semantic business card page with a centered card, a real button and a few lines of JavaScript, and meet the dojo's browser checks: Chromium, axe-core and html-validate."
objectives:
  - { id: o1, text: "Write a valid HTML document with lang, title, main, a heading and a list of links", skills: [frontend.web-platform, frontend.html-semantics] }
  - { id: o2, text: "Center a box with CSS, cap its width and keep it on a phone screen", skills: [frontend.web-platform] }
  - { id: o3, text: "Respond to a button click with textContent in a module script", skills: [frontend.web-platform] }
prerequisites: [frontend.p0.how-the-web-works]
difficulty: 1
estimated_minutes: 30
xp: 100
lesson: lesson.md
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-web, timeout_secs: 120 }
  hints:
    - |-
      Start with the visible test: it only needs a `<title>`. Then follow README.md from top to bottom. Which element holds the main content of a page, and which one stands alone like a card? What does the browser need to know to pronounce the text?
    - |-
      `<html lang="en">`, then `<main>` → `<article class="card">` with `<h1>`, `<p class="role">`, `<ul>` of `<li><a href>`, the button and `<output id="greeting">`. For the CSS: `box-sizing: border-box`, `max-width: 24rem` on the card, and `body { display: grid; place-items: center; min-height: 100vh; margin: 0; }`. In app.js: `button.addEventListener("click", ...)` and `output.textContent = ...`.
    - |-
      ```js
      export function greeting(name) {
        const who = name?.trim() || "the dojo";
        return `Hello from ${who}!`;
      }

      button.addEventListener("click", () => {
        output.textContent = greeting(name.textContent);
      });
      ```

      If axe-core reports `target-size`, links alone on a line need at least 24px of height: `display: inline-block; padding-block: 0.25rem`.
requirements:
  - kind: docker-engine
    name: Docker Desktop running
    why: Your kata is checked inside a container.
    install_hint: "install Docker Desktop (winget install Docker.DockerDesktop) and start it"
  - kind: docker-image
    name: dojo-web runner image
    image: dojo-web
    why: The Node.js 26 container with headless Chromium, axe-core and html-validate that loads your page and runs the tests.
