  - { name: "Purple Belt", required_xp: 1500, title: "Event Wrangler" }
  - { name: "Brown Belt", required_xp: 2500, title: "Web Performance Ninja" }
  - { name: "Black Belt", required_xp: 4000, title: "Platform Guardian" }
