id: cpp.p4.lru-cache
kind: kata
status: draft
title: "LRU Cache: O(1) Operations with list::splice and unordered_map"
summary: "Write a generic least-recently-used cache with a custom hash, move-only values, an eviction callback and hit and miss counters, where get, put and erase run in constant time on a workload of 400,000 operations."
objectives:
  - { id: o1, text: "Combine std::list and std::unordered_map so every operation is O(1), and keep iterators valid with splice", skills: [cpp.performance, cpp.containers-algorithms] }
  - { id: o2, text: "Write a class template with a defaulted hash parameter and a std::function callback", skills: [cpp.templates-concepts, cpp.performance] }
  - { id: o3, text: "Measure an operation's cost on a large input and explain it with complexity", skills: [cpp.performance] }
prerequisites: [cpp.p4.compile-time]
difficulty: 4
estimated_minutes: 60
xp: 400
lesson: lesson.md
kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-cpp, timeout_secs: 180 }
  hints:
    - |-
      The members are already there: `entries_` is a list with the most recent entry first, and `index_` maps each key to its list iterator. Which of the two answers "is this key cached?", and which answers "who is the least recently used?" Both answers must take constant time.
    - |-
      `get`: find the key in `index_`; on a hit, move its node to the front with `entries_.splice(entries_.begin(), entries_, it)` (no copy, and the iterator in the map stays valid) and return a pointer to `it->second`. `put` of a known key replaces the value and splices it to the front. `put` of a new key evicts `entries_.back()` first when `size() == capacity_` (call `on_evict_` if it is set, erase the key from `index_`, `pop_back`), then `emplace_front` and store `entries_.begin()` in the map.
    - |-
      ```cpp
      void put(K key, V value) {
          if (const auto found = index_.find(key); found != index_.end()) {
              found->second->second = std::move(value);
              entries_.splice(entries_.begin(), entries_, found->second);
              return;
          }
          if (index_.size() == capacity_) {
              auto& [old_key, old_value] = entries_.back();
              // call on_evict_ if set, erase old_key from index_, then pop_back
          }
          entries_.emplace_front(key, std::move(value));
          index_.emplace(std::move(key), entries_.begin());
      }
      ```
