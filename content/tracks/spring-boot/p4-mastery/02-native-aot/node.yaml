id: spring-boot.p4.native-aot
kind: lesson
status: draft
title: "AOT, Native Images and Fast Startup"
summary: "Spring AOT, GraalVM native images, the JVM AOT cache and when each one is worth it."
objectives:
  - { id: o1, text: "Explain what Spring AOT processing generates", skills: [spring.native-aot] }
  - { id: o2, text: "Build a native image of a Boot service and handle its limits", skills: [spring.native-aot] }
  - { id: o3, text: "Compare native images with the JVM AOT cache for startup", skills: [spring.native-aot] }
prerequisites: [spring-boot.p4.production-boot]
difficulty: 5
estimated_minutes: 35
xp: 400
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Compare three ways to start a Spring Boot service faster (native image, the JVM AOT cache, CRaC) and recommend one for a service that scales from zero on demand. Justify it.'
  criteria:
    - 'Describes each option accurately'
    - 'Names the build-time closed-world trade-off of AOT and native'
    - 'The recommendation fits scale-to-zero'
    - 'Mentions measuring before deciding'
