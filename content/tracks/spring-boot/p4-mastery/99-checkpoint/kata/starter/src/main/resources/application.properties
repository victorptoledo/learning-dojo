spring.application.name=checkpoint-invoices
spring.main.banner-mode=off
logging.level.root=warn
spring.jpa.open-in-view=false

billing.invoice-prefix=INV
billing.payment-term-days=30
billing.formatter=dojo.billing.internal.BoxedFormatter
notifications.reminder-days-before=3

# Handy on a laptop: every endpoint and every detail, for everyone.
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
