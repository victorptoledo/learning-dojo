spring.application.name=checkpoint-invoices
spring.main.banner-mode=off
logging.level.root=warn
spring.jpa.open-in-view=false

billing.invoice-prefix=INV
billing.payment-term-days=30
billing.formatter=dojo.billing.internal.BoxedFormatter
notifications.reminder-days-before=3

# Production: only what the platform needs, and health details only for admins.
# The liveness and readiness probes are on by default in Boot 4.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
