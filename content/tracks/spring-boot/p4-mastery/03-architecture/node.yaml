id: spring-boot.p4.architecture
kind: lesson
status: draft
title: "Application Architecture with Spring"
summary: "Package by feature, modular monoliths with Spring Modulith, hexagonal ports and when to split services."
objectives:
  - { id: o1, text: "Organise a Boot application by feature with clear module boundaries", skills: [spring.architecture] }
  - { id: o2, text: "Verify module boundaries and use events between modules", skills: [spring.architecture] }
  - { id: o3, text: "Decide when a module should become a separate service", skills: [spring.architecture] }
prerequisites: [spring-boot.p4.production-boot]
difficulty: 5
estimated_minutes: 40
xp: 400
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Sketch the modules of an online shop built as a modular monolith: name the modules, their public APIs and the events between them, and say which module you would extract first into a service, and why.'
  criteria:
    - 'Modules follow business capabilities with clear public APIs'
    - 'Modules communicate through events where possible'
    - 'Each module owns its data'
    - 'The extraction choice is justified by deployment, scaling or isolation'
