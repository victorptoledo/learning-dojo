schema_version: 2
id: spring-boot
name: "Spring Boot"
archetype: platform
category: "Frameworks"
icon: "🌱"
description: "Spring Boot 4 on Java 25: dependency injection, REST APIs, validation, JPA, testing, security and production. Take the Modern Java track first."
status: draft
bridges_available: [java, python, javascript, csharp, go]
belts:
  - { name: "White Belt", required_xp: 0, title: "Bean Counter" }
  - { name: "Yellow Belt", required_xp: 300, title: "Controller Crafter" }
  - { name: "Green Belt", required_xp: 800, title: "Validation Guard" }
  - { name: "Purple Belt", required_xp: 1500, title: "Repository Ranger" }
  - { name: "Brown Belt", required_xp: 2500, title: "Security Sentinel" }
  - { name: "Black Belt", required_xp: 4000, title: "Production Pilot" }
  - { name: "Sensei", required_xp: 6500, title: "Spring Grandmaster" }
phases:
  - { id: p0, dir: p0-first-steps, title: "First Steps", goal: "What Spring Boot does, a first project and a first endpoint" }
  - { id: p1, dir: p1-fundamentals, title: "Fundamentals", goal: "Beans and injection, configuration, REST controllers, validation and errors" }
  - { id: p2, dir: p2-intermediate, title: "Intermediate", goal: "Spring Data JPA, transactions, testing slices and HTTP clients" }
  - { id: p3, dir: p3-advanced, title: "Advanced", goal: "Spring Security, observability, events, async work and caching" }
  - { id: p4, dir: p4-mastery, title: "Mastery", goal: "Running Boot in production, native images and application architecture" }
requirements:
  - kind: tool
    name: JDK 25 (java)
    command: java
    version_args: ["--version"]
    min_version: "25"
    required: false
    why: Runs the application and the visible tests in VS Code. The grading checks run in Docker and do not need it.
    install_hint: "install Temurin 25: winget install EclipseAdoptium.Temurin.25.JDK, then reopen the terminal"
  - kind: vscode-extension
    name: Extension Pack for Java
    id: vscjava.vscode-java-pack
    required: false
    why: Shows errors as you type and adds the Run Test and Debug buttons to JUnit tests.
  - kind: vscode-extension
    name: Spring Boot Extension Pack
    id: vmware.vscode-boot-dev-pack
    required: false
    why: Completes application.properties, shows the beans and request mappings, and runs the app from the Spring Boot Dashboard.
