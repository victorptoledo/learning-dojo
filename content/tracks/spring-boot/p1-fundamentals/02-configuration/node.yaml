id: spring-boot.p1.configuration
kind: lesson
status: draft
title: "Configuration Properties and Profiles"
summary: "Move settings out of the code: application.yaml, typed @ConfigurationProperties records and profiles."
objectives:
  - { id: o1, text: "Read settings into a validated @ConfigurationProperties record", skills: [spring.configuration] }
  - { id: o2, text: "Override settings with profiles, environment variables and arguments", skills: [spring.configuration] }
prerequisites: [spring-boot.p1.dependency-injection]
difficulty: 2
estimated_minutes: 30
xp: 200
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Write a @ConfigurationProperties record for the settings of an email sender (host, port, sender address, timeout) with validation, and explain how you would set different values in development and production.'
  criteria:
    - 'The record is annotated and validated correctly'
    - 'Uses appropriate types (int, Duration)'
    - 'Explains profiles and environment variables, with precedence'
    - 'Keeps secrets out of the repository'
