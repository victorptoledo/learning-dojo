id: spring-boot.p1.validation-errors
kind: lesson
status: draft
title: "Validation and Problem Details"
summary: "Reject bad input at the edge with Bean Validation and answer every error with a clear Problem Detail."
objectives:
  - { id: o1, text: "Validate request bodies with Jakarta Bean Validation annotations and @Valid", skills: [spring.validation-errors] }
  - { id: o2, text: "Map exceptions to responses with @RestControllerAdvice and ProblemDetail", skills: [spring.validation-errors] }
prerequisites: [spring-boot.p1.todo-api]
difficulty: 2
estimated_minutes: 35
xp: 200
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Describe how your API answers four kinds of failure: an invalid field, malformed JSON, a duplicate resource and an unknown id. Give the status code and an example Problem Details body for each.'
  criteria:
    - 'Uses Bean Validation and @Valid for invalid fields (400 with field errors)'
    - 'Malformed JSON answered as 400 Problem Details'
    - 'Duplicate as 409 and unknown id as 404'
    - 'One advice class translates domain exceptions; no internals leaked'
