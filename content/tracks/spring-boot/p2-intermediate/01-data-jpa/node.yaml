id: spring-boot.p2.data-jpa
kind: lesson
status: draft
title: "Spring Data JPA and Transactions"
summary: "Map entities, get repositories for free and keep changes consistent with transactions."
objectives:
  - { id: o1, text: "Map a class to a table with JPA annotations", skills: [spring.data-jpa] }
  - { id: o2, text: "Use JpaRepository and derived query methods", skills: [spring.data-jpa] }
  - { id: o3, text: "Put @Transactional on service methods and know when it rolls back", skills: [spring.data-jpa] }
prerequisites: [spring-boot.p1.checkpoint]
difficulty: 3
estimated_minutes: 40
xp: 300
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Explain what happens, step by step, in a @Transactional service method that loads an entity, changes it and then throws a runtime exception. Then explain what changes if the same method is called from another method of the same class.'
  criteria:
    - 'Describes managed entities and dirty checking'
    - 'Explains the rollback on a runtime exception'
    - 'Explains that self-invocation bypasses the proxy and the transaction'
    - 'Mentions keeping transactions short'
