id: spring-boot.p2.jpa-queries
kind: lesson
status: draft
title: "Relationships, Queries and Pagination"
summary: "Relationships between entities, the N+1 problem, JPQL queries, projections and pages."
objectives:
  - { id: o1, text: "Map one-to-many and many-to-one relationships and choose fetch types", skills: [spring.jpa-queries] }
  - { id: o2, text: "Spot and fix N+1 queries with fetch joins or entity graphs", skills: [spring.jpa-queries] }
  - { id: o3, text: "Write @Query methods, projections and paginated queries", skills: [spring.jpa-queries] }
prerequisites: [spring-boot.p2.data-jpa]
difficulty: 3
estimated_minutes: 40
xp: 300
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'A page that lists 50 orders with their customer names runs 51 SQL queries. Explain why, show two ways to fix it, and describe how you would notice the problem in the first place.'
  criteria:
    - 'Identifies the N+1 caused by lazy loading'
    - 'Shows a fetch join or an entity graph'
    - 'Shows a projection into a record as another fix'
    - 'Mentions watching SQL logs or statistics'
