kata:
  statement: kata/README.md
  starter: kata/starter
  tests: kata/tests
  reference: kata/reference
  runner: { image: dojo-java, timeout_secs: 180 }
  hints:
    - |-
      `Product.reserve` already changes the stock and throws when there is not enough. What decides whether the stock of the lines reserved before the failing one is kept or undone? And when the service returns an order, are its lines already loaded?
    - |-
      Put `@Transactional` on `place` and `cancel`: the `ShopException` is a runtime exception, so it rolls back every `reserve` made in the same transaction. The products you change are managed entities, so no `save` is needed for them; save the new `ShopOrder` (its lines cascade). Load orders with `left join fetch o.lines` and build the `OrderView` before the method returns.
    - |-
      ```java
      @Transactional
      public OrderView place(OrderRequest request) {
          ShopOrder order = new ShopOrder();
          for (OrderRequest.Line line : request.lines()) {
              String sku = line.sku().strip();
              Product product = products.findBySku(sku).orElseThrow(() -> ShopException.unknownProduct(sku));
              product.reserve(line.quantity());
              order.addLine(sku, line.quantity(), product.getPriceCents());
          }
          return OrderView.of(orders.save(order));
      }

      @Transactional
      public OrderView cancel(long id) {
          ShopOrder order = orders.findWithLines(id).orElseThrow(() -> ShopException.orderNotFound(id));
          order.cancel();
          // release the stock of each line
          return OrderView.of(order);
      }
      ```
