id: spring-boot.p2.testing-spring
kind: lesson
status: draft
title: "Testing Spring Applications"
summary: "Unit tests without Spring, test slices, @SpringBootTest, MockMvc, @MockitoBean and Testcontainers."
objectives:
  - { id: o1, text: "Choose between a plain unit test, a slice and a full context", skills: [spring.testing] }
  - { id: o2, text: "Test controllers with MockMvc and repositories with @DataJpaTest", skills: [spring.testing] }
  - { id: o3, text: "Replace beans with @MockitoBean and keep the context cache warm", skills: [spring.testing] }
prerequisites: [spring-boot.p2.library-api]
difficulty: 3
estimated_minutes: 40
xp: 250
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'For a feature with a controller, a service and a repository with one custom query, describe which tests you would write at each level (unit, slice, full context) and what each one checks.'
  criteria:
    - 'Unit tests for the service rules without Spring'
    - '@WebMvcTest with @MockitoBean for the HTTP behaviour'
    - '@DataJpaTest (or Testcontainers) for the custom query'
    - 'Few @SpringBootTest flows and awareness of context caching'
