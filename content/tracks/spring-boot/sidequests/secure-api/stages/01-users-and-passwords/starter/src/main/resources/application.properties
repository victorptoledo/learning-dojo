spring.application.name=secure-api
spring.main.banner-mode=off
logging.level.root=warn
spring.jpa.open-in-view=false

# The first administrator, created at startup when missing (stage 3).
# A real deployment reads the password from the environment, never from a committed file.
secure.admin.username=root
secure.admin.password=${SECURE_ADMIN_PASSWORD:root-password-for-dev}

# How long an account stays locked after too many failed logins (stage 4).
secure.lockout.attempts=5
secure.lockout.duration=PT15M
