id: system-design.p2.read-heavy-designs
kind: lesson
status: draft
title: "Read-Heavy Designs: Fan-out, Denormalization and Read Models"
summary: "Fan-out on read versus on write and the hybrid for celebrities, denormalization, materialized views and CQRS read models, hot counters and cursor pagination."
objectives:
  - { id: o1, text: "Design a feed with fan-out on write, on read, or a hybrid, and justify the threshold", skills: [system-design.read-heavy] }
  - { id: o2, text: "Decide what to denormalise or project into a read model, and how it stays fresh", skills: [system-design.read-heavy] }
  - { id: o3, text: "Handle hot counters and paginate large results with cursors", skills: [system-design.read-heavy] }
prerequisites: [system-design.p2.load-shedding-queue]
difficulty: 3
estimated_minutes: 45
xp: 250
lesson: lesson.md
bridges: bridges
quiz: quiz.yaml
exercise:
  task: 'Design the "following" activity feed of a code-hosting site: users follow repositories and people, and the feed shows stars, releases and pushes, newest first. Some repositories have 300,000 followers and a busy one gets a push every minute. Describe the data model, how events reach feeds (push, pull or hybrid), how unfollows and private repositories are handled, how pagination works, and how fresh the feed is.'
  criteria:
    - 'Chooses push, pull or a hybrid with a follower threshold and explains the write amplification'
    - 'Stores ids in bounded per-user inboxes and fans out asynchronously through a queue'
    - 'Applies unfollows and visibility (private repositories) at read time'
    - 'Uses cursor pagination with a unique tie-breaker'
    - 'States the expected staleness and how a user sees their own actions'
