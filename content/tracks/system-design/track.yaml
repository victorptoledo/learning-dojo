schema_version: 2
id: system-design
name: "System Design"
archetype: concept
category: "Architecture & Engineering"
icon: "🏛️"
description: "Design systems that scale and survive failure: requirements and estimates, DNS and CDNs, load balancing and consistent hashing, storage engines, caching, overload control, replication and sharding, consistency, messaging, consensus and resilience at scale. Building blocks are practised as Java katas."
status: draft
bridges_available: [java, python, javascript, csharp, go]
belts:
  - { name: "White Belt", required_xp: 0, title: "Monolith Builder" }
  - { name: "Yellow Belt", required_xp: 300, title: "Cache Master" }
  - { name: "Green Belt", required_xp: 800, title: "Sharding Specialist" }
  - { name: "Purple Belt", required_xp: 1500, title: "Message Queue Wrangler" }
  - { name: "Brown Belt", required_xp: 2500, title: "High Availability Guru" }
  - { name: "Black Belt", required_xp: 4000, title: "Distributed Systems Titan" }
  - { name: "Sensei", required_xp: 6000, title: "Staff+ Infrastructure Architect" }
phases:
  - { id: p0, dir: p0-first-steps, title: "First Steps", goal: "What system design is, how to frame a problem and estimate it, and a first Java kata" }
  - { id: p1, dir: p1-fundamentals, title: "Fundamentals", goal: "DNS and CDNs, load balancing, consistent hashing, storage engines and Bloom filters" }
  - { id: p2, dir: p2-intermediate, title: "Intermediate", goal: "Caching, overload control and back-pressure, and designs for read-heavy systems" }
  - { id: p3, dir: p3-advanced, title: "Advanced", goal: "Replication, partitioning and rebalancing, consistency models and quorums, and messaging" }
  - { id: p4, dir: p4-mastery, title: "Mastery", goal: "Consensus and leases, resilience at scale, and designing a system end to end" }
requirements:
  - kind: tool
    name: JDK 25 (java)
    command: java
    version_args: ["--version"]
    min_version: "25"
    required: false
    why: Runs the katas and their visible tests in VS Code. The grading checks run in Docker and do not need it.
    install_hint: "install Temurin 25: winget install EclipseAdoptium.Temurin.25.JDK, then reopen the terminal"
  - kind: vscode-extension
    name: Extension Pack for Java
    id: vscjava.vscode-java-pack
    required: false
    why: Shows errors as you type and adds the Run Test and Debug buttons to JUnit tests.
