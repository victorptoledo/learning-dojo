# content/tracks/docker/p2-intermediate/03-slim-service/node.yaml (shortened)
# A platform-archetype kata: the learner writes a Dockerfile, the runner builds and inspects it.
# `image: dojo-docker` selects the Docker profile (crates/dojo-runner/src/image_check.rs):
# build on the host engine with --network none and a throwaway tag, collect facts about the
# image into /facts, start it once with no network, then run hadolint and the bats tests in
# the dojo-docker image. Everything is removed afterwards.
id: docker.p2.slim-service
kind: kata
status: draft
title: "Slim Service: a Multi-stage Build"
summary: "Shrink a 300 MB single-stage image to a small one that ships only the binary and runs as a non-root user."
objectives:
  - { id: o1, text: "Split a Dockerfile into a build stage and a minimal runtime stage", skills: [docker.multi-stage] }
  - { id: o2, text: "Run the final image as a non-root user", skills: [docker.dockerfile-security] }
prerequisites: [docker.p2.multi-stage-builds]
difficulty: 3
estimated_minutes: 40
xp: 250
lesson: lesson.md
kata:
  statement: kata/README.md
  starter: kata/starter        # main.go, go.mod, a working single-stage Dockerfile, tests/visible.bats
  tests: kata/tests            # grading.bats and, when the image is run with arguments, commands.txt
  reference: kata/reference    # the multi-stage Dockerfile
  runner: { image: dojo-docker, timeout_secs: 300 }
  hints: ["...", "...", "..."]

# kata/tests/grading.bats (two of the eight hidden tests):
#
#   load /opt/dojo/facts
#
#   @test "ships no Go toolchain" {
#       ! image_has_path /usr/local/go || fail "/usr/local/go is in the final image"
#   }
#
#   @test "answers on /health" {
#       run http_get 8080 /health      # the grader shares the running container's network
#       assert_success
#       assert_output "ok"
#   }
#
# kata/tests/commands.txt (another kata): each line runs `docker run --rm IMAGE args`
# and keeps the output for cmd_out, cmd_err and cmd_status:
#
#   version: -version
